---
# Platform support values shared by the playbook and role defaults so a new
# Ubuntu release or architecture only needs registering in one place.
supported_ubuntu_versions:
  - "26.04"
linux_release_architecture_map:
  x86_64: amd64
  amd64: amd64
  aarch64: arm64
  arm64: arm64
workstation_architecture: >-
  {{ linux_release_architecture_map[ansible_facts["architecture"]] }}

# Shared retry policy for remote fetches and refreshes: transient
# connection errors and server-side failures are retried, permanent
# failures stay loud. Tune the policy here, not per task.
remote_fetch_retries: 3
remote_fetch_retry_delay: 10
# HTTP client statuses that repeat transiently rather than
# deterministically; every retry loop's status classification consults
# this one list so the transient set cannot drift between tasks.
remote_fetch_transient_status_codes:
  - 408
  - 429
