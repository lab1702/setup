---
# Main playbook for ansible-pull
# Usage: sudo ansible-pull -U https://github.com/lab1702/setup.git

- name: Setup Ubuntu Developer Workstation
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    user_name: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) }}"
    # supported_ubuntu_versions, linux_release_architecture_map, and
    # workstation_architecture are shared with role defaults via
    # group_vars/all.yml.
    desktop_session_directories:
      - /usr/share/xsessions
      - /usr/share/wayland-sessions
    # .npmrc is the standard home of npm auth tokens, so it must stay
    # private; .bashrc keeps the conventional world-readable mode.
    workstation_user_configuration_entries:
      - path: "{{ workstation_user_home }}/.npmrc"
        regexp: '^\s*prefix\s*='
        line: prefix={{ workstation_user_home }}/.npm-global
        mode: "0600"
      - path: "{{ workstation_user_home }}/.bashrc"
        regexp: ^\s*export\s+PIP_REQUIRE_VIRTUALENV=.*$
        line: export PIP_REQUIRE_VIRTUALENV=1
        mode: "0644"
      - path: "{{ workstation_user_home }}/.bashrc"
        regexp: >-
          ^\s*export\s+PATH=["']?\$HOME/\.npm-global/bin:\$PATH["']?\s*$
        line: export PATH="$HOME/.npm-global/bin:$PATH"
        mode: "0644"
      - path: "{{ workstation_user_home }}/.bashrc"
        regexp: >-
          ^\s*export\s+PATH=["']?\$HOME/go/bin:\$PATH["']?\s*$
        line: export PATH="$HOME/go/bin:$PATH"
        mode: "0644"

  pre_tasks:
    - name: Validate Ubuntu release and architecture support
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Ubuntu"
          - ansible_facts["distribution_version"] in supported_ubuntu_versions
          - ansible_facts["architecture"] in linux_release_architecture_map
        fail_msg: >-
          This playbook supports Ubuntu
          {{ supported_ubuntu_versions | join(', ') }} on AMD64 and ARM64.
          Detected {{ ansible_facts["distribution"] }}
          {{ ansible_facts["distribution_version"] }} on
          {{ ansible_facts["architecture"] }}.

    - name: Configure AMD64v3 apt packages when supported
      ansible.builtin.include_role:
        name: amd64v3

    - name: Gather workstation user account details
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_name }}"

    # Resolved eagerly because later getent calls (for example the
    # github_release probe-account lookup) replace the getent_passwd fact
    # wholesale, which would break lazy references to this entry.
    - name: Resolve workstation user home directory and primary group
      ansible.builtin.set_fact:
        workstation_user_home: >-
          {{ ansible_facts["getent_passwd"][user_name][4] }}
        workstation_user_primary_gid: >-
          {{ ansible_facts["getent_passwd"][user_name][2] }}

    - name: Inspect graphical desktop session directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ desktop_session_directories }}"
      register: desktop_session_directory_status

    - name: Discover installed graphical desktop sessions
      vars:
        existing_desktop_session_directories: >-
          {{ desktop_session_directory_status.results
          | selectattr('stat.isdir', 'defined')
          | selectattr('stat.isdir')
          | map(attribute='item') | list }}
      ansible.builtin.find:
        paths: "{{ existing_desktop_session_directories }}"
        patterns: "*.desktop"
        file_type: file
        recurse: false
      register: graphical_desktop_sessions
      when: existing_desktop_session_directories | length > 0

    # The single source of truth for desktop detection; every desktop gate
    # below must reference this fact rather than re-deriving it.
    - name: Determine whether a graphical desktop is installed
      ansible.builtin.set_fact:
        workstation_has_desktop: >-
          {{ graphical_desktop_sessions.matched | default(0) | int > 0 }}

    # Each preflight is gated on the same conditions as its install role so
    # hosts that never manage a vendor's repository (headless systems, or
    # architectures the vendor does not publish for) do not have that
    # vendor's apt sources rewritten, quarantined, or failed in check mode.
    - name: Preflight vendor apt repositories before package refreshes
      ansible.builtin.include_role:
        name: "{{ item.role }}"
        tasks_from: repository_preflight
      loop:
        - { role: chatgpt, desktop_only: true }
        - { role: claude_desktop, desktop_only: true }
        - { role: megasync, desktop_only: true }
        - { role: r, desktop_only: false }
        - { role: zoom, desktop_only: true, architectures: [amd64] }
        - { role: vscode, desktop_only: true }
      loop_control:
        label: "{{ item.role }}"
      when:
        - not item.desktop_only or workstation_has_desktop
        - >-
          workstation_architecture
          in item.architectures | default([workstation_architecture])

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        update_cache: true
        # A refresh from within the last hour is current enough for the base
        # packages, except when the amd64v3 role just changed the apt
        # architecture-variant opt-in and the variant indexes must be fetched
        # before any package selection.
        cache_valid_time: >-
          {{ 0 if (amd64v3_apt_configuration.changed | default(false)
          or amd64v3_apt_configuration_removal.changed | default(false))
          else 3600 }}
        lock_timeout: 120
        name:
          # Build tools and utilities
          - build-essential
          - ca-certificates
          - ansible-lint
          - gpg
          - git
          - gh
          - cmake
          - curl
          - wget
          - unzip
          - jq
          - ripgrep
          - fd-find
          - fzf
          - tree
          - eza
          - bat
          - socat
          # Docker
          - docker.io
          - docker-buildx
          - docker-compose-v2
          # Document processing tools
          - tidy
          - pandoc
          - texlive-full
          - poppler-utils
          - tesseract-ocr
          - ocrmypdf
          - qpdf
          # Development libraries
          - libxml2-dev
          - libcurl4-openssl-dev
          - libssl-dev
          - libx11-dev
          - libglu1-mesa-dev
          - libftgl-dev
          - libfontconfig1-dev
          - libcairo2-dev
          - libgsl-dev
          - libudunits2-dev
          - libgdal-dev
          - gdal-bin
          - libmpfr-dev
          - libgmp-dev
          - libharfbuzz-dev
          - libfribidi-dev
          - libunwind-dev
          - libarchive-dev
          - libsodium-dev
          - libsecret-1-dev
          - libabsl-dev
          - libgit2-dev
          - libmagick++-dev
          - libpoppler-cpp-dev
          - libavfilter-dev
          - libnode-dev
          - libpcap-dev
          - libxrandr-dev
          - libxcursor-dev
          - libxinerama-dev
          - libxi-dev
          - libxxf86vm-dev
          - libzmq3-dev
          # Database tools
          - unixodbc-dev
          - tdsodbc
          - sqlite3
          - sqlite3-tools
          # Programming languages and runtimes
          - libopenblas-dev
          - python-is-python3
          - python3-venv
          - python3-virtualenv
          - python3-pandas
          - python3-openpyxl
          - python3-pyarrow
          - python3-xlsxwriter
          - python3-sqlalchemy
          - python3-pyodbc
          - python3-pymssql
          - python3-statsmodels
          - python3-seaborn
          - python3-plotly
          - python3-altair
          - python3-reportlab
          - jupyter
          - golang
          - rustup
          - nodejs
          - npm
          - gnucobol
          # System utilities
          - openssh-server
          - vim
          - hx
          - fastfetch
          - cpufetch
          - figlet
          - dos2unix
          - htop
          - btop
          # Accepted tradeoff (README Item 9): retain the
          # distribution-default service and privilege behavior for glances
          # on this trusted single-user host. This playbook does not
          # deliberately expose the service remotely.
          - glances
          - nvtop
          - jnettop
          - ffmpeg
          # Accepted tradeoff (README Item 9): retain the
          # distribution-default service and privilege behavior for ttyd on
          # this trusted single-user host. This playbook does not
          # deliberately expose the service remotely.
          - ttyd
        state: present

    - name: Install latest R release from CRAN
      ansible.builtin.include_role:
        name: r

    - name: Ensure user-local NPM prefix directory exists
      ansible.builtin.file:
        path: "{{ workstation_user_home }}/.npm-global"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ workstation_user_primary_gid }}"
        mode: "0755"

    - name: Inspect existing user configuration files
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ workstation_user_configuration_entries }}"
      loop_control:
        label: "{{ item.path }}"
      register: workstation_user_configuration_contents
      changed_when: false
      failed_when: false
      check_mode: false
      # .npmrc can hold npm auth tokens, so its contents must never reach
      # logs or callbacks (matching the slurps in the r role).
      no_log: true

    - name: Remove duplicate managed user configuration entries
      vars:
        workstation_managed_entry_count: >-
          {{ (item.content | default('') | b64decode).splitlines()
          | select('match', item.item.regexp) | list | length }}
      ansible.builtin.lineinfile:
        path: "{{ item.item.path }}"
        regexp: "{{ item.item.regexp }}"
        state: absent
      loop: "{{ workstation_user_configuration_contents.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: workstation_managed_entry_count | int > 1
      # The loop items embed the slurped file contents.
      no_log: true

    - name: Configure managed user configuration entries
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: true
        owner: "{{ user_name }}"
        group: "{{ workstation_user_primary_gid }}"
        mode: "{{ item.mode }}"
      loop: "{{ workstation_user_configuration_entries }}"
      loop_control:
        label: "{{ item.path }}: {{ item.line }}"

    - name: Inspect Docker group before managing membership
      ansible.builtin.getent:
        database: group
        key: docker
        fail_key: false

    - name: Ensure Docker system group exists
      ansible.builtin.group:
        name: docker
        system: true
        state: present

    - name: Add user to Docker group
      ansible.builtin.user:
        name: "{{ user_name }}"
        groups: docker
        append: true
      when: >-
        not ansible_check_mode or
        ansible_facts["getent_group"]["docker"] is not none

    - name: Report pending Docker group membership in check mode
      ansible.builtin.debug:
        msg: "The user {{ user_name }} would be added to the docker group."
      changed_when: true
      when:
        - ansible_check_mode
        - ansible_facts["getent_group"]["docker"] is none

    - name: Upgrade all installed APT packages
      ansible.builtin.apt:
        update_cache: true
        # The base-package task refreshed the cache earlier in this run, so
        # only refresh again when that was over an hour ago.
        cache_valid_time: 3600
        upgrade: dist
        lock_timeout: 120

    - name: Include desktop setup
      ansible.builtin.include_tasks: tasks/desktop.yml
      when: workstation_has_desktop

    - name: Install latest Ruff release from GitHub
      ansible.builtin.include_role:
        name: github_release
      vars:
        github_release_display_name: Ruff
        github_release_repository: astral-sh/ruff
        github_release_binaries:
          - ruff

    - name: Install latest ty release from GitHub
      ansible.builtin.include_role:
        name: github_release
      vars:
        github_release_display_name: ty
        github_release_repository: astral-sh/ty
        github_release_binaries:
          - ty

    - name: Install latest uv release from GitHub
      ansible.builtin.include_role:
        name: github_release
      vars:
        github_release_display_name: uv
        github_release_repository: astral-sh/uv
        github_release_binaries:
          - uv
          - uvx

    - name: Install DuckDB CLI
      ansible.builtin.include_role:
        name: duckdb

    - name: Install Quarto CLI
      ansible.builtin.include_role:
        name: quarto
