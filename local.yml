---
# Main playbook for ansible-pull
# Usage: sudo ansible-pull -U https://github.com/lab1702/setup.git

- name: Setup Ubuntu Developer Workstation
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    user_name: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) }}"
    supported_ubuntu_versions:
      - "26.04"
    desktop_session_directories:
      - /usr/share/xsessions
      - /usr/share/wayland-sessions
    linux_release_architecture_map:
      x86_64: amd64
      amd64: amd64
      aarch64: arm64
      arm64: arm64
    workstation_user_home: >-
      {{ ansible_facts["getent_passwd"][user_name][4] }}
    workstation_user_primary_gid: >-
      {{ ansible_facts["getent_passwd"][user_name][2] }}
    pip_virtualenv_shell_regexp: >-
      ^\s*export\s+PIP_REQUIRE_VIRTUALENV=.*$
    npm_prefix_config_regexp: '^\s*prefix\s*='
    npm_path_shell_regexp: >-
      ^\s*export\s+PATH=["']?\$HOME/\.npm-global/bin:\$PATH["']?\s*$

  pre_tasks:
    - name: Validate Ubuntu release and architecture support
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Ubuntu"
          - ansible_facts["distribution_version"] in supported_ubuntu_versions
          - ansible_facts["architecture"] in linux_release_architecture_map
        fail_msg: >-
          This playbook supports Ubuntu 26.04 on AMD64 and ARM64.
          Detected {{ ansible_facts["distribution"] }}
          {{ ansible_facts["distribution_version"] }} on
          {{ ansible_facts["architecture"] }}.

    - name: Configure AMD64v3 apt packages when supported
      ansible.builtin.include_role:
        name: amd64v3

    - name: Gather workstation user account details
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_name }}"

    - name: Inspect graphical desktop session directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ desktop_session_directories }}"
      register: desktop_session_directory_status

    - name: Discover installed graphical desktop sessions
      vars:
        existing_desktop_session_directories: >-
          {{ desktop_session_directory_status.results
          | selectattr('stat.isdir', 'defined')
          | selectattr('stat.isdir')
          | map(attribute='item') | list }}
      ansible.builtin.find:
        paths: "{{ existing_desktop_session_directories }}"
        patterns: "*.desktop"
        file_type: file
        recurse: false
      register: graphical_desktop_sessions
      when: existing_desktop_session_directories | length > 0

    - name: Preflight OpenAI apt repository before package refreshes
      ansible.builtin.include_role:
        name: chatgpt
        tasks_from: repository_preflight

    - name: Preflight Claude Desktop apt repository before package refreshes
      ansible.builtin.include_role:
        name: claude_desktop
        tasks_from: repository_preflight

    - name: Preflight MEGA apt repository before package refreshes
      ansible.builtin.include_role:
        name: megasync
        tasks_from: repository_preflight

    - name: Preflight CRAN apt repository before package refreshes
      ansible.builtin.include_role:
        name: r
        tasks_from: repository_preflight

    - name: Preflight Zoom apt repository before package refreshes
      ansible.builtin.include_role:
        name: zoom
        tasks_from: repository_preflight

    - name: Preflight Visual Studio Code apt repository before package refreshes
      ansible.builtin.include_role:
        name: vscode
        tasks_from: repository_preflight

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        update_cache: true
        name:
          # Build tools and utilities
          - build-essential
          - ansible-lint
          - gpg
          - git
          - gh
          - cmake
          - curl
          - wget
          - unzip
          - jq
          - ripgrep
          - fd-find
          - fzf
          - tree
          - eza
          - bat
          - socat
          # Docker
          - docker.io
          - docker-buildx
          - docker-compose-v2
          # Document processing tools
          - tidy
          - pandoc
          - texlive-full
          - poppler-utils
          - tesseract-ocr
          - ocrmypdf
          - qpdf
          # Development libraries
          - libxml2-dev
          - libcurl4-openssl-dev
          - libssl-dev
          - libx11-dev
          - libglu1-mesa-dev
          - libftgl-dev
          - libfontconfig1-dev
          - libcairo2-dev
          - libgsl-dev
          - libudunits2-dev
          - libgdal-dev
          - gdal-bin
          - libmpfr-dev
          - libgmp-dev
          - libharfbuzz-dev
          - libfribidi-dev
          - libunwind-dev
          - libarchive-dev
          - libsodium-dev
          - libsecret-1-dev
          - libabsl-dev
          - libgit2-dev
          - libmagick++-dev
          - libpoppler-cpp-dev
          - libavfilter-dev
          - libnode-dev
          - libpcap-dev
          - libxrandr-dev
          - libxcursor-dev
          - libxinerama-dev
          - libxi-dev
          - libxxf86vm-dev
          - libzmq3-dev
          # Database tools
          - unixodbc-dev
          - tdsodbc
          - sqlite3
          - sqlite3-tools
          # Programming languages and runtimes
          - libopenblas-dev
          - python-is-python3
          - python3-venv
          - python3-virtualenv
          - python3-pandas
          - python3-openpyxl
          - python3-pyarrow
          - python3-xlsxwriter
          - python3-sqlalchemy
          - python3-pyodbc
          - python3-pymssql
          - python3-statsmodels
          - python3-seaborn
          - python3-plotly
          - python3-altair
          - python3-reportlab
          - jupyter
          - golang
          - rustup
          - nodejs
          - npm
          - gnucobol
          # System utilities
          - openssh-server
          - vim
          - hx
          - fastfetch
          - cpufetch
          - figlet
          - dos2unix
          - htop
          - btop
          # Accepted Finding 5: retain the distribution-default service and
          # privilege behavior for glances on this trusted single-user host.
          # This playbook does not deliberately expose the service remotely.
          - glances
          - nvtop
          - jnettop
          - ffmpeg
          # Accepted Finding 5: retain the distribution-default service and
          # privilege behavior for ttyd on this trusted single-user host.
          # This playbook does not deliberately expose the service remotely.
          - ttyd
        state: present

    - name: Install latest R release from CRAN
      ansible.builtin.include_role:
        name: r

    - name: Ensure user-local NPM prefix directory exists
      ansible.builtin.file:
        path: "{{ workstation_user_home }}/.npm-global"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ workstation_user_primary_gid }}"
        mode: "0755"

    - name: Inspect existing user NPM configuration
      ansible.builtin.slurp:
        src: "{{ workstation_user_home }}/.npmrc"
      register: workstation_user_npm_configuration
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Inspect existing user shell configuration
      ansible.builtin.slurp:
        src: "{{ workstation_user_home }}/.bashrc"
      register: workstation_user_shell_configuration
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Remove duplicate user-local NPM prefix entries
      vars:
        npm_configuration_lines: >-
          {{ (workstation_user_npm_configuration.content | default('')
          | b64decode).splitlines() }}
        npm_prefix_entry_count: >-
          {{ npm_configuration_lines
          | select('match', npm_prefix_config_regexp) | list | length }}
      ansible.builtin.lineinfile:
        path: "{{ workstation_user_home }}/.npmrc"
        regexp: "{{ npm_prefix_config_regexp }}"
        state: absent
      when: npm_prefix_entry_count | int > 1

    - name: Configure user-local NPM prefix
      ansible.builtin.lineinfile:
        path: "{{ workstation_user_home }}/.npmrc"
        regexp: "{{ npm_prefix_config_regexp }}"
        line: "prefix={{ workstation_user_home }}/.npm-global"
        create: true
        owner: "{{ user_name }}"
        group: "{{ workstation_user_primary_gid }}"
        mode: "0644"

    - name: Remove duplicate pip virtual-environment requirements
      vars:
        shell_configuration_lines: >-
          {{ (workstation_user_shell_configuration.content | default('')
          | b64decode).splitlines() }}
        pip_virtualenv_entry_count: >-
          {{ shell_configuration_lines
          | select('match', pip_virtualenv_shell_regexp) | list | length }}
      ansible.builtin.lineinfile:
        path: "{{ workstation_user_home }}/.bashrc"
        regexp: "{{ pip_virtualenv_shell_regexp }}"
        state: absent
      when: pip_virtualenv_entry_count | int > 1

    - name: Require virtual environments for user pip installations
      ansible.builtin.lineinfile:
        path: "{{ workstation_user_home }}/.bashrc"
        regexp: "{{ pip_virtualenv_shell_regexp }}"
        line: 'export PIP_REQUIRE_VIRTUALENV=1'
        create: true
        owner: "{{ user_name }}"
        group: "{{ workstation_user_primary_gid }}"
        mode: "0644"

    - name: Remove duplicate user-local NPM shell path entries
      vars:
        shell_configuration_lines: >-
          {{ (workstation_user_shell_configuration.content | default('')
          | b64decode).splitlines() }}
        npm_path_entry_count: >-
          {{ shell_configuration_lines
          | select('match', npm_path_shell_regexp) | list | length }}
      ansible.builtin.lineinfile:
        path: "{{ workstation_user_home }}/.bashrc"
        regexp: "{{ npm_path_shell_regexp }}"
        state: absent
      when: npm_path_entry_count | int > 1

    - name: Add user-local NPM binaries to the shell path
      ansible.builtin.lineinfile:
        path: "{{ workstation_user_home }}/.bashrc"
        regexp: "{{ npm_path_shell_regexp }}"
        line: 'export PATH="$HOME/.npm-global/bin:$PATH"'
        create: true
        owner: "{{ user_name }}"
        group: "{{ workstation_user_primary_gid }}"
        mode: "0644"

    - name: Inspect Docker group before managing membership
      ansible.builtin.getent:
        database: group
        key: docker
        fail_key: false

    - name: Ensure Docker system group exists
      ansible.builtin.group:
        name: docker
        system: true
        state: present

    - name: Add user to Docker group
      ansible.builtin.user:
        name: "{{ user_name }}"
        groups: docker
        append: true
      when: >-
        not ansible_check_mode or
        ansible_facts["getent_group"]["docker"] is not none

    - name: Report pending Docker group membership in check mode
      ansible.builtin.debug:
        msg: "The user {{ user_name }} would be added to the docker group."
      changed_when: true
      when:
        - ansible_check_mode
        - ansible_facts["getent_group"]["docker"] is none

    - name: Upgrade all installed APT packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        lock_timeout: 120

    - name: Include desktop setup
      ansible.builtin.include_tasks: desktop.yml
      when: graphical_desktop_sessions.matched | default(0) | int > 0

    - name: Install latest Ruff release from GitHub
      ansible.builtin.include_role:
        name: ruff

    - name: Install latest ty release from GitHub
      ansible.builtin.include_role:
        name: ty

    - name: Install latest uv release from GitHub
      ansible.builtin.include_role:
        name: uv

    - name: Install DuckDB CLI
      ansible.builtin.include_role:
        name: duckdb

    - name: Install Quarto CLI
      ansible.builtin.include_role:
        name: quarto
