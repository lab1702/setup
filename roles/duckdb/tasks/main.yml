---
- name: Install DuckDB CLI from the latest verified GitHub release
  ansible.builtin.include_role:
    name: github_release
  vars:
    github_release_display_name: DuckDB CLI
    github_release_repository: "{{ duckdb_repository }}"
    github_release_binaries:
      - duckdb
    github_release_archive_format: zip
    github_release_archive_layout: flat
    github_release_archive_filename: "{{ duckdb_archive_filename }}"
    github_release_version_token_index: 0
