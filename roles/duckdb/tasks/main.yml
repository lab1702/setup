---
- name: Validate DuckDB CLI architecture support
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in duckdb_architecture_map
    fail_msg: >-
      DuckDB CLI supports AMD64 and ARM64. Detected
      {{ ansible_facts["architecture"] }}.

- name: Inspect DuckDB CLI install directory
  ansible.builtin.stat:
    path: "{{ duckdb_install_directory }}"
    follow: false
  register: duckdb_install_directory_status

- name: Validate DuckDB CLI install directory security
  ansible.builtin.assert:
    that:
      - duckdb_install_directory_status.stat.isdir | default(false)
      - not duckdb_install_directory_status.stat.islnk | default(false)
      - duckdb_install_directory_status.stat.uid | default(-1) == 0
      - duckdb_install_directory_status.stat.gid | default(-1) == 0
      - >-
        (duckdb_install_directory_status.stat.mode | default(''))
        is match('^0[0-7][0145][0145]$')
    fail_msg: >-
      {{ duckdb_install_directory }} must be an existing root-owned directory,
      must not be a symbolic link, and must not be group- or world-writable.

- name: Install DuckDB CLI archive prerequisites
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120

- name: Get latest DuckDB release
  ansible.builtin.uri:
    url: "{{ duckdb_release_api_url }}"
    return_content: true
  register: duckdb_release
  changed_when: false
  check_mode: false

- name: Select DuckDB CLI archive asset
  vars:
    duckdb_release_architecture: >-
      {{ duckdb_architecture_map[ansible_facts["architecture"]] }}
    duckdb_archive_filename: >-
      duckdb_cli-linux-{{ duckdb_release_architecture }}.zip
  ansible.builtin.set_fact:
    duckdb_release_asset: >-
      {{ duckdb_release.json.assets
      | selectattr('name', 'equalto', duckdb_archive_filename)
      | first | default({}) }}

- name: Validate DuckDB CLI archive asset
  ansible.builtin.assert:
    that:
      - duckdb_release_asset | length > 0
      - duckdb_release_asset.state | default('') == 'uploaded'
      - >-
        (duckdb_release_asset.browser_download_url | default('')).startswith(
        duckdb_release_base_url ~ '/')
      - >-
        (duckdb_release_asset.digest | default(''))
        is match('^sha256:[0-9a-f]{64}$')
    fail_msg: >-
      The latest DuckDB release did not contain the expected uploaded CLI
      archive with a trusted GitHub download URL and SHA-256 digest.

- name: Inspect installed DuckDB CLI binary path
  ansible.builtin.stat:
    path: "{{ duckdb_install_directory }}/duckdb"
    follow: false
  register: duckdb_installed_binary_status

- name: Validate installed DuckDB CLI binary path type
  ansible.builtin.assert:
    that:
      - >-
        not duckdb_installed_binary_status.stat.exists or
        duckdb_installed_binary_status.stat.isreg | default(false) or
        duckdb_installed_binary_status.stat.islnk | default(false)
    fail_msg: >-
      Refusing to replace {{ duckdb_install_directory }}/duckdb because it is
      neither a regular file nor a symbolic link.

- name: Determine whether installed DuckDB CLI binary is safe to execute
  ansible.builtin.set_fact:
    duckdb_installed_binary_is_safe: >-
      {{ duckdb_installed_binary_status.stat.isreg | default(false)
      and not duckdb_installed_binary_status.stat.islnk | default(false)
      and duckdb_installed_binary_status.stat.uid | default(-1) == 0
      and duckdb_installed_binary_status.stat.gid | default(-1) == 0
      and duckdb_installed_binary_status.stat.mode | default('') == '0755' }}

- name: Inspect installed DuckDB CLI version
  ansible.builtin.command:
    argv:
      - "{{ duckdb_install_directory }}/duckdb"
      - --version
  register: duckdb_installed_release
  changed_when: false
  failed_when: false
  check_mode: false
  when: duckdb_installed_binary_is_safe

- name: Determine whether DuckDB CLI installation is required
  vars:
    duckdb_release_version: >-
      {{ duckdb_release.json.tag_name | regex_replace('^v', '') }}
    duckdb_installed_version: >-
      {{ (duckdb_installed_release.stdout | default('')).split()
      | first | default('') | regex_replace('^v', '') }}
  ansible.builtin.set_fact:
    duckdb_install_required: >-
      {{ not duckdb_installed_binary_is_safe or
      duckdb_installed_release.rc | default(1) != 0 or
      duckdb_installed_version != duckdb_release_version }}

- name: Report pending DuckDB CLI installation in check mode
  ansible.builtin.debug:
    msg: >-
      DuckDB CLI {{ duckdb_release.json.tag_name }} would be installed in
      {{ duckdb_install_directory }}.
  changed_when: true
  when:
    - ansible_check_mode
    - duckdb_install_required

- name: Download, verify, and install required DuckDB CLI release
  when:
    - duckdb_install_required
    - not ansible_check_mode
  block:
    - name: Create temporary directory for DuckDB CLI archive
      ansible.builtin.tempfile:
        state: directory
        suffix: .duckdb
      register: duckdb_archive_tempdir
      changed_when: false

    - name: Download, inspect, and install verified DuckDB CLI archive
      block:
        - name: Download verified DuckDB CLI archive
          ansible.builtin.get_url:
            url: "{{ duckdb_release_asset.browser_download_url }}"
            dest: >-
              {{ duckdb_archive_tempdir.path }}/{{ duckdb_release_asset.name }}
            checksum: "{{ duckdb_release_asset.digest }}"
            mode: "0600"

        - name: Inspect DuckDB CLI archive member names
          ansible.builtin.command:
            argv:
              - /usr/bin/unzip
              - -Z
              - "-1"
              - >-
                {{ duckdb_archive_tempdir.path }}/{{
                duckdb_release_asset.name }}
          register: duckdb_archive_member_names
          changed_when: false

        - name: Inspect DuckDB CLI archive member metadata
          ansible.builtin.command:
            argv:
              - /usr/bin/unzip
              - -Z
              - -s
              - >-
                {{ duckdb_archive_tempdir.path }}/{{
                duckdb_release_asset.name }}
          register: duckdb_archive_member_metadata
          changed_when: false

        - name: Validate DuckDB CLI archive members
          vars:
            duckdb_archive_member_records: >-
              {{ duckdb_archive_member_metadata.stdout_lines
              | select('match', '^[bcdlps-]') | list }}
            duckdb_archive_member_mode: >-
              {{ ((duckdb_archive_member_records | first | default('')).split()
              | first | default('')) }}
          ansible.builtin.assert:
            that:
              - duckdb_archive_member_names.stdout_lines == ['duckdb']
              - duckdb_archive_member_records | length == 1
              - duckdb_archive_member_mode is match('^-.{2}x.{6}$')
            fail_msg: >-
              The verified DuckDB CLI archive must contain exactly one safe
              regular executable named duckdb and no other members.

        - name: Extract validated DuckDB CLI binary into temporary directory
          ansible.builtin.unarchive:
            src: >-
              {{ duckdb_archive_tempdir.path }}/{{ duckdb_release_asset.name }}
            dest: "{{ duckdb_archive_tempdir.path }}"
            remote_src: true
            include:
              - duckdb
          environment:
            PATH: /usr/bin:/bin

        - name: Inspect extracted DuckDB CLI binary
          ansible.builtin.stat:
            path: "{{ duckdb_archive_tempdir.path }}/duckdb"
            follow: false
          register: duckdb_extracted_binary

        - name: Validate extracted DuckDB CLI binary
          ansible.builtin.assert:
            that:
              - duckdb_extracted_binary.stat.isreg | default(false)
              - not duckdb_extracted_binary.stat.islnk | default(false)
              - >-
                (duckdb_extracted_binary.stat.mode | default(''))
                is match('^0[1357][0-7][0-7]$')
            fail_msg: >-
              The extracted DuckDB CLI member is not a regular executable.

        - name: Inspect downloaded DuckDB CLI version
          ansible.builtin.command:
            argv:
              - "{{ duckdb_archive_tempdir.path }}/duckdb"
              - --version
          register: duckdb_downloaded_release
          changed_when: false
          failed_when: false

        - name: Validate downloaded DuckDB CLI version
          vars:
            duckdb_release_version: >-
              {{ duckdb_release.json.tag_name | regex_replace('^v', '') }}
            duckdb_downloaded_version: >-
              {{ (duckdb_downloaded_release.stdout | default('')).split()
              | first | default('') | regex_replace('^v', '') }}
          ansible.builtin.assert:
            that:
              - duckdb_downloaded_release.rc | default(1) == 0
              - duckdb_downloaded_version == duckdb_release_version
            fail_msg: >-
              The downloaded DuckDB CLI binary version does not match
              GitHub's latest release tag.

        - name: Install verified DuckDB CLI binary
          ansible.builtin.copy:
            src: "{{ duckdb_archive_tempdir.path }}/duckdb"
            dest: "{{ duckdb_install_directory }}/duckdb"
            remote_src: true
            owner: root
            group: root
            mode: "0755"
            follow: false
      always:
        - name: Remove temporary DuckDB CLI archive directory
          ansible.builtin.file:
            path: "{{ duckdb_archive_tempdir.path }}"
            state: absent
          changed_when: false
