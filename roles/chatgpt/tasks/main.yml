---
- name: Validate ChatGPT Desktop platform support
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Ubuntu"
      - ansible_facts["distribution_version"] in chatgpt_supported_ubuntu_versions
      - ansible_facts["architecture"] in chatgpt_architecture_map
    fail_msg: >-
      ChatGPT Desktop supports Ubuntu 26.04 on x86_64 or ARM64.
      Detected {{ ansible_facts["distribution"] }}
      {{ ansible_facts["distribution_version"] }} on
      {{ ansible_facts["architecture"] }}.

- name: Install ChatGPT repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gpg
      - xz-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Inspect bundled OpenAI repository signing key
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ role_path }}/files/chatgpt-archive-keyring.asc"
  register: chatgpt_repository_key
  changed_when: false
  check_mode: false

- name: Verify bundled OpenAI repository signing key fingerprint
  vars:
    chatgpt_public_key_records: >-
      {{ chatgpt_repository_key.stdout_lines
      | select('match', '^pub:') | list }}
    chatgpt_fingerprint_records: >-
      {{ chatgpt_repository_key.stdout_lines
      | select('match', '^fpr:') | list }}
    chatgpt_expected_fingerprint_record: >-
      fpr:::::::::{{ chatgpt_repository_key_fingerprint }}:
  ansible.builtin.assert:
    that:
      - chatgpt_public_key_records | length == 1
      - >-
        (chatgpt_fingerprint_records | first | default('')) ==
        chatgpt_expected_fingerprint_record
    fail_msg: >-
      The bundled OpenAI repository signing key does not contain exactly
      one primary key with fingerprint
      {{ chatgpt_repository_key_fingerprint }}.

- name: Install pinned OpenAI repository signing key
  ansible.builtin.copy:
    src: chatgpt-archive-keyring.asc
    dest: "{{ chatgpt_repository_keyring_path }}"
    owner: root
    group: root
    mode: "0644"
  register: chatgpt_repository_keyring_installation

- name: Configure signed OpenAI apt repository
  vars:
    chatgpt_repository_architecture: >-
      {{ chatgpt_architecture_map[ansible_facts["architecture"]] }}
  ansible.builtin.copy:
    dest: "{{ chatgpt_repository_sources_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      ### THIS FILE IS MANAGED BY ANSIBLE ###
      X-Repolib-Name: ChatGPT
      Types: deb
      URIs: {{ chatgpt_repository_url }}
      Suites: {{ chatgpt_repository_suite }}
      Components: {{ chatgpt_repository_component }}
      Architectures: {{ chatgpt_repository_architecture }}
      Signed-By: {{ chatgpt_repository_keyring_path }}
  register: chatgpt_repository_configuration

- name: Ensure ChatGPT is installed and current
  ansible.builtin.apt:
    name: "{{ chatgpt_package_name }}"
    state: "{{ chatgpt_package_state }}"
    update_cache: true
    lock_timeout: 120
  when: >-
    not ansible_check_mode or
    (not chatgpt_repository_keyring_installation.changed and
    not chatgpt_repository_configuration.changed)
