---
- name: Validate ChatGPT Desktop platform support
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Ubuntu"
      - ansible_facts["distribution_version"] in chatgpt_supported_ubuntu_versions
      - ansible_facts["architecture"] in chatgpt_architecture_map
    fail_msg: >-
      ChatGPT Desktop supports Ubuntu 26.04 on x86_64 or ARM64.
      Detected {{ ansible_facts["distribution"] }}
      {{ ansible_facts["distribution_version"] }} on
      {{ ansible_facts["architecture"] }}.

- name: Preflight OpenAI apt repository
  ansible.builtin.import_tasks: repository_preflight.yml

- name: Install ChatGPT repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gpg
      - xz-utils
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: chatgpt_repository_prerequisite_installation

- name: Configure pinned OpenAI repository and install ChatGPT Desktop
  when: >-
    not ansible_check_mode or
    not chatgpt_repository_prerequisite_installation.changed
  block:
    - name: Inspect bundled OpenAI repository signing key
      ansible.builtin.command:
        argv:
          - gpg
          - --batch
          - --show-keys
          - --with-colons
          - "{{ role_path }}/files/chatgpt-archive-keyring.gpg"
      register: chatgpt_repository_key
      changed_when: false
      check_mode: false

    - name: Verify bundled OpenAI repository signing key fingerprint
      vars:
        chatgpt_public_key_records: >-
          {{ chatgpt_repository_key.stdout_lines
          | select('match', '^pub:') | list }}
        chatgpt_fingerprint_records: >-
          {{ chatgpt_repository_key.stdout_lines
          | select('match', '^fpr:') | list }}
        chatgpt_expected_fingerprint_record: >-
          fpr:::::::::{{ chatgpt_repository_key_fingerprint }}:
      ansible.builtin.assert:
        that:
          - chatgpt_public_key_records | length == 1
          - >-
            (chatgpt_fingerprint_records | first | default('')) ==
            chatgpt_expected_fingerprint_record
        fail_msg: >-
          The bundled OpenAI repository signing key does not contain exactly
          one primary key with fingerprint
          {{ chatgpt_repository_key_fingerprint }}.

    - name: Configure pinned OpenAI apt repository
      ansible.builtin.import_tasks: repository.yml

    - name: Inspect legacy armored OpenAI repository signing key path
      ansible.builtin.stat:
        path: "{{ chatgpt_repository_legacy_keyring_path }}"
        follow: false
      register: chatgpt_repository_legacy_keyring_status
      when: >-
        chatgpt_repository_legacy_keyring_path !=
        chatgpt_repository_keyring_path

    - name: Validate legacy armored OpenAI signing key path type
      ansible.builtin.assert:
        that:
          - >-
            not chatgpt_repository_legacy_keyring_status.stat.exists or
            chatgpt_repository_legacy_keyring_status.stat.isreg
            | default(false) or
            chatgpt_repository_legacy_keyring_status.stat.islnk
            | default(false)
        fail_msg: >-
          Refusing to remove {{ chatgpt_repository_legacy_keyring_path }}
          because it is neither a regular file nor a symbolic link.
      when: >-
        chatgpt_repository_legacy_keyring_path !=
        chatgpt_repository_keyring_path

    - name: Remove legacy armored OpenAI repository signing key
      ansible.builtin.file:
        path: "{{ chatgpt_repository_legacy_keyring_path }}"
        state: absent
      when: >-
        chatgpt_repository_legacy_keyring_path !=
        chatgpt_repository_keyring_path

    - name: Resolve and install the exact OpenAI repository version
      when: >-
        not ansible_check_mode or
        (not chatgpt_repository_keyring_installation.changed and
        not chatgpt_repository_configuration.changed)
      block:
        - name: Refresh OpenAI repository package metadata
          ansible.builtin.apt:
            update_cache: true
            cache_valid_time: 0
            lock_timeout: 120
          changed_when: false
          when: not ansible_check_mode

        - name: Discover published ChatGPT repository versions
          ansible.builtin.command:
            argv:
              - apt-cache
              - madison
              - "{{ chatgpt_package_name }}"
          environment:
            LC_ALL: C
          register: chatgpt_repository_versions
          changed_when: false
          check_mode: false

        - name: Select ChatGPT versions from the OpenAI repository
          vars:
            chatgpt_repository_version_pattern: >-
              {{ '^\s*'
              ~ (chatgpt_package_name | ansible.builtin.regex_escape)
              ~ '\s*\|\s*\S+\s*\|\s*'
              ~ (chatgpt_repository_url | regex_replace('/+$', '')
              | ansible.builtin.regex_escape)
              ~ '/?(?:\s|$)' }}
          ansible.builtin.set_fact:
            chatgpt_repository_version_rows: >-
              {{ chatgpt_repository_versions.stdout_lines
              | select('match', chatgpt_repository_version_pattern) | list }}

        - name: Validate available ChatGPT repository versions
          ansible.builtin.assert:
            that:
              - chatgpt_repository_version_rows | length > 0
            fail_msg: >-
              The verified OpenAI repository does not publish a candidate for
              {{ chatgpt_package_name }} on this architecture.

        - name: Select current ChatGPT repository version
          ansible.builtin.set_fact:
            chatgpt_package_candidate_version: >-
              {{ (chatgpt_repository_version_rows | first).split('|')[1]
              | trim }}

        - name: Validate current ChatGPT Debian version
          ansible.builtin.command:
            argv:
              - dpkg
              - --validate-version
              - "{{ chatgpt_package_candidate_version }}"
          changed_when: false
          check_mode: false

        - name: Install exact current ChatGPT repository version
          ansible.builtin.apt:
            name: >-
              {{ chatgpt_package_name }}={{
              chatgpt_package_candidate_version }}
            state: present
            allow_downgrade: true
            lock_timeout: 120
          register: chatgpt_package_installation

    - name: Reassert pinned OpenAI apt repository after package changes
      ansible.builtin.import_tasks: repository.yml
      when:
        - not ansible_check_mode
        - chatgpt_package_installation is defined
        - chatgpt_package_installation.changed
