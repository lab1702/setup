---
- name: Inspect managed OpenAI apt repository source
  ansible.builtin.stat:
    path: "{{ chatgpt_repository_sources_path }}"
  register: chatgpt_repository_source_status

- name: Validate managed OpenAI apt repository source path type
  ansible.builtin.assert:
    that:
      - >-
        not chatgpt_repository_source_status.stat.exists or
        chatgpt_repository_source_status.stat.isreg | default(false) or
        chatgpt_repository_source_status.stat.islnk | default(false)
    fail_msg: >-
      Refusing to quarantine {{ chatgpt_repository_sources_path }} because
      it is neither a regular file nor a symbolic link.

- name: Read managed OpenAI apt repository source
  ansible.builtin.slurp:
    src: "{{ chatgpt_repository_sources_path }}"
  register: chatgpt_repository_source
  failed_when: false
  when:
    - chatgpt_repository_source_status.stat.exists
    - chatgpt_repository_source_status.stat.isreg | default(false)

- name: Inspect installed OpenAI repository signing key file
  ansible.builtin.stat:
    path: "{{ chatgpt_repository_keyring_path }}"
  register: chatgpt_installed_repository_key_status

- name: Validate installed OpenAI repository signing key path type
  ansible.builtin.assert:
    that:
      - >-
        not chatgpt_installed_repository_key_status.stat.exists or
        chatgpt_installed_repository_key_status.stat.isreg | default(false) or
        chatgpt_installed_repository_key_status.stat.islnk | default(false)
    fail_msg: >-
      Refusing to replace {{ chatgpt_repository_keyring_path }} because it is
      neither a regular file nor a symbolic link.

- name: Read installed OpenAI repository signing key
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ chatgpt_repository_keyring_path }}"
  register: chatgpt_installed_repository_key
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - chatgpt_repository_source_status.stat.exists
    - chatgpt_installed_repository_key_status.stat.isreg | default(false)

- name: Determine whether the managed OpenAI apt repository needs quarantine
  vars:
    chatgpt_repository_source_is_usable: >-
      {{ chatgpt_repository_source_status.stat.isreg | default(false)
      and chatgpt_repository_source_status.stat.uid | default(-1) == 0
      and chatgpt_repository_source_status.stat.gid | default(-1) == 0
      and chatgpt_repository_source_status.stat.mode | default('') == '0644'
      and not chatgpt_repository_source.failed | default(true)
      and (chatgpt_repository_source.content | default('') | b64decode)
      == chatgpt_repository_source_content }}
    chatgpt_installed_public_key_records: >-
      {{ chatgpt_installed_repository_key.stdout_lines | default([])
      | select('match', '^pub:') | list }}
    chatgpt_installed_fingerprint_records: >-
      {{ chatgpt_installed_repository_key.stdout_lines | default([])
      | select('match', '^fpr:') | list }}
    chatgpt_expected_fingerprint_record: >-
      fpr:::::::::{{ chatgpt_repository_key_fingerprint }}:
    chatgpt_installed_repository_key_is_usable: >-
      {{ chatgpt_installed_repository_key_status.stat.isreg | default(false)
      and chatgpt_installed_repository_key_status.stat.uid | default(-1) == 0
      and chatgpt_installed_repository_key_status.stat.gid | default(-1) == 0
      and chatgpt_installed_repository_key_status.stat.mode
      | default('') == '0644'
      and chatgpt_installed_repository_key.rc | default(1) == 0
      and chatgpt_installed_public_key_records | length == 1
      and (chatgpt_installed_fingerprint_records | first | default(''))
      == chatgpt_expected_fingerprint_record }}
  ansible.builtin.set_fact:
    chatgpt_repository_quarantine_required: >-
      {{ chatgpt_repository_source_status.stat.exists and
      (not chatgpt_repository_source_is_usable | bool or
      not chatgpt_installed_repository_key_is_usable | bool) }}
  changed_when: false

- name: Stop check mode when the OpenAI repository requires repair
  ansible.builtin.fail:
    msg: >-
      {{ chatgpt_repository_sources_path }} must be quarantined before APT can
      be checked safely. Run this playbook once without --check to repair the
      managed OpenAI repository.
  when:
    - ansible_check_mode
    - chatgpt_repository_quarantine_required

- name: Remove unusable managed OpenAI apt repository source
  ansible.builtin.file:
    path: "{{ chatgpt_repository_sources_path }}"
    state: absent
  when: chatgpt_repository_quarantine_required
