---
# Resolved by tasks/key_file.yml before the shared role runs, because
# role_path would otherwise refer to the vendor_repository role.
chatgpt_repository_key_file: ""

chatgpt_repository:
  display_name: ChatGPT Desktop
  package_names:
    - chatgpt
  url: https://persistent.oaistatic.com/codex-app-prod/linux/deb
  suites: stable
  components: main
  sources_path: /etc/apt/sources.list.d/chatgpt.sources
  # Mirror the header the ChatGPT package itself writes so the managed file
  # stays byte-identical after the package's own post-install step.
  source_prefix: |
    ### THIS FILE IS AUTOMATICALLY CONFIGURED ###
    # Remove it to opt out of automatic package updates.
    X-Repolib-Name: ChatGPT
  keyring_path: /usr/share/keyrings/chatgpt-archive-keyring.gpg
  key_fingerprint: 3BFA0E4AE8B8CC16A2D9BA684A3B4A566C4660E4
  key_file: "{{ chatgpt_repository_key_file }}"
  legacy_keyring_path: /usr/share/keyrings/chatgpt-archive-keyring.asc
  prerequisite_packages:
    - ca-certificates
    - gpg
    - xz-utils
