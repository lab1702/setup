---
r_repository_url: https://cloud.r-project.org/bin/linux/ubuntu
r_repository_suite_map:
  "26.04": resolute-cran40/
r_repository_sources_path: /etc/apt/sources.list.d/cran-r.sources

# Locations scanned for competing CRAN entries before the managed source is
# configured.
r_repository_main_sources_path: /etc/apt/sources.list
r_repository_sources_directory_path: /etc/apt/sources.list.d
r_repository_source_file_patterns:
  - "*.list"
  - "*.sources"

r_repository:
  display_name: CRAN R
  package_names:
    - r-base
    - r-base-core
    - r-base-dev
    - r-recommended
  url: "{{ r_repository_url }}"
  suites: "{{ r_repository_suite_map[ansible_facts['distribution_version']] }}"
  sources_path: "{{ r_repository_sources_path }}"
  keyring_path: /usr/share/keyrings/cran-r-archive-keyring.asc
  key_fingerprint: E298A3A825C0D65DFD57CBB651716619E084DAB9
  key_url: https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc
  install_recommends: false
