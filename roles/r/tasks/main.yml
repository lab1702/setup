---
- name: Migrate competing CRAN repository sources
  ansible.builtin.import_tasks: competing_sources.yml
  when: not r_repository_competing_sources_migrated | default(false)

- name: Install R from the verified CRAN repository
  ansible.builtin.include_role:
    name: vendor_repository
  vars:
    vendor_repository_spec: "{{ r_repository }}"
