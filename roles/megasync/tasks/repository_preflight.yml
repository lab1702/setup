---
- name: Inspect managed MEGA apt repository source
  ansible.builtin.stat:
    path: "{{ megasync_repository_sources_path }}"
  register: megasync_repository_source_status

- name: Validate managed MEGA apt repository source path type
  ansible.builtin.assert:
    that:
      - >-
        not megasync_repository_source_status.stat.exists or
        megasync_repository_source_status.stat.isreg | default(false) or
        megasync_repository_source_status.stat.islnk | default(false)
    fail_msg: >-
      Refusing to quarantine {{ megasync_repository_sources_path }} because it
      is neither a regular file nor a symbolic link.

- name: Read managed MEGA apt repository source
  ansible.builtin.slurp:
    src: "{{ megasync_repository_sources_path }}"
  register: megasync_repository_source
  failed_when: false
  when:
    - megasync_repository_source_status.stat.exists
    - megasync_repository_source_status.stat.isreg | default(false)

- name: Inspect installed MEGA repository signing key file
  ansible.builtin.stat:
    path: "{{ megasync_repository_keyring_path }}"
  register: megasync_installed_repository_key_status

- name: Validate installed MEGA repository signing key path type
  ansible.builtin.assert:
    that:
      - >-
        not megasync_installed_repository_key_status.stat.exists or
        megasync_installed_repository_key_status.stat.isreg | default(false) or
        megasync_installed_repository_key_status.stat.islnk | default(false)
    fail_msg: >-
      Refusing to replace {{ megasync_repository_keyring_path }} because it is
      neither a regular file nor a symbolic link.

- name: Read installed MEGA repository signing key
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ megasync_repository_keyring_path }}"
  register: megasync_installed_repository_key
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - megasync_repository_source_status.stat.exists
    - megasync_installed_repository_key_status.stat.isreg | default(false)

- name: Remove unusable managed MEGA apt repository source
  vars:
    megasync_repository_source_is_usable: >-
      {{ megasync_repository_source_status.stat.isreg | default(false)
      and megasync_repository_source_status.stat.uid | default(-1) == 0
      and megasync_repository_source_status.stat.gid | default(-1) == 0
      and megasync_repository_source_status.stat.mode | default('') == '0644'
      and not megasync_repository_source.failed | default(true)
      and (megasync_repository_source.content | default('') | b64decode)
      == megasync_repository_source_content }}
    megasync_installed_public_key_records: >-
      {{ megasync_installed_repository_key.stdout_lines | default([])
      | select('match', '^pub:') | list }}
    megasync_installed_fingerprint_records: >-
      {{ megasync_installed_repository_key.stdout_lines | default([])
      | select('match', '^fpr:') | list }}
    megasync_expected_fingerprint_record: >-
      fpr:::::::::{{ megasync_repository_key_fingerprint }}:
    megasync_installed_repository_key_is_usable: >-
      {{ megasync_installed_repository_key_status.stat.isreg
      | default(false)
      and megasync_installed_repository_key_status.stat.uid
      | default(-1) == 0
      and megasync_installed_repository_key_status.stat.gid
      | default(-1) == 0
      and megasync_installed_repository_key_status.stat.mode
      | default('') == '0644'
      and megasync_installed_repository_key.rc | default(1) == 0
      and megasync_installed_public_key_records | length == 1
      and (megasync_installed_fingerprint_records | first | default('')) ==
      megasync_expected_fingerprint_record }}
  ansible.builtin.file:
    path: "{{ megasync_repository_sources_path }}"
    state: absent
  when:
    - megasync_repository_source_status.stat.exists
    - >-
      not megasync_repository_source_is_usable | bool or
      not megasync_installed_repository_key_is_usable | bool

- name: Inspect legacy MEGA apt repository source
  ansible.builtin.stat:
    path: "{{ megasync_repository_legacy_sources_path }}"
  register: megasync_repository_legacy_source_status

- name: Validate legacy MEGA apt repository source path type
  ansible.builtin.assert:
    that:
      - >-
        not megasync_repository_legacy_source_status.stat.exists or
        megasync_repository_legacy_source_status.stat.isreg | default(false) or
        megasync_repository_legacy_source_status.stat.islnk | default(false)
    fail_msg: >-
      Refusing to remove {{ megasync_repository_legacy_sources_path }} because
      it is neither a regular file nor a symbolic link.

- name: Remove legacy MEGA apt repository source
  ansible.builtin.file:
    path: "{{ megasync_repository_legacy_sources_path }}"
    state: absent
  when: megasync_repository_legacy_source_status.stat.exists
