---
megasync_repository_url: >-
  https://mega.nz/linux/repo/xUbuntu_{{ ansible_facts["distribution_version"] }}/

megasync_repository:
  display_name: MEGA Desktop
  package_names:
    - megasync
  url: "{{ megasync_repository_url }}"
  # MEGA publishes a flat repository without architecture-specific indexes.
  suites: ./
  architectures: []
  sources_path: /etc/apt/sources.list.d/megaio.sources
  keyring_path: /etc/apt/keyrings/meganz-archive-keyring.gpg
  key_fingerprint: B01C811880480C854C73EC7E1A664B787094A482
  key_url: "{{ megasync_repository_url }}Release.key"
  legacy_sources_path: /etc/apt/sources.list.d/megasync.list
  # Match any MEGA distribution path, not only the current release's.
  legacy_entry_regexp: >-
    {{ '(?i)^[ \t]*deb(?:-src)?[ \t]+'
    ~ '(?:\[[^]]*\][ \t]+)?https://mega[.]nz/linux/repo/'
    ~ '[^ \t#]+(?:[ \t]+.*)?$' }}
