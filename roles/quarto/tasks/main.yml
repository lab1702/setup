---
- name: Validate Quarto CLI architecture support
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in linux_release_architecture_map
    fail_msg: >-
      Quarto CLI supports AMD64 and ARM64. Detected
      {{ ansible_facts["architecture"] }}.

# Fetching, selecting, and validating the release asset is shared with the
# binary installers through the github_release role, so API and digest
# hardening lives in one place.
- name: Resolve latest Quarto CLI package asset
  ansible.builtin.include_role:
    name: github_release
    tasks_from: resolve_asset.yml
  vars:
    github_release_display_name: Quarto CLI
    github_release_repository: "{{ quarto_repository }}"
    github_release_asset_filename: "{{ quarto_package_filename }}"

- name: Determine required Quarto CLI package action
  ansible.builtin.include_role:
    name: deb_package
    tasks_from: status.yml
  vars:
    deb_package_display_name: Quarto CLI
    deb_package_name: "{{ quarto_package_name }}"
    deb_package_architecture: "{{ workstation_architecture }}"
    deb_package_version: "{{ quarto_release_version }}"

- name: Download, verify, and install required Quarto CLI release
  when:
    - deb_package_install_required or deb_package_repair_required
    - not ansible_check_mode
  block:
    - name: Create temporary directory for Quarto CLI package
      ansible.builtin.tempfile:
        state: directory
        suffix: .quarto
      register: quarto_package_tempdir
      changed_when: false

    - name: Download and install verified Quarto CLI package
      block:
        - name: Download verified Quarto CLI package
          ansible.builtin.get_url:
            url: "{{ github_release_asset.browser_download_url }}"
            dest: >-
              {{ quarto_package_tempdir.path }}/{{ github_release_asset.name }}
            checksum: "{{ github_release_asset.digest }}"
            mode: "0600"

        - name: Install or repair verified Quarto CLI package
          ansible.builtin.include_role:
            name: deb_package
            tasks_from: install.yml
          vars:
            deb_package_display_name: Quarto CLI
            deb_package_name: "{{ quarto_package_name }}"
            deb_package_architecture: "{{ workstation_architecture }}"
            deb_package_version: "{{ quarto_release_version }}"
            deb_package_path: >-
              {{ quarto_package_tempdir.path }}/{{ github_release_asset.name }}
      always:
        - name: Remove temporary Quarto CLI package directory
          ansible.builtin.file:
            path: "{{ quarto_package_tempdir.path }}"
            state: absent
          changed_when: false
