---
- name: Install Quarto CLI from the latest verified GitHub release
  ansible.builtin.include_role:
    name: github_release
    tasks_from: deb.yml
  vars:
    github_release_display_name: Quarto CLI
    github_release_repository: "{{ quarto_repository }}"
    github_release_deb_package_name: "{{ quarto_package_name }}"
    github_release_asset_filename: "{{ quarto_package_filename }}"
