---
- name: Validate Quarto CLI architecture support
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in linux_release_architecture_map
    fail_msg: >-
      Quarto CLI supports AMD64 and ARM64. Detected
      {{ ansible_facts["architecture"] }}.

# Fetching, selecting, and validating the release asset is shared with the
# binary installers through the github_release role, so API and digest
# hardening lives in one place.
- name: Resolve latest Quarto CLI package asset
  ansible.builtin.include_role:
    name: github_release
    tasks_from: resolve_asset.yml
  vars:
    github_release_display_name: Quarto CLI
    github_release_repository: "{{ quarto_repository }}"
    github_release_asset_filename: "{{ quarto_package_filename }}"

# A rate-limited GitHub API is a transient condition: keeping the installed
# package for one run is fine, but a missing installation cannot be
# bootstrapped without release metadata, so only that case fails.
- name: Inspect installed Quarto CLI package while metadata is unavailable
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - '--showformat=${db:Status-Status}\n'
      - "{{ quarto_package_name }}:{{ workstation_architecture }}"
  environment:
    LC_ALL: C
  register: quarto_installed_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when: not github_release_api_available

- name: Require installed Quarto CLI while release metadata is unavailable
  ansible.builtin.assert:
    that:
      - quarto_installed_probe.rc == 0
      - quarto_installed_probe.stdout_lines | last | default('') == 'installed'
    fail_msg: >-
      The GitHub API request for {{ quarto_repository }} was rejected (HTTP
      {{ github_release_metadata.status }}, typically rate limiting) and
      Quarto CLI is not installed yet, so the release cannot be resolved.
      Rerun the playbook later.
  when: not github_release_api_available

- name: Skip Quarto CLI update check while release metadata is unavailable
  ansible.builtin.debug:
    msg: >-
      Keeping the installed Quarto CLI package unchanged; the GitHub API
      request was rejected (HTTP {{ github_release_metadata.status }},
      typically rate limiting), so the latest-release check was skipped
      this run.
  when: not github_release_api_available

- name: Ensure latest Quarto CLI release
  ansible.builtin.include_role:
    name: deb_package
    tasks_from: ensure.yml
  vars:
    deb_package_display_name: Quarto CLI
    deb_package_name: "{{ quarto_package_name }}"
    deb_package_architecture: "{{ workstation_architecture }}"
    deb_package_version: "{{ quarto_release_version }}"
    deb_package_url: "{{ github_release_asset.browser_download_url }}"
    deb_package_checksum: "{{ github_release_asset.digest }}"
    deb_package_filename: "{{ github_release_asset.name }}"
  when: github_release_api_available
