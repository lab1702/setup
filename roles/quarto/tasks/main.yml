---
- name: Validate Quarto CLI architecture support
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in quarto_architecture_map
    fail_msg: >-
      Quarto CLI supports AMD64 and ARM64. Detected
      {{ ansible_facts["architecture"] }}.

- name: Install Quarto CLI package prerequisites
  ansible.builtin.apt:
    name: xz-utils
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120

- name: Get latest Quarto CLI release
  ansible.builtin.uri:
    url: "{{ quarto_release_api_url }}"
    return_content: true
  register: quarto_release
  changed_when: false
  check_mode: false

- name: Select Quarto CLI package asset
  vars:
    quarto_release_tag: "{{ quarto_release.json.tag_name }}"
    quarto_release_version: >-
      {{ quarto_release_tag | regex_replace('^v', '') }}
    quarto_release_architecture: >-
      {{ quarto_architecture_map[ansible_facts["architecture"]] }}
    quarto_package_filename: >-
      quarto-{{ quarto_release_version }}-linux-{{
      quarto_release_architecture }}.deb
  ansible.builtin.set_fact:
    quarto_release_asset: >-
      {{ quarto_release.json.assets
      | selectattr('name', 'equalto', quarto_package_filename)
      | first | default({}) }}

- name: Validate Quarto CLI package asset
  ansible.builtin.assert:
    that:
      - quarto_release_asset | length > 0
      - quarto_release_asset.state | default('') == 'uploaded'
      - >-
        (quarto_release_asset.browser_download_url | default('')).startswith(
        quarto_release_base_url ~ '/')
      - >-
        (quarto_release_asset.digest | default(''))
        is match('^sha256:[0-9a-f]{64}$')
    fail_msg: >-
      The latest Quarto CLI release did not contain the expected uploaded
      package with a trusted GitHub download URL and SHA-256 digest.

- name: Gather installed package facts for Quarto CLI
  ansible.builtin.package_facts:
    manager: auto

- name: Inspect Quarto CLI dpkg configuration state
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - '--showformat=${db:Status-Status}\n'
      - >-
        {{ quarto_package_name }}:{{
        quarto_architecture_map[ansible_facts['architecture']] }}
  environment:
    LC_ALL: C
  register: quarto_installed_package_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Determine whether Quarto CLI installation is required
  vars:
    quarto_release_version: >-
      {{ quarto_release.json.tag_name | regex_replace('^v', '') }}
    quarto_release_architecture: >-
      {{ quarto_architecture_map[ansible_facts["architecture"]] }}
    quarto_installed_packages: >-
      {{ ansible_facts.packages[quarto_package_name] | default([])
      | selectattr('arch', 'defined')
      | selectattr('arch', 'equalto', quarto_release_architecture) | list }}
    quarto_installed_version: >-
      {{ (quarto_installed_packages | first | default({})).version
      | default('') }}
  ansible.builtin.set_fact:
    quarto_install_required: >-
      {{ quarto_installed_version != quarto_release_version or
      quarto_installed_package_status.rc | default(1) != 0 }}
    quarto_repair_required: >-
      {{ quarto_installed_version == quarto_release_version and
      quarto_installed_package_status.rc | default(1) == 0 and
      quarto_installed_package_status.stdout | default('') != 'installed' }}

- name: Report pending Quarto CLI package repair in check mode
  ansible.builtin.debug:
    msg: >-
      Quarto CLI {{ quarto_release.json.tag_name }} would be configured to
      repair its incomplete dpkg state.
  changed_when: true
  when:
    - ansible_check_mode
    - quarto_repair_required

- name: Report pending Quarto CLI installation in check mode
  ansible.builtin.debug:
    msg: >-
      Quarto CLI {{ quarto_release.json.tag_name }} would be installed.
  changed_when: true
  when:
    - ansible_check_mode
    - quarto_install_required

- name: Download, verify, and install required Quarto CLI release
  when:
    - quarto_install_required or quarto_repair_required
    - not ansible_check_mode
  block:
    - name: Create temporary directory for Quarto CLI package
      ansible.builtin.tempfile:
        state: directory
        suffix: .quarto
      register: quarto_package_tempdir
      changed_when: false

    - name: Download and install verified Quarto CLI package
      block:
        - name: Download verified Quarto CLI package
          ansible.builtin.get_url:
            url: "{{ quarto_release_asset.browser_download_url }}"
            dest: >-
              {{ quarto_package_tempdir.path }}/{{ quarto_release_asset.name }}
            checksum: "{{ quarto_release_asset.digest }}"
            mode: "0600"

        - name: Inspect downloaded Quarto CLI package metadata
          ansible.builtin.command:
            argv:
              - dpkg-deb
              - --show
              - '--showformat=${Package}\t${Version}\t${Architecture}\n'
              - >-
                {{ quarto_package_tempdir.path }}/{{ quarto_release_asset.name }}
          register: quarto_downloaded_package_metadata
          changed_when: false

        - name: Validate downloaded Quarto CLI package metadata
          vars:
            quarto_release_version: >-
              {{ quarto_release.json.tag_name | regex_replace('^v', '') }}
            quarto_release_architecture: >-
              {{ quarto_architecture_map[ansible_facts["architecture"]] }}
            quarto_expected_package_metadata:
              - "{{ quarto_package_name }}"
              - "{{ quarto_release_version }}"
              - "{{ quarto_release_architecture }}"
          ansible.builtin.assert:
            that:
              - >-
                quarto_downloaded_package_metadata.stdout.split() ==
                quarto_expected_package_metadata
            fail_msg: >-
              The downloaded Quarto CLI package metadata does not match the
              expected package name, version, and architecture.

        - name: Install verified Quarto CLI package
          ansible.builtin.apt:
            deb: >-
              {{ quarto_package_tempdir.path }}/{{ quarto_release_asset.name }}
            state: present
            allow_downgrade: true
            lock_timeout: 120
          when: quarto_install_required

        - name: Repair matching Quarto CLI package through APT
          ansible.builtin.command:
            argv:
              - /usr/bin/apt-get
              - --yes
              - --fix-broken
              - --no-remove
              - --reinstall
              - -o
              - DPkg::Lock::Timeout=120
              - -o
              - Dpkg::Options::=--force-confdef
              - -o
              - Dpkg::Options::=--force-confold
              - install
              - >-
                {{ quarto_package_tempdir.path }}/{{
                quarto_release_asset.name }}
          environment:
            DEBIAN_FRONTEND: noninteractive
            LC_ALL: C
          changed_when: true
          when: quarto_repair_required

        - name: Inspect repaired Quarto CLI package state
          ansible.builtin.command:
            argv:
              - dpkg-query
              - --show
              - >-
                --showformat=${Version}\t${Architecture}\t${db:Status-Status}\n
              - >-
                {{ quarto_package_name }}:{{
                quarto_architecture_map[ansible_facts['architecture']] }}
          environment:
            LC_ALL: C
          register: quarto_repaired_package_status
          changed_when: false
          failed_when: false
          when: quarto_repair_required

        - name: Validate repaired Quarto CLI package state
          vars:
            quarto_release_version: >-
              {{ quarto_release.json.tag_name | regex_replace('^v', '') }}
            quarto_release_architecture: >-
              {{ quarto_architecture_map[ansible_facts["architecture"]] }}
            quarto_expected_repaired_package_status:
              - "{{ quarto_release_version }}"
              - "{{ quarto_release_architecture }}"
              - installed
          ansible.builtin.assert:
            that:
              - quarto_repaired_package_status.rc | default(1) == 0
              - >-
                quarto_repaired_package_status.stdout.split() ==
                quarto_expected_repaired_package_status
            fail_msg: >-
              APT did not leave the expected Quarto CLI package version and
              architecture fully configured.
          when: quarto_repair_required
      always:
        - name: Remove temporary Quarto CLI package directory
          ansible.builtin.file:
            path: "{{ quarto_package_tempdir.path }}"
            state: absent
          changed_when: false
