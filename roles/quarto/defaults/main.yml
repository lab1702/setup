---
quarto_repository: quarto-dev/quarto-cli
quarto_package_name: quarto

# github_release_version is set by the github_release role's resolve_asset
# tasks; quarto_package_filename is evaluated during asset selection, after
# that fact exists, and workstation_architecture comes from group_vars.
quarto_release_version: "{{ github_release_version }}"
quarto_package_filename: >-
  quarto-{{ quarto_release_version }}-linux-{{ workstation_architecture }}.deb
