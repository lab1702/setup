---
# Installs the latest GitHub release of one or more statically linked Linux
# binaries shipped in a tar.gz or zip archive. Callers set:
#   github_release_display_name   human-readable name used in messages
#   github_release_repository     GitHub "owner/name" repository
#   github_release_binaries       binaries shipped inside the archive
# By default the archive is expected to be named
#   <first binary>-<arch>-unknown-linux-gnu.tar.gz
# and to contain exactly one top-level directory of the same name holding the
# listed binaries. Override github_release_archive_directory when an upstream
# project uses a different directory name, github_release_archive_filename
# when it uses a different asset name, github_release_archive_format and
# github_release_archive_layout when it ships a zip archive holding the
# binaries at the archive root, and github_release_version_token_index when
# --version reports the version somewhere other than the second whitespace
# separated output token.
#
# Vendors that publish a .deb instead of a bare binary include the deb.yml
# entry point through include_role with tasks_from, setting
# github_release_display_name, github_release_repository,
# github_release_deb_package_name, and github_release_asset_filename (see
# the header of tasks/deb.yml).
github_release_display_name: "{{ github_release_binaries | first }}"
github_release_binaries: []
github_release_deb_package_name: ""
# GitHub "owner/name" shape shared by both entry points' validation.
github_release_repository_pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'

github_release_api_url: >-
  https://api.github.com/repos/{{ github_release_repository }}/releases/latest
# Statuses the release-metadata request accepts instead of failing: a
# fresh 200, a 304 revalidation, and the rate-limit responses
# the caller's keep-installed fallback handles. The request's retry gate
# consults this same list, so the accepted set cannot drift between the
# status check and the retry decision.
github_release_accepted_status_codes:
  - 200
  - 304
  - 403
  - 429

# Optional GitHub token sent as a bearer credential with the release
# request, whose output is censored while one is in use so the token never
# reaches verbose or failure output. The playbook defaults to anonymous
# requests; set this variable to authenticate (see README). Only the
# cache test reads GITHUB_TOKEN automatically.
github_release_api_token: ""

# Conditional-request cache for the release metadata: ETag revalidation
# avoids downloading an unchanged response body. GitHub exempts 304
# responses from the primary rate limit only for authenticated requests;
# anonymous revalidations still consume the shared per-IP quota.
github_release_cache_directory: /var/cache/ansible-github-releases
github_release_cache_path: >-
  {{ github_release_cache_directory }}/{{
  github_release_repository | replace('/', '--') }}.json
# The cache is root-owned by default; the tests override the owner to
# exercise the cache flow without privileges.
github_release_cache_owner: root
github_release_cache_group: root
github_release_base_url: >-
  https://github.com/{{ github_release_repository }}/releases/download
github_release_install_directory: /usr/local/bin
github_release_probe_user: nobody
# The probe account is deliberately unprivileged and therefore has no
# usable home directory (nobody's is /nonexistent), so the default
# remote_tmp of ~/.ansible/tmp cannot be created when the probe modules
# expand it as that user. Ansible warns once per run and falls back to
# the system temporary directory anyway; naming a system temporary
# directory here keeps the runs quiet without moving anything. Ansible
# already stages unprivileged-become modules under the first entry of
# system_tmpdirs, so /var/tmp leaves the staging location unchanged, and
# the module still creates a private 0700 subdirectory inside it.
github_release_probe_remote_tmp: /var/tmp

github_release_architecture_map:
  x86_64: x86_64
  amd64: x86_64
  aarch64: aarch64
  arm64: aarch64
github_release_architecture: >-
  {{ github_release_architecture_map[ansible_facts["architecture"]] }}
github_release_archive_directory: >-
  {{ github_release_binaries | first }}-{{ github_release_architecture
  }}-unknown-linux-gnu
github_release_archive_filename: "{{ github_release_archive_directory }}.tar.gz"

# The release asset that resolve_asset.yml selects and validates. The binary
# install flow resolves its archive by default; the deb.yml entry point's
# callers override this with their package filename.
github_release_asset_filename: "{{ github_release_archive_filename }}"

# Release tooling publishes the release first and uploads its assets one by
# one afterwards, so for a while the latest release can list some assets
# while the selected one is still absent or not yet uploaded. Within this
# many seconds of publication that counts as unavailable metadata (the
# keep-installed fallback applies); afterwards it is a deterministic
# failure such as a renamed asset or an abandoned upload.
github_release_asset_upload_grace_seconds: 3600

# tar.gz archives may hold the binaries inside one top-level directory
# ("directory" layout) or at the archive root ("flat" layout); zip archives
# only support the flat layout.
github_release_archive_format: tar.gz
github_release_archive_layout: directory
github_release_version_token_index: 1
