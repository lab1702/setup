---
# Exercises the release-metadata cache against the live GitHub API: a
# fresh 200 populates the cache, a rerun revalidates it (normally with a
# quota-free 304; a release republished mid-test legitimately yields a
# fresh 200), corrupt or malformed caches are discarded without failing
# the run, and a missing asset resolves as pending inside the upload
# grace window but fails past it. The cache directory and ownership come from the role
# defaults, overridden here so the flow runs without privileges. A
# rate-limited first resolution skips the remaining checks — via a
# gated block rather than end_play, so the cleanup below always runs —
# and rate limiting that begins mid-test is tolerated by the later
# asserts, which accept 403/429 alongside the expected statuses. A
# release republished mid-test whose asset is still uploading resolves as
# pending rather than available; both count as a usable resolution here.
- name: Exercise the GitHub release metadata cache
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../../../group_vars/all.yml
  vars:
    github_release_display_name: Ruff cache test
    github_release_repository: astral-sh/ruff
    github_release_binaries:
      - ruff
    github_release_cache_directory: >-
      {{ github_release_test_cache_directory.path }}/cache
    github_release_cache_owner: "{{ ansible_facts['user_id'] }}"
    github_release_cache_group: "{{ ansible_facts['user_gid'] }}"
    github_release_test_cache_path: >-
      {{ github_release_cache_directory }}/astral-sh--ruff.json
  tasks:
    - name: Create temporary cache test directory
      ansible.builtin.tempfile:
        state: directory
        suffix: .github-release-cache-test
      register: github_release_test_cache_directory
      changed_when: false
      check_mode: false

    - name: Exercise cache population and revalidation
      block:
        - name: Resolve the release without a cache
          ansible.builtin.include_role:
            name: github_release
            tasks_from: resolve_asset.yml

        - name: Record whether the API is rate limited
          ansible.builtin.set_fact:
            github_release_test_rate_limited: >-
              {{ github_release_metadata.status in [403, 429] }}

        - name: Exercise the cache while the API is available
          when: not github_release_test_rate_limited | bool
          block:
            # A 200 without an ETag is valid role behavior that simply
            # writes no cache, so the file check is gated on the ETag.
            - name: Validate the fresh resolution and the written cache
              ansible.builtin.assert:
                that:
                  - github_release_metadata.status == 200
                  - >-
                    github_release_api_available
                    or github_release_asset_pending
                  - github_release_version | length > 0
                  - >-
                    github_release_metadata.etag | default('')
                    | length == 0
                    or github_release_test_cache_path is exists

            - name: Resolve the release against the cache
              ansible.builtin.include_role:
                name: github_release
                tasks_from: resolve_asset.yml

            # Normally a quota-free 304; a republished release yields a
            # fresh 200 and mid-test rate limiting yields 403/429, both
            # legitimate.
            - name: Validate the revalidation
              ansible.builtin.assert:
                that:
                  - github_release_metadata.status in [200, 304, 403, 429]
                  - >-
                    github_release_metadata.status not in [200, 304]
                    or ((github_release_api_available
                    or github_release_asset_pending)
                    and github_release_version | length > 0)

            - name: Corrupt the cache with unparseable content
              ansible.builtin.copy:
                dest: "{{ github_release_test_cache_path }}"
                content: not json {
                mode: "0644"
              changed_when: false
              check_mode: false

            - name: Resolve the release against the corrupt cache
              ansible.builtin.include_role:
                name: github_release
                tasks_from: resolve_asset.yml

            - name: Validate the corrupt cache was discarded
              ansible.builtin.assert:
                that:
                  - github_release_metadata.status in [200, 403, 429]
                  - >-
                    github_release_metadata.status != 200
                    or github_release_api_available
                    or github_release_asset_pending

            - name: Replace the cache with a malformed but current shape
              ansible.builtin.copy:
                dest: "{{ github_release_test_cache_path }}"
                content: >-
                  {{ {'etag': github_release_metadata.etag
                  | default('W/"x"'),
                  'body': {}} | to_nice_json }}
                mode: "0644"
              changed_when: false
              check_mode: false

            - name: Resolve the release against the malformed cache
              ansible.builtin.include_role:
                name: github_release
                tasks_from: resolve_asset.yml

            - name: Validate the malformed cache was discarded before use
              ansible.builtin.assert:
                that:
                  - github_release_metadata.status in [200, 403, 429]
                  - >-
                    github_release_metadata.status != 200
                    or ((github_release_api_available
                    or github_release_asset_pending)
                    and github_release_version | length > 0)

            # An asset the release does not carry counts as still
            # uploading inside the grace window, so the keep-installed
            # fallback applies, and as a deterministic failure past it.
            - name: Resolve a missing asset inside the upload grace window
              ansible.builtin.include_role:
                name: github_release
                tasks_from: resolve_asset.yml
              vars:
                github_release_asset_filename: missing-asset.deb
                github_release_asset_upload_grace_seconds: 315360000

            - name: Validate the pending resolution
              ansible.builtin.assert:
                that:
                  - github_release_metadata.status in [200, 304, 403, 429]
                  - >-
                    github_release_metadata.status not in [200, 304]
                    or (github_release_asset_pending
                    and not github_release_api_available)

            - name: Verify a missing asset past the grace window is rejected
              block:
                - name: Resolve a missing asset past the upload grace window
                  ansible.builtin.include_role:
                    name: github_release
                    tasks_from: resolve_asset.yml
                  vars:
                    github_release_asset_filename: missing-asset.deb
                    github_release_asset_upload_grace_seconds: 0

                - name: Reject unexpected acceptance of a missing asset
                  ansible.builtin.fail:
                    msg: The missing asset was unexpectedly accepted.
              rescue:
                - name: Validate the missing-asset rejection
                  ansible.builtin.assert:
                    that:
                      - >-
                        github_release_metadata.status in [403, 429]
                        or (not github_release_asset_pending
                        and github_release_api_available
                        and ansible_failed_result.msg is search(
                        'did not contain the expected uploaded asset'))
      always:
        - name: Remove the temporary cache test directory
          ansible.builtin.file:
            path: "{{ github_release_test_cache_directory.path }}"
            state: absent
          changed_when: false
          check_mode: false
