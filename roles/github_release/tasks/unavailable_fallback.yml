---
# Shared policy for a rejected GitHub API request: an installed release
# may be kept unchanged for one run, but a missing installation cannot be
# bootstrapped without release metadata, so only that case fails. Callers
# set github_release_installed to whether a safe installation is present.
- name: Require installed release of {{ github_release_display_name }}
  ansible.builtin.assert:
    that:
      - github_release_installed
    fail_msg: >-
      The GitHub API request for {{ github_release_repository }} was
      rejected (HTTP {{ github_release_metadata.status }}, typically rate
      limiting) and {{ github_release_display_name }} is not installed
      yet, so the release cannot be resolved. Rerun the playbook later.

- name: Skip release update check of {{ github_release_display_name }}
  ansible.builtin.debug:
    msg: >-
      Keeping the installed {{ github_release_display_name }} unchanged;
      the GitHub API request was rejected (HTTP
      {{ github_release_metadata.status }}, typically rate limiting), so
      the latest-release check was skipped this run.
