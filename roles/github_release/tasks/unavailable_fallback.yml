---
# Shared policy for an unusable GitHub API response: an installed release
# may be kept unchanged for one run, but a missing installation cannot be
# bootstrapped without release metadata, so only that case fails. Callers
# set github_release_installed to whether a safe installation is present.
# Reached for rate-limited responses (403/429), for a release without
# uploaded assets (assets still uploading, or a source-only release), and
# for responses without usable release JSON, so the diagnostics name the
# actual condition.
- name: Report unusable release metadata of {{ github_release_display_name }}
  vars:
    github_release_unavailable_reason: >-
      {{ 'HTTP ' ~ github_release_metadata.status ~
      ', typically rate limiting'
      if github_release_metadata.status in [403, 429]
      else 'a latest release (' ~
      github_release_metadata.json.tag_name | default('') ~
      ') without uploaded assets, typically assets still uploading or a
      source-only release'
      if (github_release_metadata.json.tag_name | default('') | length > 0
      and github_release_metadata.json.assets is defined
      and github_release_metadata.json.assets == [])
      else 'an HTTP ' ~ github_release_metadata.status ~
      ' response without usable release metadata, typically an
      intercepting proxy or a network problem' }}
  block:
    - name: Require installed release of {{ github_release_display_name }}
      ansible.builtin.assert:
        that:
          - github_release_installed
        fail_msg: >-
          The GitHub API request for {{ github_release_repository }}
          returned {{ github_release_unavailable_reason }} and
          {{ github_release_display_name }} is not installed yet, so the
          release cannot be resolved. Rerun the playbook once the GitHub
          API returns usable release metadata.

    - name: Skip release update check of {{ github_release_display_name }}
      ansible.builtin.debug:
        msg: >-
          Keeping the installed {{ github_release_display_name }}
          unchanged; the GitHub API request returned
          {{ github_release_unavailable_reason }}, so the latest-release
          check was skipped this run.
