---
# Resolves the latest GitHub release of github_release_repository and
# validates the asset named github_release_asset_filename. The filename may
# reference github_release_version (the release tag without a leading "v"),
# which is set before the asset is selected. Exports the
# github_release_metadata and github_release_api_available facts for the
# caller; the github_release_data, github_release_version, and
# github_release_asset facts are exported only when
# github_release_api_available is true and otherwise stay unset — or keep
# stale values from an earlier include in the same play — so callers must
# guard every use of them on github_release_api_available.
#
# Unauthenticated api.github.com requests share a small per-IP quota, so
# each 200 response's ETag and body are cached and revalidated with
# If-None-Match on the next run — 304 responses do not count against the
# rate limit. github_release_api_available becomes false for a
# rate-limited response (403 or 429, accepted immediately without
# retrying — the quota resets on the order of an hour, far beyond any
# useful retry delay) and for a 200 whose body is not usable release
# JSON (an intercepting proxy, for example); in both cases the caller
# decides whether an already-installed release makes skipping this run
# acceptable. The retries cover genuinely failed attempts (connection
# errors and server-side failures) only.

# The cache is a pure optimization, so its bookkeeping must never fail
# the run: the directory ensure and the write below tolerate failure, and
# an unusable cache only costs one unconditional API request. The
# directory is created in check mode too — the write below runs for real
# during dry runs and needs the directory to exist.
- name: Ensure release metadata cache directory exists
  ansible.builtin.file:
    path: "{{ github_release_cache_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  changed_when: false
  failed_when: false
  check_mode: false

- name: Inspect cached release metadata of {{ github_release_display_name }}
  ansible.builtin.stat:
    path: "{{ github_release_cache_path }}"
    follow: false
  register: github_release_cache_status

- name: Reset cached release metadata of {{ github_release_display_name }}
  ansible.builtin.set_fact:
    github_release_cache: {}

- name: Load cached release metadata of {{ github_release_display_name }}
  when:
    - github_release_cache_status.stat.isreg | default(false)
    - github_release_cache_status.stat.uid | default(-1) == 0
    - github_release_cache_status.stat.gid | default(-1) == 0
    - github_release_cache_status.stat.mode | default('') == '0644'
  block:
    - name: Read cached release metadata of {{ github_release_display_name }}
      ansible.builtin.slurp:
        src: "{{ github_release_cache_path }}"
      register: github_release_cache_content

    - name: Accept cached release metadata of {{ github_release_display_name }}
      ansible.builtin.set_fact:
        github_release_cache: >-
          {{ github_release_cache_content.content | b64decode | from_json }}
  rescue:
    # Swallow the error; the reset above already left the fact empty.
    - name: Discard unreadable release metadata cache of {{ github_release_display_name }}
      ansible.builtin.set_fact:
        github_release_cache: {}

# A cache that parses but lacks the expected shape is discarded before
# its ETag can be sent, so a 304 can never revalidate an unusable body.
- name: Discard malformed release metadata cache of {{ github_release_display_name }}
  ansible.builtin.set_fact:
    github_release_cache: {}
  when: >-
    github_release_cache.etag | default('') | length == 0 or
    github_release_cache.body.tag_name | default('') | length == 0 or
    github_release_cache.body.assets | default([]) | length == 0

- name: Get latest release of {{ github_release_display_name }}
  ansible.builtin.uri:
    url: "{{ github_release_api_url }}"
    return_content: true
    status_code: [200, 304, 403, 429]
    headers:
      If-None-Match: "{{ github_release_cache.etag | default(omit) }}"
  register: github_release_metadata
  changed_when: false
  check_mode: false
  retries: 3
  delay: 10

# A 200 response whose body is not usable release JSON — unparseable, or
# parseable without the release fields (an intercepting proxy's error
# object) — is treated like an unavailable API so the caller's
# keep-installed fallback applies instead of a templating error. The
# shape test mirrors the malformed-cache discard above, so only bodies
# the loader would accept are ever treated as fresh metadata.
- name: Determine release metadata availability
  ansible.builtin.set_fact:
    github_release_api_available: >-
      {{ (github_release_metadata.status == 200
      and github_release_metadata.json.tag_name | default('') | length > 0
      and github_release_metadata.json.assets | default([]) | length > 0)
      or github_release_metadata.status == 304 }}

# Written in check mode too: the API request above always runs, so dry
# runs would otherwise never earn quota-free 304 revalidations.
- name: Cache release metadata of {{ github_release_display_name }}
  ansible.builtin.copy:
    dest: "{{ github_release_cache_path }}"
    content: >-
      {{ {'etag': github_release_metadata.etag,
      'body': github_release_metadata.json} | to_nice_json }}
    owner: root
    group: root
    mode: "0644"
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - github_release_api_available
    - github_release_metadata.status == 200
    - github_release_metadata.etag | default('') | length > 0

- name: Select release metadata of {{ github_release_display_name }}
  ansible.builtin.set_fact:
    github_release_data: >-
      {{ github_release_metadata.json
      if github_release_metadata.status == 200
      else github_release_cache.body | default({}) }}
  when: github_release_api_available

- name: Select release version of {{ github_release_display_name }}
  ansible.builtin.set_fact:
    github_release_version: >-
      {{ github_release_data.tag_name | regex_replace('^v', '') }}
  when: github_release_api_available

- name: Select release asset of {{ github_release_display_name }}
  ansible.builtin.set_fact:
    github_release_asset: >-
      {{ github_release_data.assets
      | selectattr('name', 'equalto', github_release_asset_filename)
      | first | default({}) }}
  when: github_release_api_available

- name: Validate release asset of {{ github_release_display_name }}
  ansible.builtin.assert:
    that:
      - github_release_asset | length > 0
      - github_release_asset.state | default('') == 'uploaded'
      - >-
        (github_release_asset.browser_download_url | default('')).startswith(
        github_release_base_url ~ '/')
      - >-
        (github_release_asset.digest | default(''))
        is match('^sha256:[0-9a-f]{64}$')
    fail_msg: >-
      The latest {{ github_release_display_name }} release did not contain
      the expected uploaded asset with a trusted GitHub download URL and
      SHA-256 digest.
  when: github_release_api_available
