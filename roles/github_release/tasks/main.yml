---
- name: Validate GitHub release parameters
  ansible.builtin.assert:
    that:
      - github_release_repository is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
      - github_release_binaries | length > 0
      - >-
        github_release_binaries | unique | list | length
        == github_release_binaries | length
      - >-
        github_release_binaries | select('match', '^[A-Za-z0-9_.-]+$')
        | list | length == github_release_binaries | length
      - github_release_archive_format in ['tar.gz', 'zip']
      - github_release_archive_layout in ['directory', 'flat']
      - >-
        github_release_archive_format == 'tar.gz'
        or github_release_archive_layout == 'flat'
      - github_release_version_token_index | int(-1) >= 0
    fail_msg: >-
      The github_release role needs a GitHub owner/name repository, a
      non-empty list of distinct binary names, a supported archive format
      (tar.gz or zip, where zip archives must use the flat layout), a
      supported archive layout (directory or flat), and a non-negative
      version token index.

- name: Validate architecture support for {{ github_release_display_name }}
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in github_release_architecture_map
    fail_msg: >-
      {{ github_release_display_name }} supports AMD64 and ARM64. Detected
      {{ ansible_facts["architecture"] }}.

- name: Resolve release version probe account
  ansible.builtin.getent:
    database: passwd
    key: "{{ github_release_probe_user }}"
    fail_key: false

- name: Validate release version probe account
  vars:
    github_release_probe_passwd: >-
      {{ ansible_facts["getent_passwd"][github_release_probe_user]
      | default([], true) }}
  ansible.builtin.assert:
    that:
      - github_release_probe_passwd | length >= 3
      - (github_release_probe_passwd + ['', '', ''])[1] | int > 0
    fail_msg: >-
      Version probes require the unprivileged
      {{ github_release_probe_user }} account with a non-root user ID.

- name: Inspect release install directory
  ansible.builtin.stat:
    path: "{{ github_release_install_directory }}"
    follow: false
  register: github_release_install_directory_status

- name: Validate release install directory security
  ansible.builtin.assert:
    that:
      - github_release_install_directory_status.stat.isdir | default(false)
      - not github_release_install_directory_status.stat.islnk | default(false)
      - github_release_install_directory_status.stat.uid | default(-1) == 0
      - github_release_install_directory_status.stat.gid | default(-1) == 0
      - >-
        (github_release_install_directory_status.stat.mode | default(''))
        is match('^0[1357][0145][15]$')
    fail_msg: >-
      {{ github_release_install_directory }} must be an existing root-owned
      directory, must not be a symbolic link, must be traversable by ordinary
      users, and must not be group- or world-writable.

- name: Resolve latest release archive asset
  ansible.builtin.include_tasks: resolve_asset.yml

- name: Inspect installed release binary paths
  ansible.builtin.stat:
    path: "{{ github_release_install_directory }}/{{ item }}"
    follow: false
  loop: "{{ github_release_binaries }}"
  register: github_release_installed_binary_statuses

- name: Validate installed release binary path types
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.exists or
        item.stat.isreg | default(false) or
        item.stat.islnk | default(false)
    fail_msg: >-
      Refusing to replace {{ github_release_install_directory }}/{{ item.item
      }} because it is neither a regular file nor a symbolic link.
  loop: "{{ github_release_installed_binary_statuses.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Determine whether installed release binaries are safe to execute
  vars:
    github_release_safe_binary_statuses: >-
      {{ github_release_installed_binary_statuses.results
      | selectattr('stat.isreg', 'defined')
      | selectattr('stat.isreg')
      | rejectattr('stat.islnk')
      | selectattr('stat.uid', 'equalto', 0)
      | selectattr('stat.gid', 'equalto', 0)
      | selectattr('stat.mode', 'equalto', '0755') | list }}
  ansible.builtin.set_fact:
    github_release_installed_binaries_are_safe: >-
      {{ github_release_safe_binary_statuses | length
      == github_release_binaries | length }}

- name: Inspect installed release versions as {{ github_release_probe_user }}
  ansible.builtin.command:
    argv:
      - "{{ github_release_install_directory }}/{{ item }}"
      - --version
    chdir: "{{ github_release_install_directory }}"
  become: true
  become_user: "{{ github_release_probe_user }}"
  loop: "{{ github_release_binaries }}"
  register: github_release_installed_releases
  changed_when: false
  failed_when: false
  check_mode: false
  when: github_release_installed_binaries_are_safe

- name: Initialize required release installation state
  ansible.builtin.set_fact:
    github_release_install_required: >-
      {{ not github_release_installed_binaries_are_safe }}

- name: Determine whether release installation is required
  vars:
    github_release_installed_version: >-
      {{ ((item.stdout | default('')).split() + ['']
      * (github_release_version_token_index | int
      + 1))[github_release_version_token_index | int]
      | regex_replace('^v', '') }}
  ansible.builtin.set_fact:
    github_release_install_required: >-
      {{ github_release_install_required | bool or
      item.rc | default(1) != 0 or
      github_release_installed_version != github_release_version }}
  loop: "{{ github_release_installed_releases.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Report pending installation of {{ github_release_display_name }}
  ansible.builtin.debug:
    msg: >-
      {{ github_release_display_name }}
      {{ github_release_metadata.json.tag_name }} would be installed in
      {{ github_release_install_directory }}
      ({{ github_release_binaries | join(', ') }}).
  changed_when: true
  when:
    - ansible_check_mode
    - github_release_install_required

- name: Download, verify, and install required release
  when:
    - github_release_install_required
    - not ansible_check_mode
  block:
    - name: Create temporary directory for release archive
      ansible.builtin.tempfile:
        state: directory
        suffix: ".{{ github_release_binaries | first }}"
      register: github_release_archive_tempdir
      changed_when: false

    - name: Download, inspect, and install verified release archive
      vars:
        github_release_archive_path: >-
          {{ github_release_archive_tempdir.path }}/{{
          github_release_asset.name }}
        github_release_staging_path: >-
          {{ github_release_archive_tempdir.path }}/staging
        github_release_archive_binary_members: >-
          {{ github_release_binaries
          if github_release_archive_layout == 'flat'
          else github_release_binaries
          | map('regex_replace', '^', github_release_archive_directory ~ '/')
          | list }}
        github_release_expected_archive_members: >-
          {{ ([github_release_archive_directory ~ '/']
          if github_release_archive_layout == 'directory' else [])
          + github_release_archive_binary_members }}
        github_release_expected_archive_member_type_pairs: >-
          {{ github_release_expected_archive_members
          | zip((['d'] if github_release_archive_layout == 'directory'
          else []) + ['-'] * (github_release_binaries | length))
          | map('list') | list | sort }}
      block:
        - name: Download verified release archive
          ansible.builtin.get_url:
            url: "{{ github_release_asset.browser_download_url }}"
            dest: "{{ github_release_archive_path }}"
            checksum: "{{ github_release_asset.digest }}"
            mode: "0600"

        - name: Inspect release archive member names
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - --gzip
              - --list
              - --file
              - "{{ github_release_archive_path }}"
              - --quoting-style=escape
          environment:
            GZIP: ""
            LC_ALL: C
            PATH: /usr/bin:/bin
            TAR_OPTIONS: ""
          register: github_release_archive_member_names
          changed_when: false
          when: github_release_archive_format == 'tar.gz'

        - name: Inspect release archive member metadata
          ansible.builtin.command:
            argv:
              - /usr/bin/tar
              - --gzip
              - --list
              - --verbose
              - --file
              - "{{ github_release_archive_path }}"
              - --quoting-style=escape
          environment:
            GZIP: ""
            LC_ALL: C
            PATH: /usr/bin:/bin
            TAR_OPTIONS: ""
          register: github_release_archive_member_metadata
          changed_when: false
          when: github_release_archive_format == 'tar.gz'

        - name: Validate release archive members
          vars:
            github_release_archive_member_type_pairs: >-
              {{ github_release_archive_member_names.stdout_lines
              | zip(github_release_archive_member_metadata.stdout_lines
              | map('first') | list) | map('list') | list | sort }}
          ansible.builtin.assert:
            that:
              - >-
                github_release_archive_member_names.stdout_lines | length ==
                github_release_expected_archive_members | length
              - >-
                github_release_archive_member_names.stdout_lines | unique
                | list | length ==
                github_release_archive_member_names.stdout_lines | length
              - >-
                github_release_archive_member_names.stdout_lines | sort ==
                github_release_expected_archive_members | sort
              - >-
                github_release_archive_member_metadata.stdout_lines | length
                == github_release_expected_archive_members | length
              - >-
                github_release_archive_member_type_pairs ==
                github_release_expected_archive_member_type_pairs
            fail_msg: >-
              The verified {{ github_release_display_name }} archive must
              contain exactly one top-level target directory and the regular
              binaries {{ github_release_binaries | join(', ') }}, without
              duplicate or unexpected members.
          when: github_release_archive_format == 'tar.gz'

        - name: Inspect release zip archive member names
          ansible.builtin.command:
            argv:
              - /usr/bin/unzip
              - -Z
              - "-1"
              - "{{ github_release_archive_path }}"
          environment:
            LC_ALL: C
            PATH: /usr/bin:/bin
            UNZIP: ""
            ZIPINFO: ""
          register: github_release_zip_member_names
          changed_when: false
          when: github_release_archive_format == 'zip'

        - name: Inspect release zip archive member metadata
          ansible.builtin.command:
            argv:
              - /usr/bin/unzip
              - -Z
              - -s
              - "{{ github_release_archive_path }}"
          environment:
            LC_ALL: C
            PATH: /usr/bin:/bin
            UNZIP: ""
            ZIPINFO: ""
          register: github_release_zip_member_metadata
          changed_when: false
          when: github_release_archive_format == 'zip'

        - name: Validate release zip archive members
          vars:
            github_release_zip_member_records: >-
              {{ github_release_zip_member_metadata.stdout_lines
              | select('match', '^[bcdlps-]') | list }}
            github_release_zip_member_modes: >-
              {{ github_release_zip_member_records
              | map('regex_search', '^\S+') | list }}
          ansible.builtin.assert:
            that:
              - >-
                github_release_zip_member_names.stdout_lines | length ==
                github_release_expected_archive_members | length
              - >-
                github_release_zip_member_names.stdout_lines | unique
                | list | length ==
                github_release_zip_member_names.stdout_lines | length
              - >-
                github_release_zip_member_names.stdout_lines | sort ==
                github_release_expected_archive_members | sort
              - >-
                github_release_zip_member_records | length ==
                github_release_expected_archive_members | length
              - >-
                github_release_zip_member_modes
                | select('match', '^-.{2}x.{6}$') | list | length ==
                github_release_expected_archive_members | length
            fail_msg: >-
              The verified {{ github_release_display_name }} zip archive must
              contain exactly the safe regular executables
              {{ github_release_binaries | join(', ') }}, without duplicate
              or unexpected members.
          when: github_release_archive_format == 'zip'

        - name: Create vetted release binary staging directory
          ansible.builtin.file:
            path: "{{ github_release_staging_path }}"
            state: directory
            owner: root
            group: root
            mode: "0700"
          changed_when: false

        - name: Extract validated release binaries into staging directory
          ansible.builtin.unarchive:
            src: "{{ github_release_archive_path }}"
            dest: "{{ github_release_staging_path }}"
            remote_src: true
            include: "{{ github_release_archive_binary_members }}"
            extra_opts: >-
              {{ ['--strip-components=1']
              if github_release_archive_layout == 'directory' else [] }}
            owner: root
            group: root
            mode: "0755"
          environment:
            GZIP: ""
            PATH: /usr/bin:/bin
            TAR_OPTIONS: ""
            UNZIP: ""
            ZIPINFO: ""

        - name: Inspect extracted release binaries
          ansible.builtin.stat:
            path: "{{ github_release_staging_path }}/{{ item }}"
            follow: false
          loop: "{{ github_release_binaries }}"
          register: github_release_downloaded_binary_statuses

        - name: Validate extracted release binaries
          ansible.builtin.assert:
            that:
              - item.stat.isreg | default(false)
              - not item.stat.islnk | default(false)
              - item.stat.uid | default(-1) == 0
              - item.stat.gid | default(-1) == 0
              - item.stat.mode | default('') == '0755'
            fail_msg: >-
              The extracted {{ item.item }} binary is not a root-owned
              regular executable.
          loop: "{{ github_release_downloaded_binary_statuses.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Inspect downloaded release versions without root privileges
          block:
            - name: Grant unprivileged traversal of release staging path
              ansible.builtin.file:
                path: "{{ item }}"
                state: directory
                mode: "0701"
              loop:
                - "{{ github_release_archive_tempdir.path }}"
                - "{{ github_release_staging_path }}"
              changed_when: false

            - name: Run downloaded release version probes
              ansible.builtin.command:
                argv:
                  - "{{ github_release_staging_path }}/{{ item }}"
                  - --version
                chdir: "{{ github_release_staging_path }}"
              become: true
              become_user: "{{ github_release_probe_user }}"
              loop: "{{ github_release_binaries }}"
              register: github_release_downloaded_releases
              changed_when: false
          always:
            - name: Restore release staging path permissions
              ansible.builtin.file:
                path: "{{ item }}"
                state: directory
                mode: "0700"
              loop:
                - "{{ github_release_staging_path }}"
                - "{{ github_release_archive_tempdir.path }}"
              changed_when: false

        - name: Validate downloaded release versions
          vars:
            github_release_downloaded_version: >-
              {{ (item.stdout.split() + ['']
              * (github_release_version_token_index | int
              + 1))[github_release_version_token_index | int]
              | regex_replace('^v', '') }}
          ansible.builtin.assert:
            that:
              - github_release_downloaded_version == github_release_version
            fail_msg: >-
              The downloaded {{ item.item }} binary version does not match
              GitHub's latest {{ github_release_display_name }} release tag.
          loop: "{{ github_release_downloaded_releases.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Install verified release binaries
          ansible.builtin.copy:
            src: "{{ github_release_staging_path }}/{{ item }}"
            dest: "{{ github_release_install_directory }}/{{ item }}"
            remote_src: true
            owner: root
            group: root
            mode: "0755"
            follow: false
          loop: "{{ github_release_binaries }}"
      always:
        - name: Remove temporary release archive directory
          ansible.builtin.file:
            path: "{{ github_release_archive_tempdir.path }}"
            state: absent
          changed_when: false
