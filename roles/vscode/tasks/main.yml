---
- name: Validate Visual Studio Code platform support
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Ubuntu"
      - >-
        ansible_facts["distribution_version"]
        in vscode_supported_ubuntu_versions
      - ansible_facts["architecture"] in vscode_supported_architectures
    fail_msg: >-
      Visual Studio Code supports Ubuntu 26.04 on AMD64 and ARM64. Detected
      {{ ansible_facts["distribution"] }}
      {{ ansible_facts["distribution_version"] }} on
      {{ ansible_facts["architecture"] }}.

- name: Preflight Visual Studio Code apt repository
  ansible.builtin.import_tasks: repository_preflight.yml

- name: Install Visual Studio Code repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gpg
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: vscode_repository_prerequisite_installation

- name: Configure signed Visual Studio Code repository and install package
  when: >-
    not ansible_check_mode or
    not vscode_repository_prerequisite_installation.changed
  block:
    - name: Create temporary directory for Microsoft signing key
      ansible.builtin.tempfile:
        state: directory
        suffix: .vscode
      register: vscode_repository_key_tempdir
      changed_when: false
      check_mode: false

    - name: Install Visual Studio Code from its verified repository
      block:
        - name: Download Microsoft signing key
          ansible.builtin.get_url:
            url: "{{ vscode_repository_key_url }}"
            dest: "{{ vscode_repository_key_tempdir.path }}/key.asc"
            mode: "0600"
          changed_when: false
          check_mode: false

        - name: Inspect Microsoft signing key
          ansible.builtin.command:
            argv:
              - gpg
              - --batch
              - --show-keys
              - --with-colons
              - "{{ vscode_repository_key_tempdir.path }}/key.asc"
          register: vscode_repository_key
          changed_when: false
          check_mode: false

        - name: Verify Microsoft signing key fingerprint
          vars:
            vscode_repository_public_key_records: >-
              {{ vscode_repository_key.stdout_lines
              | select('match', '^pub:') | list }}
            vscode_repository_fingerprint_records: >-
              {{ vscode_repository_key.stdout_lines
              | select('match', '^fpr:') | list }}
            vscode_repository_expected_fingerprint_record: >-
              fpr:::::::::{{ vscode_repository_key_fingerprint }}:
          ansible.builtin.assert:
            that:
              - vscode_repository_public_key_records | length == 1
              - >-
                (vscode_repository_fingerprint_records
                | first | default('')) ==
                vscode_repository_expected_fingerprint_record
            fail_msg: >-
              The downloaded Microsoft signing key does not contain exactly
              one primary key with fingerprint
              {{ vscode_repository_key_fingerprint }}.

        - name: Convert verified Microsoft signing key to binary keyring
          ansible.builtin.command:
            argv:
              - gpg
              - --batch
              - --yes
              - --dearmor
              - --output
              - "{{ vscode_repository_key_tempdir.path }}/key.gpg"
              - "{{ vscode_repository_key_tempdir.path }}/key.asc"
          changed_when: false
          check_mode: false

        - name: Install verified Microsoft signing key
          ansible.builtin.copy:
            src: "{{ vscode_repository_key_tempdir.path }}/key.gpg"
            dest: "{{ vscode_repository_keyring_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          register: vscode_repository_keyring_installation

        - name: Configure Visual Studio Code apt repository
          ansible.builtin.copy:
            dest: "{{ vscode_repository_sources_path }}"
            content: "{{ vscode_repository_source_content }}"
            owner: root
            group: root
            mode: "0644"
          register: vscode_repository_configuration

        - name: Install package while preserving the verified repository
          block:
            - name: Resolve and install the exact Microsoft repository version
              when: >-
                not ansible_check_mode or
                (not vscode_repository_keyring_installation.changed and
                not vscode_repository_configuration.changed)
              block:
                - name: Refresh Visual Studio Code repository metadata
                  ansible.builtin.apt:
                    update_cache: true
                    cache_valid_time: 0
                    lock_timeout: 120
                  changed_when: false
                  when: not ansible_check_mode

                - name: Discover published Visual Studio Code versions
                  ansible.builtin.command:
                    argv:
                      - apt-cache
                      - madison
                      - "{{ vscode_package_name }}"
                  environment:
                    LC_ALL: C
                  register: vscode_repository_versions
                  changed_when: false
                  check_mode: false

                - name: Select versions from the Microsoft repository
                  vars:
                    vscode_repository_version_pattern: >-
                      {{ '^\s*'
                      ~ (vscode_package_name
                      | ansible.builtin.regex_escape)
                      ~ '\s*\|\s*\S+\s*\|\s*'
                      ~ (vscode_repository_url
                      | regex_replace('/+$', '')
                      | ansible.builtin.regex_escape)
                      ~ '/?(?:\s|$)' }}
                  ansible.builtin.set_fact:
                    vscode_repository_version_rows: >-
                      {{ vscode_repository_versions.stdout_lines
                      | select('match', vscode_repository_version_pattern)
                      | list }}

                - name: Validate available Visual Studio Code versions
                  ansible.builtin.assert:
                    that:
                      - vscode_repository_version_rows | length > 0
                    fail_msg: >-
                      The verified Microsoft repository does not publish a
                      candidate for {{ vscode_package_name }} on this
                      architecture.

                - name: Select current Visual Studio Code repository version
                  ansible.builtin.set_fact:
                    vscode_package_candidate_version: >-
                      {{ (vscode_repository_version_rows
                      | first).split('|')[1] | trim }}

                - name: Validate current Visual Studio Code Debian version
                  ansible.builtin.command:
                    argv:
                      - dpkg
                      - --validate-version
                      - "{{ vscode_package_candidate_version }}"
                  changed_when: false
                  check_mode: false

                - name: Install exact current Visual Studio Code version
                  ansible.builtin.apt:
                    name: >-
                      {{ vscode_package_name }}={{
                      vscode_package_candidate_version }}
                    state: present
                    allow_downgrade: true
                    lock_timeout: 120
          always:
            - name: Reassert verified Microsoft signing key after package task
              ansible.builtin.copy:
                src: "{{ vscode_repository_key_tempdir.path }}/key.gpg"
                dest: "{{ vscode_repository_keyring_path }}"
                remote_src: true
                owner: root
                group: root
                mode: "0644"
              when: not ansible_check_mode

            - name: Reassert managed Visual Studio Code apt repository
              ansible.builtin.copy:
                dest: "{{ vscode_repository_sources_path }}"
                content: "{{ vscode_repository_source_content }}"
                owner: root
                group: root
                mode: "0644"
              when: not ansible_check_mode
      always:
        - name: Remove temporary Microsoft signing key directory
          ansible.builtin.file:
            path: "{{ vscode_repository_key_tempdir.path }}"
            state: absent
          changed_when: false
          check_mode: false
