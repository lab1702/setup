---
- name: Inspect managed Visual Studio Code apt repository source
  ansible.builtin.stat:
    path: "{{ vscode_repository_sources_path }}"
  register: vscode_repository_source_status

- name: Validate managed Visual Studio Code apt repository source path type
  ansible.builtin.assert:
    that:
      - >-
        not vscode_repository_source_status.stat.exists or
        vscode_repository_source_status.stat.isreg | default(false) or
        vscode_repository_source_status.stat.islnk | default(false)
    fail_msg: >-
      Refusing to quarantine {{ vscode_repository_sources_path }} because it
      is neither a regular file nor a symbolic link.

- name: Read managed Visual Studio Code apt repository source
  ansible.builtin.slurp:
    src: "{{ vscode_repository_sources_path }}"
  register: vscode_repository_source
  failed_when: false
  when:
    - vscode_repository_source_status.stat.exists
    - vscode_repository_source_status.stat.isreg | default(false)

- name: Inspect installed Microsoft repository signing key file
  ansible.builtin.stat:
    path: "{{ vscode_repository_keyring_path }}"
  register: vscode_installed_repository_key_status
  when: vscode_repository_source_status.stat.exists

- name: Read installed Microsoft repository signing key
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ vscode_repository_keyring_path }}"
  register: vscode_installed_repository_key
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - vscode_repository_source_status.stat.exists
    - vscode_installed_repository_key_status.stat.isreg | default(false)

- name: Remove unusable managed Visual Studio Code apt repository source
  vars:
    vscode_repository_source_is_usable: >-
      {{ vscode_repository_source_status.stat.isreg | default(false)
      and vscode_repository_source_status.stat.uid | default(-1) == 0
      and vscode_repository_source_status.stat.gid | default(-1) == 0
      and vscode_repository_source_status.stat.mode | default('') == '0644'
      and not vscode_repository_source.failed | default(true)
      and (vscode_repository_source.content | default('') | b64decode)
      == vscode_repository_source_content }}
    vscode_installed_public_key_records: >-
      {{ vscode_installed_repository_key.stdout_lines | default([])
      | select('match', '^pub:') | list }}
    vscode_installed_fingerprint_records: >-
      {{ vscode_installed_repository_key.stdout_lines | default([])
      | select('match', '^fpr:') | list }}
    vscode_expected_fingerprint_record: >-
      fpr:::::::::{{ vscode_repository_key_fingerprint }}:
    vscode_installed_repository_key_is_usable: >-
      {{ vscode_installed_repository_key_status.stat.isreg | default(false)
      and vscode_installed_repository_key_status.stat.uid | default(-1) == 0
      and vscode_installed_repository_key_status.stat.gid | default(-1) == 0
      and vscode_installed_repository_key_status.stat.mode
      | default('') == '0644'
      and vscode_installed_repository_key.rc | default(1) == 0
      and vscode_installed_public_key_records | length == 1
      and (vscode_installed_fingerprint_records | first | default('')) ==
      vscode_expected_fingerprint_record }}
  ansible.builtin.file:
    path: "{{ vscode_repository_sources_path }}"
    state: absent
  when:
    - vscode_repository_source_status.stat.exists
    - >-
      not vscode_repository_source_is_usable | bool or
      not vscode_installed_repository_key_is_usable | bool
