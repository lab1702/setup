---
- name: Inspect legacy Visual Studio Code apt repository source
  ansible.builtin.stat:
    path: "{{ vscode_repository_legacy_sources_path }}"
  register: vscode_repository_legacy_source_status

- name: Validate legacy Visual Studio Code repository source path type
  ansible.builtin.assert:
    that:
      - >-
        not vscode_repository_legacy_source_status.stat.exists or
        vscode_repository_legacy_source_status.stat.isreg | default(false)
    fail_msg: >-
      Refusing to edit {{ vscode_repository_legacy_sources_path }} because it
      is not a regular file.

- name: Read legacy Visual Studio Code apt repository source
  ansible.builtin.slurp:
    src: "{{ vscode_repository_legacy_sources_path }}"
  register: vscode_repository_legacy_source
  failed_when: false
  when: vscode_repository_legacy_source_status.stat.isreg | default(false)

- name: Validate legacy Visual Studio Code repository source readability
  ansible.builtin.assert:
    that:
      - >-
        not vscode_repository_legacy_source_status.stat.exists or
        (vscode_repository_legacy_source.content is defined and
        not vscode_repository_legacy_source.failed | default(true))
    fail_msg: >-
      Refusing to migrate {{ vscode_repository_legacy_sources_path }} because
      its contents could not be read safely.

- name: Determine whether the legacy Visual Studio Code source needs migration
  vars:
    vscode_repository_legacy_source_text: >-
      {{ vscode_repository_legacy_source.content | default('') | b64decode }}
    vscode_repository_legacy_matching_lines: >-
      {{ vscode_repository_legacy_source_text.splitlines()
      | select('match', vscode_repository_legacy_entry_regexp) | list }}
  ansible.builtin.set_fact:
    vscode_repository_legacy_migration_required: >-
      {{ vscode_repository_legacy_matching_lines | length > 0 }}
  changed_when: false

- name: Stop check mode when the legacy Visual Studio Code source needs repair
  ansible.builtin.fail:
    msg: >-
      {{ vscode_repository_legacy_sources_path }} contains a superseded Visual
      Studio Code repository entry that must be removed before APT can be
      checked safely. Run this playbook once without --check to migrate it
      while preserving unrelated entries.
  when:
    - ansible_check_mode
    - vscode_repository_legacy_migration_required

- name: Remove legacy Visual Studio Code repository entries
  ansible.builtin.lineinfile:
    path: "{{ vscode_repository_legacy_sources_path }}"
    regexp: "{{ vscode_repository_legacy_entry_regexp }}"
    state: absent
  when: vscode_repository_legacy_migration_required

- name: Inspect managed Visual Studio Code apt repository source
  ansible.builtin.stat:
    path: "{{ vscode_repository_sources_path }}"
  register: vscode_repository_source_status

- name: Validate managed Visual Studio Code apt repository source path type
  ansible.builtin.assert:
    that:
      - >-
        not vscode_repository_source_status.stat.exists or
        vscode_repository_source_status.stat.isreg | default(false) or
        vscode_repository_source_status.stat.islnk | default(false)
    fail_msg: >-
      Refusing to quarantine {{ vscode_repository_sources_path }} because it
      is neither a regular file nor a symbolic link.

- name: Read managed Visual Studio Code apt repository source
  ansible.builtin.slurp:
    src: "{{ vscode_repository_sources_path }}"
  register: vscode_repository_source
  failed_when: false
  when:
    - vscode_repository_source_status.stat.exists
    - vscode_repository_source_status.stat.isreg | default(false)

- name: Inspect installed Microsoft repository signing key file
  ansible.builtin.stat:
    path: "{{ vscode_repository_keyring_path }}"
  register: vscode_installed_repository_key_status

- name: Validate installed Microsoft repository signing key path type
  ansible.builtin.assert:
    that:
      - >-
        not vscode_installed_repository_key_status.stat.exists or
        vscode_installed_repository_key_status.stat.isreg | default(false) or
        vscode_installed_repository_key_status.stat.islnk | default(false)
    fail_msg: >-
      Refusing to replace {{ vscode_repository_keyring_path }} because it is
      neither a regular file nor a symbolic link.

- name: Read installed Microsoft repository signing key
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ vscode_repository_keyring_path }}"
  register: vscode_installed_repository_key
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - vscode_repository_source_status.stat.exists
    - vscode_installed_repository_key_status.stat.isreg | default(false)

- name: Determine whether the managed Visual Studio Code source needs repair
  vars:
    vscode_repository_source_is_usable: >-
      {{ vscode_repository_source_status.stat.isreg | default(false)
      and vscode_repository_source_status.stat.uid | default(-1) == 0
      and vscode_repository_source_status.stat.gid | default(-1) == 0
      and vscode_repository_source_status.stat.mode | default('') == '0644'
      and not vscode_repository_source.failed | default(true)
      and (vscode_repository_source.content | default('') | b64decode)
      == vscode_repository_source_content }}
    vscode_installed_public_key_records: >-
      {{ vscode_installed_repository_key.stdout_lines | default([])
      | select('match', '^pub:') | list }}
    vscode_installed_fingerprint_records: >-
      {{ vscode_installed_repository_key.stdout_lines | default([])
      | select('match', '^fpr:') | list }}
    vscode_expected_fingerprint_record: >-
      fpr:::::::::{{ vscode_repository_key_fingerprint }}:
    vscode_installed_repository_key_is_usable: >-
      {{ vscode_installed_repository_key_status.stat.isreg | default(false)
      and vscode_installed_repository_key_status.stat.uid | default(-1) == 0
      and vscode_installed_repository_key_status.stat.gid | default(-1) == 0
      and vscode_installed_repository_key_status.stat.mode
      | default('') == '0644'
      and vscode_installed_repository_key.rc | default(1) == 0
      and vscode_installed_public_key_records | length == 1
      and (vscode_installed_fingerprint_records | first | default('')) ==
      vscode_expected_fingerprint_record }}
  ansible.builtin.set_fact:
    vscode_repository_quarantine_required: >-
      {{ vscode_repository_source_status.stat.exists and
      (not vscode_repository_source_is_usable | bool or
      not vscode_installed_repository_key_is_usable | bool) }}
  changed_when: false

- name: Stop check mode when the Visual Studio Code repository needs repair
  ansible.builtin.fail:
    msg: >-
      {{ vscode_repository_sources_path }} must be quarantined before APT can
      be checked safely. Run this playbook once without --check to repair the
      managed Visual Studio Code repository.
  when:
    - ansible_check_mode
    - vscode_repository_quarantine_required

- name: Remove unusable managed Visual Studio Code apt repository source
  ansible.builtin.file:
    path: "{{ vscode_repository_sources_path }}"
    state: absent
  when: vscode_repository_quarantine_required
