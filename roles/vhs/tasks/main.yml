---
- name: Validate VHS architecture support
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in linux_release_architecture_map
    fail_msg: >-
      VHS supports AMD64 and ARM64. Detected
      {{ ansible_facts["architecture"] }}.

# Fetching, selecting, and validating the release asset is shared with the
# binary installers through the github_release role, so API and digest
# hardening lives in one place.
- name: Resolve latest VHS package asset
  ansible.builtin.include_role:
    name: github_release
    tasks_from: resolve_asset.yml
  vars:
    github_release_display_name: VHS
    github_release_repository: "{{ vhs_repository }}"
    github_release_asset_filename: "{{ vhs_package_filename }}"

# A rate-limited GitHub API is a transient condition; the shared fallback
# keeps an installed package and fails only when nothing is installed yet.
- name: Inspect installed VHS package while metadata is unavailable
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - '--showformat=${db:Status-Status}\n'
      - "{{ vhs_package_name }}:{{ workstation_architecture }}"
  environment:
    LC_ALL: C
  register: vhs_installed_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when: not github_release_api_available

- name: Handle unavailable VHS release metadata
  ansible.builtin.include_role:
    name: github_release
    tasks_from: unavailable_fallback.yml
  vars:
    github_release_display_name: VHS
    github_release_repository: "{{ vhs_repository }}"
    github_release_installed: >-
      {{ vhs_installed_probe.rc == 0 and
      vhs_installed_probe.stdout_lines | last | default('')
      == 'installed' }}
  when: not github_release_api_available

- name: Ensure latest VHS release
  ansible.builtin.include_role:
    name: deb_package
    tasks_from: ensure.yml
  vars:
    deb_package_display_name: VHS
    deb_package_name: "{{ vhs_package_name }}"
    deb_package_architecture: "{{ workstation_architecture }}"
    deb_package_version: "{{ vhs_release_version }}"
    deb_package_url: "{{ github_release_asset.browser_download_url }}"
    deb_package_checksum: "{{ github_release_asset.digest }}"
    deb_package_filename: "{{ github_release_asset.name }}"
  when: github_release_api_available
