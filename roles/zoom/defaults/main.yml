---
zoom_repository_key_version: 6-7-5

zoom_repository:
  display_name: Zoom Workplace
  package_names:
    - zoom
  url: https://repo.zoom.us/repo/deb
  suites: release
  components: main
  architectures:
    - amd64
  sources_path: /etc/apt/sources.list.d/zoom.sources
  keyring_path: /usr/share/keyrings/zoom-archive-keyring.asc
  key_fingerprint: 84C365D6CC9A4886CA926BCC4F2197399706AC24
  key_url: >-
    https://zoom.us/linux/download/pubkey?version={{ zoom_repository_key_version }}
  # Earlier playbook revisions managed a one-line source at this path.
  legacy_sources_path: /etc/apt/sources.list.d/zoom.list
  supported_architectures:
    - amd64
