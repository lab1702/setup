---
- name: Validate Zoom Workplace platform support
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Ubuntu"
      - >-
        ansible_facts["distribution_version"]
        in zoom_supported_ubuntu_versions
      - ansible_facts["architecture"] in zoom_supported_architectures
    fail_msg: >-
      Zoom Workplace supports Ubuntu 26.04 on AMD64. Detected
      {{ ansible_facts["distribution"] }}
      {{ ansible_facts["distribution_version"] }} on
      {{ ansible_facts["architecture"] }}.

- name: Preflight Zoom apt repository
  ansible.builtin.import_tasks: repository_preflight.yml

- name: Install Zoom repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gpg
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: zoom_repository_prerequisite_installation

- name: Configure signed Zoom repository and install Zoom Workplace
  when: >-
    not ansible_check_mode or
    not zoom_repository_prerequisite_installation.changed
  block:
    - name: Create temporary directory for Zoom signing key
      ansible.builtin.tempfile:
        state: directory
        suffix: .zoom
      register: zoom_repository_key_tempdir
      changed_when: false
      check_mode: false

    - name: Download, verify, and install Zoom signing key
      block:
        - name: Download Zoom signing key
          ansible.builtin.get_url:
            url: "{{ zoom_repository_key_url }}"
            dest: "{{ zoom_repository_key_tempdir.path }}/key.asc"
            mode: "0600"
          changed_when: false
          check_mode: false

        - name: Inspect Zoom signing key
          ansible.builtin.command:
            argv:
              - gpg
              - --batch
              - --show-keys
              - --with-colons
              - "{{ zoom_repository_key_tempdir.path }}/key.asc"
          register: zoom_repository_key
          changed_when: false
          check_mode: false

        - name: Verify Zoom signing key fingerprint
          vars:
            zoom_repository_public_key_records: >-
              {{ zoom_repository_key.stdout_lines
              | select('match', '^pub:') | list }}
            zoom_repository_fingerprint_records: >-
              {{ zoom_repository_key.stdout_lines
              | select('match', '^fpr:') | list }}
            zoom_repository_expected_fingerprint_record: >-
              fpr:::::::::{{ zoom_repository_key_fingerprint }}:
          ansible.builtin.assert:
            that:
              - zoom_repository_public_key_records | length == 1
              - >-
                (zoom_repository_fingerprint_records
                | first | default('')) ==
                zoom_repository_expected_fingerprint_record
            fail_msg: >-
              The downloaded Zoom signing key does not contain exactly one
              primary key with fingerprint
              {{ zoom_repository_key_fingerprint }}.

        - name: Install verified Zoom signing key
          ansible.builtin.copy:
            src: "{{ zoom_repository_key_tempdir.path }}/key.asc"
            dest: "{{ zoom_repository_keyring_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          register: zoom_repository_keyring_installation

        - name: Retain verified Zoom key for isolated metadata checks
          ansible.builtin.slurp:
            src: "{{ zoom_repository_key_tempdir.path }}/key.asc"
          register: zoom_verified_repository_key
          changed_when: false
          check_mode: false
      always:
        - name: Remove temporary Zoom signing key directory
          ansible.builtin.file:
            path: "{{ zoom_repository_key_tempdir.path }}"
            state: absent
          changed_when: false
          check_mode: false

    - name: Add Zoom apt repository
      ansible.builtin.apt_repository:
        repo: "{{ zoom_repository_definition }}"
        filename: "{{ zoom_repository_filename }}"
        mode: "0644"
        state: present
        update_cache: "{{ not ansible_check_mode }}"
      register: zoom_repository_configuration

    - name: Resolve and install the exact Zoom repository version
      block:
        - name: Refresh Zoom repository package metadata
          ansible.builtin.apt:
            update_cache: true
            cache_valid_time: 0
            lock_timeout: 120
          changed_when: false
          when: not ansible_check_mode

        - name: Refresh isolated Zoom metadata in check mode
          ansible.builtin.include_tasks: check_mode_repository_metadata.yml
          vars:
            repository_check_key_content: >-
              {{ zoom_verified_repository_key.content | b64decode }}
            repository_check_keyring_filename: repository-keyring.asc
            repository_check_source_content: >-
              {{ zoom_repository_source_content }}
            repository_check_system_keyring_path: >-
              {{ zoom_repository_keyring_path }}
            repository_check_source_filename: repository.list
            repository_check_package_names:
              - "{{ zoom_package_name }}"
          when: ansible_check_mode

        - name: Discover published Zoom repository versions
          ansible.builtin.command:
            argv:
              - apt-cache
              - madison
              - "{{ zoom_package_name }}"
          environment:
            LC_ALL: C
          register: zoom_repository_versions
          changed_when: false
          check_mode: false
          when: not ansible_check_mode

        - name: Select isolated Zoom output in check mode
          ansible.builtin.set_fact:
            zoom_repository_version_lines: >-
              {{ (zoom_repository_check_package_versions.results
              | first).stdout_lines }}
          when: ansible_check_mode

        - name: Select complete Zoom output in normal mode
          ansible.builtin.set_fact:
            zoom_repository_version_lines: >-
              {{ zoom_repository_versions.stdout_lines }}
          when: not ansible_check_mode

        - name: Select versions from the Zoom repository
          vars:
            zoom_repository_version_pattern: >-
              {{ '^\s*'
              ~ (zoom_package_name | ansible.builtin.regex_escape)
              ~ '\s*\|\s*\S+\s*\|\s*'
              ~ (zoom_repository_url | regex_replace('/+$', '')
              | ansible.builtin.regex_escape)
              ~ '/?(?:\s|$)' }}
          ansible.builtin.set_fact:
            zoom_repository_version_rows: >-
              {{ zoom_repository_version_lines
              | select('match', zoom_repository_version_pattern) | list }}

        - name: Validate available Zoom repository versions
          ansible.builtin.assert:
            that:
              - zoom_repository_version_rows | length > 0
            fail_msg: >-
              The verified Zoom repository does not publish a candidate for
              {{ zoom_package_name }} on this architecture.

        - name: Select current Zoom repository version
          ansible.builtin.set_fact:
            zoom_package_candidate_version: >-
              {{ (zoom_repository_version_rows | first).split('|')[1]
              | trim }}

        - name: Validate current Zoom Debian version
          ansible.builtin.command:
            argv:
              - dpkg
              - --validate-version
              - "{{ zoom_package_candidate_version }}"
          changed_when: false
          check_mode: false

        - name: Select every source instance of the Zoom version
          vars:
            zoom_candidate_version_pattern: >-
              {{ '^\s*'
              ~ (zoom_package_name | ansible.builtin.regex_escape)
              ~ '\s*\|\s*'
              ~ (zoom_package_candidate_version
              | ansible.builtin.regex_escape)
              ~ '\s*\|' }}
          ansible.builtin.set_fact:
            zoom_candidate_version_rows: >-
              {{ zoom_repository_version_lines
              | select('match', zoom_candidate_version_pattern) | list }}
          when: not ansible_check_mode

        - name: Reject ambiguous Zoom package origins
          ansible.builtin.assert:
            that:
              - zoom_candidate_version_rows | length > 0
              - >-
                zoom_candidate_version_rows
                | difference(zoom_repository_version_rows)
                | length == 0
            fail_msg: >-
              Refusing to install {{ zoom_package_name }}={{
              zoom_package_candidate_version }} because the same version is
              available from a non-Zoom repository.
          when: not ansible_check_mode

        - name: Inspect installed Zoom package version
          ansible.builtin.command:
            argv:
              - dpkg-query
              - --show
              - --showformat=${Version}\t${db:Status-Status}\n
              - "{{ zoom_package_name }}"
          register: zoom_installed_package
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Determine whether Zoom needs installation
          ansible.builtin.set_fact:
            zoom_package_installation_required: >-
              {{ zoom_installed_package.rc != 0 or
              (zoom_package_candidate_version ~ '\tinstalled') not in
              zoom_installed_package.stdout_lines }}

        - name: Report pending Zoom package installation
          ansible.builtin.debug:
            msg: >-
              Zoom {{ zoom_package_candidate_version }} would be installed
              from the verified Zoom repository.
          changed_when: zoom_package_installation_required
          when: ansible_check_mode

        - name: Install exact current Zoom repository version
          ansible.builtin.apt:
            name: >-
              {{ zoom_package_name }}={{ zoom_package_candidate_version }}
            state: present
            allow_downgrade: true
            lock_timeout: 120
          when: not ansible_check_mode
