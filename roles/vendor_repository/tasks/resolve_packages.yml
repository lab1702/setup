---
# Resolves the repository's current candidate versions and decides
# whether package work is needed. Runs inside the configure block of
# main.yml (it consumes its vars) and may run a second time after a
# metadata refresh, so every fact it sets is recomputed from scratch.
- name: Discover published package versions
  ansible.builtin.command:
    argv:
      - apt-cache
      - madison
      - "{{ item }}"
  environment:
    LC_ALL: C
  loop: "{{ vendor_repository_package_names }}"
  register: vendor_repository_package_versions
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Select package version output
  ansible.builtin.set_fact:
    vendor_repository_package_version_results: >-
      {{ repository_check_package_versions.results
      if ansible_check_mode
      else vendor_repository_package_versions.results }}
    vendor_repository_candidate_versions: {}
    vendor_repository_installation_required: false

- name: Select current package versions from the repository
  vars:
    vendor_repository_version_rows: >-
      {{ item.stdout_lines
      | select('match', '^\s*'
      ~ (item.item | ansible.builtin.regex_escape)
      ~ vendor_repository_origin_pattern_suffix) | list }}
    vendor_repository_candidate_row: >-
      {{ vendor_repository_version_rows | first | default('') }}
  ansible.builtin.set_fact:
    vendor_repository_candidate_versions: >-
      {{ vendor_repository_candidate_versions
      | combine({item.item:
      (vendor_repository_candidate_row.split('|') + ['', ''])[1]
      | trim}) }}
  loop: "{{ vendor_repository_package_version_results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Validate available package versions
  ansible.builtin.assert:
    that:
      - vendor_repository_candidate_versions[item] | length > 0
    fail_msg: >-
      The verified {{ vendor_repository_display_name }} repository
      does not publish a candidate for {{ item }} on this
      architecture.
  loop: "{{ vendor_repository_package_names }}"

- name: Validate current Debian versions
  ansible.builtin.command:
    argv:
      - dpkg
      - --validate-version
      - "{{ vendor_repository_candidate_versions[item] }}"
  loop: "{{ vendor_repository_package_names }}"
  loop_control:
    label: >-
      {{ item }}={{ vendor_repository_candidate_versions[item]
      | default('') }}
  changed_when: false
  check_mode: false

- name: Reject ambiguous package origins
  vars:
    vendor_repository_candidate_version_rows: >-
      {{ item.stdout_lines
      | select('match', '^\s*'
      ~ (item.item | ansible.builtin.regex_escape)
      ~ '\s*\|\s*'
      ~ (vendor_repository_candidate_versions[item.item]
      | ansible.builtin.regex_escape)
      ~ '\s*\|') | list }}
    vendor_repository_origin_version_rows: >-
      {{ item.stdout_lines
      | select('match', '^\s*'
      ~ (item.item | ansible.builtin.regex_escape)
      ~ vendor_repository_origin_pattern_suffix) | list }}
  ansible.builtin.assert:
    that:
      - vendor_repository_candidate_version_rows | length > 0
      - >-
        vendor_repository_candidate_version_rows
        | difference(vendor_repository_origin_version_rows)
        | length == 0
    fail_msg: >-
      Refusing to install {{ item.item }}={{
      vendor_repository_candidate_versions[item.item] }} because
      the same version is available from a repository other than
      {{ vendor_repository_display_name }}. Remove the competing
      apt source providing {{ vendor_repository_candidate_version_rows
      | difference(vendor_repository_origin_version_rows)
      | join('; ') }} and rerun the playbook.
  loop: "{{ vendor_repository_package_version_results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Inspect installed package versions
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${Version}\t${db:Status-Status}\n
      - "{{ item }}"
  loop: "{{ vendor_repository_package_names }}"
  register: vendor_repository_installed_packages
  changed_when: false
  failed_when: false
  check_mode: false

- name: Determine whether packages need installation
  vars:
    vendor_repository_expected_installed_state: >-
      {{ vendor_repository_candidate_versions[item.item]
      ~ '\tinstalled' }}
  ansible.builtin.set_fact:
    vendor_repository_installation_required: >-
      {{ vendor_repository_installation_required | bool or
      item.rc != 0 or
      vendor_repository_expected_installed_state
      not in item.stdout_lines }}
  loop: "{{ vendor_repository_installed_packages.results }}"
  loop_control:
    label: "{{ item.item }}"
