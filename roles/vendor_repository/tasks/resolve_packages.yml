---
# Resolves the repository's current candidate versions and decides
# whether package work is needed. Runs inside the configure block of
# main.yml (it consumes its vars) and may run a second time after a
# metadata refresh, so every fact it sets is recomputed from scratch.
# The madison and dpkg-query probes batch every package into one
# invocation, with rows matched back per package by name; the dpkg
# version subcommands take exactly one version (--validate-version) or
# one pair (--compare-versions) per call, so those loop instead.
# Runs against the system lists in check mode too: unknown packages
# yield empty output with a zero exit status, and the ambiguity guard
# below always vets these rows, whatever source resolves the versions.
- name: Discover published package versions
  ansible.builtin.command:
    argv: >-
      {{ ['apt-cache', 'madison'] + vendor_repository_package_names }}
  environment:
    LC_ALL: C
  register: vendor_repository_package_versions
  changed_when: false
  check_mode: false

- name: Select package version output
  ansible.builtin.set_fact:
    vendor_repository_package_version_rows: >-
      {{ repository_check_package_versions.stdout_lines
      if vendor_repository_check_sandbox_used | default(false)
      else vendor_repository_package_versions.stdout_lines }}
    vendor_repository_candidate_versions: {}
    vendor_repository_origin_rows: {}
    vendor_repository_installed_versions: {}
    vendor_repository_installation_required: false

# The version selection reads the resolution rows (the isolated sandbox
# in check mode before the repository converges, the system lists
# otherwise), while the per-package origin rows recorded for the
# ambiguity guard below always come from the system lists: competing
# sources are only visible there, and the sandbox by construction
# contains this vendor's repository alone.
- name: Select current package versions from the repository
  vars:
    vendor_repository_version_rows: >-
      {{ vendor_repository_package_version_rows
      | select('match', '^\s*'
      ~ (item | ansible.builtin.regex_escape)
      ~ vendor_repository_origin_pattern_suffix) | list }}
    vendor_repository_candidate_row: >-
      {{ vendor_repository_version_rows | first | default('') }}
    vendor_repository_system_origin_rows: >-
      {{ vendor_repository_package_versions.stdout_lines
      | select('match', '^\s*'
      ~ (item | ansible.builtin.regex_escape)
      ~ vendor_repository_origin_pattern_suffix) | list }}
  ansible.builtin.set_fact:
    vendor_repository_candidate_versions: >-
      {{ vendor_repository_candidate_versions
      | combine({item:
      (vendor_repository_candidate_row.split('|') + ['', ''])[1]
      | trim}) }}
    vendor_repository_origin_rows: >-
      {{ vendor_repository_origin_rows
      | combine({item: vendor_repository_system_origin_rows}) }}
  loop: "{{ vendor_repository_package_names }}"

- name: Validate available package versions
  ansible.builtin.assert:
    that:
      - vendor_repository_candidate_versions[item] | length > 0
    fail_msg: >-
      The verified {{ vendor_repository_display_name }} repository
      does not publish a candidate for {{ item }} on this
      architecture.
  loop: "{{ vendor_repository_package_names }}"

- name: Validate current Debian versions
  ansible.builtin.command:
    argv:
      - dpkg
      - --validate-version
      - "{{ item }}"
  loop: >-
    {{ vendor_repository_candidate_versions.values()
    | unique | list }}
  loop_control:
    label: >-
      {{ item }} ({{ vendor_repository_candidate_versions | dict2items
      | selectattr('value', 'equalto', item)
      | map(attribute='key') | join(', ') }})
  changed_when: false
  check_mode: false

# Vets the system lists in every mode, so a dry run fails on the same
# competing source a real run would refuse. Before the repository
# converges in check mode, the sandbox supplies the candidate version
# while the system lists may not know the package at all, so only the
# foreign-origin comparison applies there; once the repository is
# converged (and always in real mode) the candidate must also be
# visible in the system lists.
- name: Reject ambiguous package origins
  vars:
    vendor_repository_candidate_version_rows: >-
      {{ vendor_repository_package_versions.stdout_lines
      | select('match', '^\s*'
      ~ (item | ansible.builtin.regex_escape)
      ~ '\s*\|\s*'
      ~ (vendor_repository_candidate_versions[item]
      | ansible.builtin.regex_escape)
      ~ '\s*\|') | list }}
    vendor_repository_origin_version_rows: >-
      {{ vendor_repository_origin_rows[item] }}
  ansible.builtin.assert:
    that:
      - >-
        vendor_repository_check_sandbox_used | default(false) or
        vendor_repository_candidate_version_rows | length > 0
      - >-
        vendor_repository_candidate_version_rows
        | difference(vendor_repository_origin_version_rows)
        | length == 0
    fail_msg: >-
      Refusing to install {{ item }}={{
      vendor_repository_candidate_versions[item] }} because
      the same version is available from a repository other than
      {{ vendor_repository_display_name }}. Remove the competing
      apt source providing {{ vendor_repository_candidate_version_rows
      | difference(vendor_repository_origin_version_rows)
      | join('; ') }} and rerun the playbook.
  loop: "{{ vendor_repository_package_names }}"

- name: Inspect installed package versions
  ansible.builtin.command:
    argv: >-
      {{ ['dpkg-query', '--show',
      '--showformat=${Package}\t${Version}\t${db:Status-Status}\n']
      + vendor_repository_package_names }}
  register: vendor_repository_installed_packages
  changed_when: false
  failed_when: false
  check_mode: false

# Rows are matched back per package with a regexp anchored on the
# trailing field separator, so a package name that prefixes another one
# (r-base beside r-base-core) cannot claim its row, and the fields are
# split on whitespace so no tab literal is needed inside a template
# (a {{ }} string literal keeps the backslash here — only bare
# when/assert expressions decode escapes). A package that is not fully
# installed records no version and needs installation regardless of how
# versions would compare.
- name: Select installed package versions
  vars:
    vendor_repository_installed_fields: >-
      {{ (vendor_repository_installed_packages.stdout_lines | default([])
      | select('match', '^' ~ (item | ansible.builtin.regex_escape) ~ '\s')
      | first | default('')).split() + ['', '', ''] }}
  ansible.builtin.set_fact:
    vendor_repository_installed_versions: >-
      {{ vendor_repository_installed_versions
      | combine({item: vendor_repository_installed_fields[1]
      if vendor_repository_installed_fields[2] == 'installed'
      else ''}) }}
  loop: "{{ vendor_repository_package_names }}"

# Debian version equality is wider than string equality (epochs and
# revision shorthands compare equal across different spellings), so the
# comparison delegates to dpkg instead of Jinja's string operators,
# matching the deb_package role.
- name: Compare installed and candidate package versions
  ansible.builtin.command:
    argv:
      - dpkg
      - --compare-versions
      - "{{ vendor_repository_installed_versions[item] }}"
      - eq
      - "{{ vendor_repository_candidate_versions[item] }}"
  register: vendor_repository_version_comparisons
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ vendor_repository_package_names }}"
  when: vendor_repository_installed_versions[item] | length > 0

# dpkg exits 1 when the versions merely differ but 2 when it cannot
# compare them at all; only a genuine difference may drive a reinstall.
- name: Validate package version comparisons
  ansible.builtin.assert:
    that:
      - item.rc in [0, 1]
    fail_msg: >-
      dpkg could not compare the installed and candidate versions of
      {{ item.item }}: {{ item.stderr | default('') }}
  loop: >-
    {{ vendor_repository_version_comparisons.results | default([])
    | selectattr('rc', 'defined') | list }}
  loop_control:
    label: "{{ item.item }}"

# A skipped comparison is a package with no installed version, and a
# non-zero exit is a package installed at a different version; either
# way the repository's candidates have to be installed.
- name: Determine whether packages need installation
  vars:
    vendor_repository_completed_comparisons: >-
      {{ vendor_repository_version_comparisons.results | default([])
      | selectattr('rc', 'defined') | list }}
  ansible.builtin.set_fact:
    vendor_repository_installation_required: >-
      {{ vendor_repository_completed_comparisons | length
      != vendor_repository_package_names | length
      or vendor_repository_completed_comparisons
      | rejectattr('rc', 'equalto', 0) | list | length > 0 }}
