---
# Inspects one signing key file with gpg and records whether it carries
# exactly one primary key whose first fingerprint matches the pinned
# specification, whether an eligible signer remains, and when it stops
# being able to sign (the signing_key_expiry filter's reading of the same
# records): an expired key is unusable, and one within the renewal window must be
# re-fetched from the vendor. The preflight (quarantine and healthy-path
# decisions) and the configure phase (fatal asserts) both consume this
# single predicate, so the verdicts can never drift apart.
#
# The caller sets vendor_repository_inspect_key_path and, when the
# inspection may be skipped, resets the verdict facts first so a previous
# vendor's verdicts cannot leak through role includes.

- name: Inspect repository signing key
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ vendor_repository_inspect_key_path }}"
  register: vendor_repository_inspected_key
  changed_when: false
  failed_when: false
  check_mode: false

# The filter returns None for an unusable key, zero for an unbounded
# signer, or a timestamp. Keep usability separate from expiration so an
# expired key still reaches the existing renewal and package fallback.
- name: Record repository signing key verdicts
  vars:
    vendor_repository_inspected_public_key_records: >-
      {{ vendor_repository_inspected_key.stdout_lines | default([])
      | select('match', '^pub:') | list }}
    vendor_repository_inspected_fingerprint_records: >-
      {{ vendor_repository_inspected_key.stdout_lines | default([])
      | select('match', '^fpr:') | list }}
    vendor_repository_inspected_signing_expiry: >-
      {{ vendor_repository_inspected_key.stdout_lines | default([])
      | signing_key_expiry }}
    vendor_repository_inspection_time: "{{ now().timestamp() | int }}"
  ansible.builtin.set_fact:
    vendor_repository_inspected_key_matches: >-
      {{ vendor_repository_inspected_key.rc == 0
      and vendor_repository_inspected_public_key_records | length == 1
      and (vendor_repository_inspected_fingerprint_records
      | first | default(''))
      == vendor_repository_expected_fingerprint_record }}
    vendor_repository_inspected_key_usable: >-
      {{ vendor_repository_inspected_signing_expiry is not none }}
    vendor_repository_inspected_key_expiry: >-
      {{ vendor_repository_inspected_signing_expiry | default(0, true) | int }}
    vendor_repository_inspected_key_expired: >-
      {{ vendor_repository_inspected_signing_expiry is not none
      and vendor_repository_inspected_signing_expiry | int > 0
      and vendor_repository_inspected_signing_expiry | int
      < vendor_repository_inspection_time | int }}
    vendor_repository_inspected_key_expiring: >-
      {{ vendor_repository_inspected_signing_expiry is not none
      and vendor_repository_inspected_signing_expiry | int > 0
      and vendor_repository_inspected_signing_expiry | int
      < vendor_repository_inspection_time | int
      + vendor_repository_key_renewal_window_seconds | int }}
  changed_when: false
