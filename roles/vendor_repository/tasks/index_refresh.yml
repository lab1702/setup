---
# Scoped apt update for this vendor's source file only. A transient
# vendor endpoint failure is retried before failing loudly, so one CDN
# blip does not abort the remaining roles. The lock timeout is shorter
# than the repository-wide 120 seconds used elsewhere because the retry
# ladder multiplies it: four 30-second waits plus the retry delays give
# a held apt lock about the same total grace as one 120-second wait.
- name: Refresh repository package metadata
  ansible.builtin.command:
    argv:
      - /usr/bin/apt-get
      - -o
      - Dir::Etc::sourcelist={{ vendor_repository_sources_path }}
      - -o
      - Dir::Etc::sourceparts=/dev/null
      - -o
      - APT::Get::List-Cleanup=0
      - -o
      - DPkg::Lock::Timeout=30
      - -o
      - APT::Update::Error-Mode=any
      - update
  environment:
    DEBIAN_FRONTEND: noninteractive
    LC_ALL: C
  changed_when: false
  # No until: the default retry gate is already the command's own exit
  # status, and APT::Update::Error-Mode=any makes any failed index a
  # non-zero exit.
  retries: "{{ remote_fetch_retries }}"
  delay: "{{ remote_fetch_retry_delay }}"

- name: Record refreshed repository metadata
  ansible.builtin.set_fact:
    vendor_repository_index_refreshed: true
