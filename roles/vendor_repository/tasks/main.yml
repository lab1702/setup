---
- name: Validate repository specification for {{ vendor_repository_display_name }}
  ansible.builtin.assert:
    that:
      - vendor_repository_package_names | length > 0
      - vendor_repository_key_fingerprint is match('^[0-9A-F]{40}$')
      - (vendor_repository_key_url | length > 0) != (vendor_repository_key_file | length > 0)
      - vendor_repository_sources_path.endswith('.sources')
    fail_msg: >-
      The {{ vendor_repository_display_name }} repository specification needs
      package names, a 40-hex-digit key fingerprint, exactly one of key_url or
      key_file, and a deb822 .sources path.

- name: Validate platform support for {{ vendor_repository_display_name }}
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Ubuntu"
      - >-
        ansible_facts["distribution_version"]
        in vendor_repository_supported_ubuntu_versions
      - ansible_facts["architecture"] in vendor_repository_supported_architectures
    fail_msg: >-
      {{ vendor_repository_display_name }} supports Ubuntu
      {{ vendor_repository_supported_ubuntu_versions | join(', ') }} on
      {{ vendor_repository_supported_architectures | join(', ') }}. Detected
      {{ ansible_facts["distribution"] }}
      {{ ansible_facts["distribution_version"] }} on
      {{ ansible_facts["architecture"] }}.

- name: Preflight apt repository for {{ vendor_repository_display_name }}
  ansible.builtin.include_tasks: preflight.yml
  when: >-
    vendor_repository_sources_path
    not in (vendor_repository_preflighted_paths | default([]))

- name: Create repository keyring directory
  ansible.builtin.file:
    path: "{{ vendor_repository_keyring_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: vendor_repository_keyring_directory_creation

- name: Determine whether the signing key can be verified
  ansible.builtin.include_tasks: gpg_probe.yml

# In check mode the keyring directory was not really created and gpg was
# not really installed by the base packages, so the configure block below
# cannot run in either case; report what a real run would do so the dry
# run does not silently under-report the repository and packages.
- name: Report pending repository configuration in check mode
  ansible.builtin.debug:
    msg: >-
      The verified {{ vendor_repository_display_name }} signing key, the apt
      repository at {{ vendor_repository_sources_path }}, and the packages
      {{ vendor_repository_package_names | join(', ') }} would be configured
      and installed.
  changed_when: true
  when:
    - ansible_check_mode
    - >-
      vendor_repository_keyring_directory_creation.changed or
      not vendor_repository_gpg_available

- name: Configure signed repository and install packages
  when:
    - >-
      not ansible_check_mode or
      not vendor_repository_keyring_directory_creation.changed
    - not ansible_check_mode or vendor_repository_gpg_available
  block:
    - name: Create temporary directory for repository signing key
      ansible.builtin.tempfile:
        state: directory
        suffix: .vendor-repository
      register: vendor_repository_key_tempdir
      changed_when: false
      check_mode: false

    - name: Verify signing key, configure repository, and install packages
      vars:
        vendor_repository_candidate_key_path: >-
          {{ vendor_repository_key_tempdir.path }}/candidate-key
        vendor_repository_verified_key_path: >-
          {{ vendor_repository_key_tempdir.path }}/key{{
          vendor_repository_keyring_extension }}
        # When this run's preflight already proved the installed keyring and
        # source file are intact, verify the installed key locally instead of
        # fetching the key from the vendor again.
        vendor_repository_key_is_preverified: >-
          {{ vendor_repository_sources_path
          in (vendor_repository_healthy_paths | default([])) }}
      block:
        # The retries cover transient connection errors and server-side
        # failures, matching the repository metadata refresh below.
        - name: Download repository signing key
          ansible.builtin.get_url:
            url: "{{ vendor_repository_key_url }}"
            dest: "{{ vendor_repository_candidate_key_path }}"
            mode: "0600"
          changed_when: false
          check_mode: false
          retries: 3
          delay: 10
          when:
            - vendor_repository_key_url | length > 0
            - not vendor_repository_key_is_preverified

        - name: Stage pinned repository signing key
          ansible.builtin.copy:
            src: "{{ vendor_repository_key_file }}"
            dest: "{{ vendor_repository_candidate_key_path }}"
            remote_src: true
            mode: "0600"
          changed_when: false
          check_mode: false
          when:
            - vendor_repository_key_file | length > 0
            - not vendor_repository_key_is_preverified

        # The candidate still passes the full fingerprint verification below,
        # so a keyring tampered with since the preflight fails loudly rather
        # than being trusted.
        - name: Stage preverified installed signing key
          ansible.builtin.copy:
            src: "{{ vendor_repository_keyring_path }}"
            dest: "{{ vendor_repository_candidate_key_path }}"
            remote_src: true
            mode: "0600"
          changed_when: false
          check_mode: false
          when: vendor_repository_key_is_preverified

        - name: Inspect repository signing key
          ansible.builtin.command:
            argv:
              - gpg
              - --batch
              - --show-keys
              - --with-colons
              - "{{ vendor_repository_candidate_key_path }}"
          register: vendor_repository_key
          changed_when: false
          check_mode: false

        - name: Verify repository signing key fingerprint
          vars:
            vendor_repository_public_key_records: >-
              {{ vendor_repository_key.stdout_lines
              | select('match', '^pub:') | list }}
            vendor_repository_fingerprint_records: >-
              {{ vendor_repository_key.stdout_lines
              | select('match', '^fpr:') | list }}
          ansible.builtin.assert:
            that:
              - vendor_repository_public_key_records | length == 1
              - >-
                (vendor_repository_fingerprint_records | first | default(''))
                == vendor_repository_expected_fingerprint_record
            fail_msg: >-
              The {{ vendor_repository_display_name }} signing key does not
              contain exactly one primary key with fingerprint
              {{ vendor_repository_key_fingerprint }}.

        - name: Convert verified signing key to binary keyring
          ansible.builtin.command:
            argv:
              - gpg
              - --batch
              - --yes
              - --dearmor
              - --output
              - "{{ vendor_repository_verified_key_path }}"
              - "{{ vendor_repository_candidate_key_path }}"
          changed_when: false
          check_mode: false
          when:
            - vendor_repository_key_url | length > 0
            - vendor_repository_keyring_extension == '.gpg'
            - not vendor_repository_key_is_preverified

        # A preverified candidate came from the installed keyring and is
        # already in its final format, so it never needs dearmoring.
        - name: Retain verified signing key in its published format
          ansible.builtin.copy:
            src: "{{ vendor_repository_candidate_key_path }}"
            dest: "{{ vendor_repository_verified_key_path }}"
            remote_src: true
            mode: "0600"
          changed_when: false
          check_mode: false
          when: >-
            vendor_repository_key_is_preverified or
            vendor_repository_key_file | length > 0 or
            vendor_repository_keyring_extension != '.gpg'

        - name: Install verified repository signing key
          ansible.builtin.copy:
            src: "{{ vendor_repository_verified_key_path }}"
            dest: "{{ vendor_repository_keyring_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          register: vendor_repository_keyring_installation

        - name: Configure apt repository
          ansible.builtin.copy:
            dest: "{{ vendor_repository_sources_path }}"
            content: "{{ vendor_repository_source_content }}"
            owner: root
            group: root
            mode: "0644"
          register: vendor_repository_sources_configuration

        - name: Remove superseded repository signing key
          when:
            - vendor_repository_legacy_keyring_path | length > 0
            - vendor_repository_legacy_keyring_path != vendor_repository_keyring_path
          block:
            - name: Inspect superseded repository signing key path
              ansible.builtin.stat:
                path: "{{ vendor_repository_legacy_keyring_path }}"
                follow: false
              register: vendor_repository_legacy_keyring_status

            - name: Validate superseded repository signing key path type
              ansible.builtin.assert:
                that:
                  - >-
                    not vendor_repository_legacy_keyring_status.stat.exists or
                    vendor_repository_legacy_keyring_status.stat.isreg
                    | default(false) or
                    vendor_repository_legacy_keyring_status.stat.islnk
                    | default(false)
                fail_msg: >-
                  Refusing to remove {{ vendor_repository_legacy_keyring_path }}
                  because it is neither a regular file nor a symbolic link.

            - name: Remove superseded repository signing key file
              ansible.builtin.file:
                path: "{{ vendor_repository_legacy_keyring_path }}"
                state: absent

        - name: Install packages while preserving the verified repository
          block:
            # Pessimistic default (facts persist across role includes) so a
            # failure before the dpkg comparison below still reasserts the
            # key and source file in the always block; the comparison
            # refines this once the installed state is known.
            - name: Assume package work until the installed state is known
              ansible.builtin.set_fact:
                vendor_repository_installation_required: true
            # The play-level cache refresh can predate this repository's
            # source file, and its lists can be cleared out of band while
            # the source file survives byte-identical — but both cases
            # are locally detectable: the copies above register a change
            # when the keyring or source drifted, and cleared lists leave
            # the repository's expected index files missing. The two
            # tasks below detect those signals so a converged repository
            # costs no network round trip; whenever apt cannot even
            # enumerate the expected index files, the refresh runs as
            # the safe fallback.
            - name: Discover expected repository index files
              ansible.builtin.command:
                argv:
                  - /usr/bin/apt-get
                  - indextargets
                  - --format
                  - $(FILENAME)
                  - -o
                  - Dir::Etc::sourcelist={{ vendor_repository_sources_path }}
                  - -o
                  - Dir::Etc::sourceparts=/dev/null
              environment:
                LC_ALL: C
              register: vendor_repository_index_targets
              changed_when: false
              failed_when: false
              check_mode: false
              when: not ansible_check_mode

            - name: Inspect expected repository index files
              ansible.builtin.stat:
                path: "{{ item }}"
                follow: false
              loop: >-
                {{ vendor_repository_index_targets.stdout_lines
                | default([]) | unique | list
                if vendor_repository_index_targets.rc | default(1) == 0
                else [] }}
              register: vendor_repository_index_statuses
              when: not ansible_check_mode

            # A transient vendor endpoint failure is retried before
            # failing loudly, so one CDN blip does not abort the
            # remaining roles. The lock timeout is shorter than the
            # repository-wide 120 seconds used elsewhere because the
            # retry ladder multiplies it: four 30-second waits plus the
            # retry delays give a held apt lock about the same total
            # grace as one 120-second wait.
            - name: Refresh repository package metadata
              ansible.builtin.command:
                argv:
                  - /usr/bin/apt-get
                  - -o
                  - Dir::Etc::sourcelist={{ vendor_repository_sources_path }}
                  - -o
                  - Dir::Etc::sourceparts=/dev/null
                  - -o
                  - APT::Get::List-Cleanup=0
                  - -o
                  - DPkg::Lock::Timeout=30
                  - -o
                  - APT::Update::Error-Mode=any
                  - update
              environment:
                DEBIAN_FRONTEND: noninteractive
                LC_ALL: C
              register: vendor_repository_metadata_refresh
              changed_when: false
              retries: 3
              delay: 10
              until: vendor_repository_metadata_refresh.rc == 0
              when:
                - not ansible_check_mode
                - >-
                  vendor_repository_keyring_installation is changed or
                  vendor_repository_sources_configuration is changed or
                  vendor_repository_index_targets.rc | default(1) != 0 or
                  vendor_repository_index_targets.stdout_lines
                  | default([]) | length == 0 or
                  vendor_repository_index_statuses.results | default([])
                  | rejectattr('stat.exists') | list | length > 0

            - name: Refresh isolated repository metadata in check mode
              ansible.builtin.include_role:
                name: repository_check
              vars:
                repository_check_key_source: >-
                  {{ vendor_repository_verified_key_path }}
                repository_check_key_remote_src: true
                repository_check_keyring_filename: >-
                  repository-keyring{{ vendor_repository_keyring_extension }}
                repository_check_source_content: >-
                  {{ vendor_repository_source_content }}
                repository_check_system_keyring_path: >-
                  {{ vendor_repository_keyring_path }}
                repository_check_source_filename: repository.sources
                repository_check_package_names: >-
                  {{ vendor_repository_package_names }}
              when: ansible_check_mode

            - name: Discover published package versions
              ansible.builtin.command:
                argv:
                  - apt-cache
                  - madison
                  - "{{ item }}"
              environment:
                LC_ALL: C
              loop: "{{ vendor_repository_package_names }}"
              register: vendor_repository_package_versions
              changed_when: false
              check_mode: false
              when: not ansible_check_mode

            - name: Select package version output
              ansible.builtin.set_fact:
                vendor_repository_package_version_results: >-
                  {{ repository_check_package_versions.results
                  if ansible_check_mode
                  else vendor_repository_package_versions.results }}
                vendor_repository_candidate_versions: {}
                vendor_repository_installation_required: false

            - name: Select current package versions from the repository
              vars:
                vendor_repository_version_rows: >-
                  {{ item.stdout_lines
                  | select('match', '^\s*'
                  ~ (item.item | ansible.builtin.regex_escape)
                  ~ vendor_repository_origin_pattern_suffix) | list }}
                vendor_repository_candidate_row: >-
                  {{ vendor_repository_version_rows | first | default('') }}
              ansible.builtin.set_fact:
                vendor_repository_candidate_versions: >-
                  {{ vendor_repository_candidate_versions
                  | combine({item.item:
                  (vendor_repository_candidate_row.split('|') + ['', ''])[1]
                  | trim}) }}
              loop: "{{ vendor_repository_package_version_results }}"
              loop_control:
                label: "{{ item.item }}"

            - name: Validate available package versions
              ansible.builtin.assert:
                that:
                  - vendor_repository_candidate_versions[item] | length > 0
                fail_msg: >-
                  The verified {{ vendor_repository_display_name }} repository
                  does not publish a candidate for {{ item }} on this
                  architecture.
              loop: "{{ vendor_repository_package_names }}"

            - name: Validate current Debian versions
              ansible.builtin.command:
                argv:
                  - dpkg
                  - --validate-version
                  - "{{ vendor_repository_candidate_versions[item] }}"
              loop: "{{ vendor_repository_package_names }}"
              loop_control:
                label: >-
                  {{ item }}={{ vendor_repository_candidate_versions[item]
                  | default('') }}
              changed_when: false
              check_mode: false

            - name: Reject ambiguous package origins
              vars:
                vendor_repository_candidate_version_rows: >-
                  {{ item.stdout_lines
                  | select('match', '^\s*'
                  ~ (item.item | ansible.builtin.regex_escape)
                  ~ '\s*\|\s*'
                  ~ (vendor_repository_candidate_versions[item.item]
                  | ansible.builtin.regex_escape)
                  ~ '\s*\|') | list }}
                vendor_repository_origin_version_rows: >-
                  {{ item.stdout_lines
                  | select('match', '^\s*'
                  ~ (item.item | ansible.builtin.regex_escape)
                  ~ vendor_repository_origin_pattern_suffix) | list }}
              ansible.builtin.assert:
                that:
                  - vendor_repository_candidate_version_rows | length > 0
                  - >-
                    vendor_repository_candidate_version_rows
                    | difference(vendor_repository_origin_version_rows)
                    | length == 0
                fail_msg: >-
                  Refusing to install {{ item.item }}={{
                  vendor_repository_candidate_versions[item.item] }} because
                  the same version is available from a repository other than
                  {{ vendor_repository_display_name }}. Remove the competing
                  apt source providing {{ vendor_repository_candidate_version_rows
                  | difference(vendor_repository_origin_version_rows)
                  | join('; ') }} and rerun the playbook.
              loop: "{{ vendor_repository_package_version_results }}"
              loop_control:
                label: "{{ item.item }}"
              when: not ansible_check_mode

            - name: Inspect installed package versions
              ansible.builtin.command:
                argv:
                  - dpkg-query
                  - --show
                  - --showformat=${Version}\t${db:Status-Status}\n
                  - "{{ item }}"
              loop: "{{ vendor_repository_package_names }}"
              register: vendor_repository_installed_packages
              changed_when: false
              failed_when: false
              check_mode: false

            - name: Determine whether packages need installation
              vars:
                vendor_repository_expected_installed_state: >-
                  {{ vendor_repository_candidate_versions[item.item]
                  ~ '\tinstalled' }}
              ansible.builtin.set_fact:
                vendor_repository_installation_required: >-
                  {{ vendor_repository_installation_required | bool or
                  item.rc != 0 or
                  vendor_repository_expected_installed_state
                  not in item.stdout_lines }}
              loop: "{{ vendor_repository_installed_packages.results }}"
              loop_control:
                label: "{{ item.item }}"

            - name: Report pending installation of {{ vendor_repository_display_name }}
              ansible.builtin.debug:
                msg: >-
                  {{ vendor_repository_candidate_versions.items()
                  | map('join', '=') | join(', ') }} would be installed from
                  the verified {{ vendor_repository_display_name }}
                  repository.
              changed_when: true
              when:
                - ansible_check_mode
                - vendor_repository_installation_required

            - name: Install exact current package versions
              ansible.builtin.apt:
                name: >-
                  {{ vendor_repository_candidate_versions.items()
                  | map('join', '=') | list }}
                state: present
                allow_downgrade: true
                install_recommends: "{{ vendor_repository_install_recommends }}"
                lock_timeout: 120
              when:
                - not ansible_check_mode
                - vendor_repository_installation_required
          always:
            # The reasserts only undo a package postinst rewrite, which
            # cannot have happened when no package work ran. The fact is
            # always defined here: the pessimistic set_fact at the top of
            # this block runs first, and that set_fact is what keeps a
            # previous vendor's stale value from leaking in — do not
            # remove it.
            - name: Reassert verified repository signing key after package task
              ansible.builtin.copy:
                src: "{{ vendor_repository_verified_key_path }}"
                dest: "{{ vendor_repository_keyring_path }}"
                remote_src: true
                owner: root
                group: root
                mode: "0644"
              when:
                - not ansible_check_mode
                - vendor_repository_installation_required

            - name: Reassert managed apt repository after package task
              ansible.builtin.copy:
                dest: "{{ vendor_repository_sources_path }}"
                content: "{{ vendor_repository_source_content }}"
                owner: root
                group: root
                mode: "0644"
              when:
                - not ansible_check_mode
                - vendor_repository_installation_required
      always:
        - name: Remove temporary repository signing key directory
          ansible.builtin.file:
            path: "{{ vendor_repository_key_tempdir.path }}"
            state: absent
          changed_when: false
          check_mode: false
