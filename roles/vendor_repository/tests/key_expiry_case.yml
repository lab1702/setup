---
# One key expiry case: generates a fresh key with the requested primary
# usage and expiry, adds the requested signing subkeys (revoking those
# marked for it through gpg's scripted key editor), exports it, runs the
# shared predicate on it, and validates the verdicts. The scaffolding runs
# for real even under --check.
- name: Reset key home for {{ vendor_repository_test_case.name }}
  ansible.builtin.file:
    path: "{{ vendor_repository_test_key_home }}"
    state: "{{ item }}"
    mode: "0700"
  loop:
    - absent
    - directory
  changed_when: false
  check_mode: false

- name: Generate signing key for {{ vendor_repository_test_case.name }}
  ansible.builtin.command:
    argv: >-
      {{ ['gpg', '--batch', '--pinentry-mode', 'loopback',
      '--passphrase', '']
      + (['--faked-system-time', vendor_repository_test_case.faked_system_time]
      if vendor_repository_test_case.faked_system_time is defined else [])
      + ['--quick-generate-key', 'Key expiry test', 'default',
      vendor_repository_test_case.usage | default('default'),
      vendor_repository_test_case.expiry] }}
  environment:
    GNUPGHOME: "{{ vendor_repository_test_key_home }}"
  changed_when: false
  check_mode: false

- name: List signing key for {{ vendor_repository_test_case.name }}
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --with-colons
      - --list-keys
  environment:
    GNUPGHOME: "{{ vendor_repository_test_key_home }}"
  register: vendor_repository_test_listed_key
  changed_when: false
  check_mode: false

- name: Record fingerprint for {{ vendor_repository_test_case.name }}
  ansible.builtin.set_fact:
    vendor_repository_test_fingerprint: >-
      {{ (vendor_repository_test_listed_key.stdout_lines
      | select('match', '^fpr:') | first).split(':')[9] }}
  changed_when: false

- name: Add signing subkeys for {{ vendor_repository_test_case.name }}
  ansible.builtin.command:
    argv: >-
      {{ ['gpg', '--batch', '--pinentry-mode', 'loopback',
      '--passphrase', '']
      + (['--faked-system-time', vendor_repository_test_subkey.faked_system_time]
      if vendor_repository_test_subkey.faked_system_time is defined else [])
      + ['--quick-add-key', vendor_repository_test_fingerprint, 'default',
      'sign', vendor_repository_test_subkey.expiry] }}
  environment:
    GNUPGHOME: "{{ vendor_repository_test_key_home }}"
  loop: "{{ vendor_repository_test_case.subkeys | default([]) }}"
  loop_control:
    loop_var: vendor_repository_test_subkey
    label: "{{ vendor_repository_test_subkey.expiry }}"
  changed_when: false
  check_mode: false

# Subkeys are numbered from one in the order they were added; the script
# answers the reason prompt with "no reason" and an empty description.
- name: Revoke signing subkeys for {{ vendor_repository_test_case.name }}
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --yes
      - --pinentry-mode
      - loopback
      - --passphrase
      - ""
      - --command-fd
      - "0"
      - --edit-key
      - "{{ vendor_repository_test_fingerprint }}"
    stdin: "key {{ ansible_loop.index }}\nrevkey\ny\n0\n\ny\nsave\n"
  environment:
    GNUPGHOME: "{{ vendor_repository_test_key_home }}"
  loop: "{{ vendor_repository_test_case.subkeys | default([]) }}"
  loop_control:
    loop_var: vendor_repository_test_subkey
    extended: true
    label: "{{ vendor_repository_test_subkey.expiry }}"
  changed_when: false
  check_mode: false
  when: vendor_repository_test_subkey.revoke | default(false)

- name: Revoke primary key for {{ vendor_repository_test_case.name }}
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --yes
      - --pinentry-mode
      - loopback
      - --passphrase
      - ""
      - --command-fd
      - "0"
      - --edit-key
      - "{{ vendor_repository_test_fingerprint }}"
    stdin: "revkey\ny\n0\n\ny\nsave\n"
  environment:
    GNUPGHOME: "{{ vendor_repository_test_key_home }}"
  changed_when: false
  check_mode: false
  when: vendor_repository_test_case.revoke | default(false)

- name: Export signing key for {{ vendor_repository_test_case.name }}
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --armor
      - --export
  environment:
    GNUPGHOME: "{{ vendor_repository_test_key_home }}"
  register: vendor_repository_test_exported_key
  changed_when: false
  check_mode: false

- name: Write signing key for {{ vendor_repository_test_case.name }}
  ansible.builtin.copy:
    dest: "{{ vendor_repository_test_key_path }}"
    content: "{{ vendor_repository_test_exported_key.stdout }}\n"
    mode: "0600"
  changed_when: false
  check_mode: false

- name: Inspect signing key for {{ vendor_repository_test_case.name }}
  ansible.builtin.include_role:
    name: vendor_repository
    tasks_from: inspect_key
    apply:
      environment:
        GNUPGHOME: "{{ vendor_repository_test_key_home }}"
  vars:
    vendor_repository_inspect_key_path: "{{ vendor_repository_test_key_path }}"

- name: Validate verdicts for {{ vendor_repository_test_case.name }}
  ansible.builtin.assert:
    that:
      - vendor_repository_inspected_key_matches
      - >-
        vendor_repository_inspected_key_usable ==
        vendor_repository_test_case.expected_usable | default(true)
      - >-
        vendor_repository_inspected_key_expired ==
        vendor_repository_test_case.expected_expired
      - >-
        vendor_repository_inspected_key_expiring ==
        vendor_repository_test_case.expected_expiring
      - >-
        (vendor_repository_inspected_key_expiry | int > 0) ==
        vendor_repository_test_case.expected_bounded
    fail_msg: >-
      Unexpected verdicts for {{ vendor_repository_test_case.name }}:
      matches={{ vendor_repository_inspected_key_matches }},
      usable={{ vendor_repository_inspected_key_usable }},
      expired={{ vendor_repository_inspected_key_expired }},
      expiring={{ vendor_repository_inspected_key_expiring }},
      expiry={{ vendor_repository_inspected_key_expiry }}.
