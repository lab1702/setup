---
- name: Install SoloMD from the latest verified GitHub release
  ansible.builtin.include_role:
    name: github_release
    tasks_from: deb.yml
  vars:
    github_release_display_name: SoloMD
    github_release_repository: "{{ solomd_repository }}"
    github_release_deb_package_name: "{{ solomd_package_name }}"
    github_release_asset_filename: "{{ solomd_package_filename }}"
