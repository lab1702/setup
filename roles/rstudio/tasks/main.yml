---
- name: Validate Posit RStudio Desktop platform support
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Ubuntu"
      - ansible_facts["architecture"] in rstudio_supported_architectures
    fail_msg: >-
      Posit's stable RStudio Desktop installer metadata supports Ubuntu on
      AMD64. Detected {{ ansible_facts["distribution"] }}
      {{ ansible_facts["distribution_version"] }} on
      {{ ansible_facts["architecture"] }}.

# The retries cover transient connection errors and server-side
# failures; the until stops retrying deterministic statuses (any 2xx-4xx
# other than the transient 408/429 repeats identically).
- name: Get latest stable Posit RStudio Desktop release metadata
  ansible.builtin.uri:
    url: "{{ rstudio_downloads_metadata_url }}"
    return_content: true
  register: rstudio_downloads_metadata
  changed_when: false
  check_mode: false
  retries: "{{ remote_fetch_retries }}"
  delay: "{{ remote_fetch_retry_delay }}"
  until: >-
    rstudio_downloads_metadata.status | default(-1) >= 200 and
    rstudio_downloads_metadata.status | default(-1) < 500 and
    rstudio_downloads_metadata.status | default(-1) not in [408, 429]

# A 200 whose body is not the downloads schema (CDN error page, captive
# portal, or a proxy's JSON error object) would otherwise surface as an
# opaque undefined-variable templating error in the selection below.
- name: Validate Posit RStudio Desktop metadata transport
  ansible.builtin.assert:
    that:
      - >-
        rstudio_downloads_metadata.json.rstudio.open_source.stable.desktop.installer
        is defined
    fail_msg: >-
      {{ rstudio_downloads_metadata_url }} did not return the expected
      downloads metadata structure; an intercepting proxy or a CDN error
      page may be in the way.

- name: Select Posit RStudio Desktop package metadata
  vars:
    rstudio_stable_desktop_installers: >-
      {{ rstudio_downloads_metadata.json.rstudio.open_source.stable.desktop.installer }}
  ansible.builtin.set_fact:
    rstudio_release: >-
      {{ rstudio_stable_desktop_installers[rstudio_platform] | default({}) }}

- name: Validate Posit RStudio Desktop package metadata
  ansible.builtin.assert:
    that:
      - >-
        (rstudio_release.url | default(''))
        is match('^https://download1[.]rstudio[.]org/')
      - >-
        (rstudio_release.basename | default(''))
        is match('^rstudio-[0-9A-Za-z.+_~-]+-amd64[.]deb$')
      - rstudio_release.version | default('') | length > 0
      - >-
        (rstudio_release.sha256 | default(''))
        is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Posit's download metadata did not contain a valid stable RStudio
      Desktop package URL, filename, version, and SHA-256 checksum for
      Ubuntu {{ rstudio_platform }}.

- name: Ensure latest stable Posit RStudio Desktop release
  ansible.builtin.include_role:
    name: deb_package
    tasks_from: ensure.yml
  vars:
    deb_package_display_name: Posit RStudio Desktop
    deb_package_name: "{{ rstudio_package_name }}"
    deb_package_architecture: "{{ rstudio_package_architecture }}"
    deb_package_version: "{{ rstudio_release.version }}"
    deb_package_url: "{{ rstudio_release.url }}"
    deb_package_checksum: "sha256:{{ rstudio_release.sha256 }}"
    deb_package_filename: "{{ rstudio_release.basename }}"
