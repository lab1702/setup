---
- name: Validate Posit RStudio Desktop platform support
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Ubuntu"
      - ansible_facts["distribution_version"] in rstudio_platform_map
      - ansible_facts["architecture"] in rstudio_supported_architectures
    fail_msg: >-
      Posit's stable RStudio Desktop installer metadata supports Ubuntu
      {{ rstudio_platform_map.keys() | join(', ') }} on AMD64. Detected
      {{ ansible_facts["distribution"] }}
      {{ ansible_facts["distribution_version"] }} on
      {{ ansible_facts["architecture"] }}.

- name: Get latest stable Posit RStudio Desktop release metadata
  ansible.builtin.uri:
    url: "{{ rstudio_downloads_metadata_url }}"
    return_content: true
  register: rstudio_downloads_metadata
  changed_when: false
  check_mode: false

- name: Select Posit RStudio Desktop package metadata
  vars:
    rstudio_platform: >-
      {{ rstudio_platform_map[ansible_facts["distribution_version"]] }}
    rstudio_stable_desktop_installers: >-
      {{ rstudio_downloads_metadata.json.rstudio.open_source.stable.desktop.installer }}
  ansible.builtin.set_fact:
    rstudio_release: >-
      {{ rstudio_stable_desktop_installers[rstudio_platform] | default({}) }}

- name: Validate Posit RStudio Desktop package metadata
  ansible.builtin.assert:
    that:
      - >-
        (rstudio_release.url | default(''))
        is match('^https://download1[.]rstudio[.]org/')
      - >-
        (rstudio_release.basename | default(''))
        is match('^rstudio-[0-9A-Za-z.+_~-]+-amd64[.]deb$')
      - rstudio_release.version | default('') | length > 0
      - >-
        (rstudio_release.sha256 | default(''))
        is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Posit's download metadata did not contain a valid stable RStudio
      Desktop package URL, filename, version, and SHA-256 checksum.

- name: Gather installed package facts for Posit RStudio Desktop
  ansible.builtin.package_facts:
    manager: auto

- name: Inspect Posit RStudio Desktop dpkg configuration state
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - '--showformat=${db:Status-Status}\n'
      - "{{ rstudio_package_name }}"
  environment:
    LC_ALL: C
  register: rstudio_installed_package_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Determine whether Posit RStudio Desktop installation is required
  vars:
    rstudio_installed_packages: >-
      {{ ansible_facts.packages[rstudio_package_name] | default([]) }}
    rstudio_installed_version: >-
      {{ (rstudio_installed_packages | first | default({})).version
      | default('') }}
  ansible.builtin.set_fact:
    rstudio_install_required: >-
      {{ rstudio_installed_version != rstudio_release.version or
      rstudio_installed_package_status.rc | default(1) != 0 }}
    rstudio_repair_required: >-
      {{ rstudio_installed_version == rstudio_release.version and
      rstudio_installed_package_status.rc | default(1) == 0 and
      rstudio_installed_package_status.stdout | default('') != 'installed' }}

- name: Report pending Posit RStudio Desktop package repair in check mode
  ansible.builtin.debug:
    msg: >-
      Posit RStudio Desktop {{ rstudio_release.version }} would be configured
      to repair its incomplete dpkg state.
  changed_when: true
  when:
    - ansible_check_mode
    - rstudio_repair_required

- name: Repair matching Posit RStudio Desktop package configuration
  ansible.builtin.command:
    argv:
      - dpkg
      - --force-confdef
      - --force-confold
      - --configure
      - "{{ rstudio_package_name }}"
  environment:
    DEBIAN_FRONTEND: noninteractive
    LC_ALL: C
  when:
    - rstudio_repair_required
    - not ansible_check_mode
  changed_when: true

- name: Report pending Posit RStudio Desktop installation in check mode
  ansible.builtin.debug:
    msg: >-
      Posit RStudio Desktop {{ rstudio_release.version }} would be installed.
  changed_when: true
  when:
    - ansible_check_mode
    - rstudio_install_required

- name: Install latest stable Posit RStudio Desktop release
  when:
    - rstudio_install_required
    - not ansible_check_mode
  block:
    - name: Create temporary directory for Posit RStudio Desktop package
      ansible.builtin.tempfile:
        state: directory
        suffix: .rstudio
      register: rstudio_package_tempdir
      changed_when: false

    - name: Download, verify, and install Posit RStudio Desktop package
      block:
        - name: Download Posit RStudio Desktop package
          ansible.builtin.get_url:
            url: "{{ rstudio_release.url }}"
            dest: "{{ rstudio_package_tempdir.path }}/{{ rstudio_release.basename }}"
            checksum: "sha256:{{ rstudio_release.sha256 }}"
            mode: "0600"

        - name: Inspect downloaded Posit RStudio Desktop package metadata
          ansible.builtin.command:
            argv:
              - dpkg-deb
              - --show
              - '--showformat=${Package}\t${Version}\t${Architecture}\n'
              - >-
                {{ rstudio_package_tempdir.path }}/{{ rstudio_release.basename }}
          register: rstudio_downloaded_package_metadata
          changed_when: false

        - name: Validate downloaded Posit RStudio Desktop package metadata
          vars:
            rstudio_expected_package_metadata:
              - "{{ rstudio_package_name }}"
              - "{{ rstudio_release.version }}"
              - "{{ rstudio_package_architecture }}"
          ansible.builtin.assert:
            that:
              - >-
                rstudio_downloaded_package_metadata.stdout.split() ==
                rstudio_expected_package_metadata
            fail_msg: >-
              The downloaded Posit RStudio Desktop package metadata does not
              match the expected package name, version, and architecture.

        - name: Install Posit RStudio Desktop package
          ansible.builtin.apt:
            deb: >-
              {{ rstudio_package_tempdir.path }}/{{ rstudio_release.basename }}
            state: present
            allow_downgrade: true
            lock_timeout: 120
      always:
        - name: Remove temporary Posit RStudio Desktop package directory
          ansible.builtin.file:
            path: "{{ rstudio_package_tempdir.path }}"
            state: absent
          changed_when: false
