---
# Sourced from group_vars/all.yml so platform support is defined once for
# the playbook and every role.
amd64v3_supported_ubuntu_versions: "{{ supported_ubuntu_versions }}"

amd64v3_known_architectures: >-
  {{ linux_release_architecture_map.keys() | list }}
amd64v3_candidate_architectures:
  - x86_64
  - amd64
amd64v3_system_architecture: "{{ ansible_facts['architecture'] }}"

amd64v3_cpu_probe_argv:
  - /usr/bin/ld.so
  - --help
amd64v3_cpu_probe_environment_argv:
  - /usr/bin/env
  - -i
  - LC_ALL=C
amd64v3_cpu_support_pattern: >-
  (?m)^\s*x86-64-v3 \(supported, searched\)\s*$

amd64v3_apt_variant: amd64v3
amd64v3_apt_config_path: /etc/apt/apt.conf.d/99enable-amd64v3
amd64v3_apt_config_parts_path: /etc/apt/apt.conf.d
amd64v3_apt_main_config_path: /etc/apt/apt.conf
amd64v3_apt_config_owner: root
amd64v3_apt_config_group: root
amd64v3_apt_config_mode: "0644"
amd64v3_apt_config_content: |
  APT::Architecture-Variants "{{ amd64v3_apt_variant }}";
amd64v3_apt_config_environment: {}
amd64v3_apt_config_query_argv:
  - /usr/bin/apt-config
  - dump
amd64v3_apt_fragment_filename_pattern: >-
  ^(?:[A-Za-z0-9_-]+|[A-Za-z0-9_.-]+[.]conf)$
# The possessive [ \t]*+ stops backtracking from handing whitespace to the
# comment lookahead, which would otherwise misclassify indented comments as
# competing directives; (?m) lets the pattern match any line of slurped
# multi-line configuration, not just the first.
amd64v3_apt_competing_directive_pattern: >-
  {{ '(?im)^[ \t]*+(?:#(?:include|clear)[ \t]+|'
  ~ '(?!(?:#|//|/\*|\*))[^\r\n]*Architecture-Variants)' }}
