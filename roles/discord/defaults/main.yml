---
discord_package_name: discord
discord_package_architecture: amd64

# Debian architecture names as normalized by workstation_architecture in
# group_vars/all.yml, where raw machine spellings are registered once.
discord_supported_architectures:
  - amd64

discord_download_endpoint: >-
  https://discord.com/api/download?format=deb&platform=linux
discord_release_base_url: https://stable.dl2.discordapp.net/apps/linux
discord_release_hostname: stable.dl2.discordapp.net
