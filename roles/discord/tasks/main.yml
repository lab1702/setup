---
- name: Validate Discord platform support
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in discord_supported_architectures
    fail_msg: >-
      Discord supports AMD64. Detected
      {{ ansible_facts["architecture"] }}.

- name: Discover latest stable Discord package
  ansible.builtin.uri:
    url: "{{ discord_download_endpoint }}"
    method: HEAD
    follow_redirects: none
    status_code: 302
    return_content: false
  register: discord_download_response
  changed_when: false
  check_mode: false

- name: Validate latest stable Discord package location
  vars:
    discord_release_location: >-
      {{ discord_download_response.location | default('') }}
    discord_release_path: >-
      {{ discord_release_location | ansible.builtin.urlsplit('path') }}
  ansible.builtin.assert:
    that:
      - >-
        (discord_release_location | ansible.builtin.urlsplit('scheme'))
        == 'https'
      - >-
        (discord_release_location | ansible.builtin.urlsplit('hostname'))
        == discord_release_hostname
      - >-
        (discord_release_location | ansible.builtin.urlsplit('query'))
        | length == 0
      - >-
        discord_release_path is match(
        '^/apps/linux/[^/]+/discord-[^/]+[.]deb$')
    fail_msg: >-
      Discord's stable download endpoint did not redirect to the expected
      HTTPS package location.

- name: Select latest stable Discord package
  vars:
    discord_release_location: "{{ discord_download_response.location }}"
    discord_release_path: >-
      {{ discord_release_location | ansible.builtin.urlsplit('path') }}
  ansible.builtin.set_fact:
    discord_release:
      url: "{{ discord_release_location }}"
      version: "{{ discord_release_path.split('/')[-2] }}"
      filename: "{{ discord_release_path.split('/')[-1] }}"

- name: Validate latest stable Discord package version
  ansible.builtin.assert:
    that:
      - discord_release.version | length > 0
      - >-
        discord_release.filename ==
        'discord-' ~ discord_release.version ~ '.deb'
      - >-
        discord_release.url ==
        discord_release_base_url ~ '/' ~ discord_release.version ~ '/' ~
        discord_release.filename
    fail_msg: >-
      Discord's stable package URL did not contain one consistent version.

- name: Validate latest stable Discord Debian version
  ansible.builtin.command:
    argv:
      - dpkg
      - --validate-version
      - "{{ discord_release.version }}"
  changed_when: false
  check_mode: false

- name: Gather installed package facts for Discord
  ansible.builtin.package_facts:
    manager: auto

- name: Select installed Discord package version
  vars:
    discord_installed_packages: >-
      {{ ansible_facts.packages[discord_package_name] | default([])
      | selectattr('arch', 'defined')
      | selectattr('arch', 'equalto', discord_package_architecture) | list }}
  ansible.builtin.set_fact:
    discord_installed_version: >-
      {{ (discord_installed_packages | first | default({})).version
      | default('') }}

- name: Inspect installed Discord dpkg state
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - '--showformat=${db:Status-Abbrev}'
      - "{{ discord_package_name }}:{{ discord_package_architecture }}"
  register: discord_installed_package_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: discord_installed_version | length > 0

- name: Compare installed and stable Discord Debian versions
  ansible.builtin.command:
    argv:
      - dpkg
      - --compare-versions
      - "{{ discord_installed_version }}"
      - eq
      - "{{ discord_release.version }}"
  register: discord_installed_version_comparison
  changed_when: false
  failed_when: discord_installed_version_comparison.rc not in [0, 1]
  check_mode: false
  when: discord_installed_version | length > 0

- name: Determine required Discord package action
  vars:
    discord_installed_package_is_configured: >-
      {{ discord_installed_package_status.rc | default(1) == 0 and
      discord_installed_package_status.stdout | default('') | trim == 'ii' }}
  ansible.builtin.set_fact:
    discord_install_required: >-
      {{ discord_installed_version | length == 0 or
      discord_installed_version_comparison.rc | default(1) != 0 }}
    discord_configuration_repair_required: >-
      {{ discord_installed_version | length > 0 and
      discord_installed_version_comparison.rc | default(1) == 0 and
      not (discord_installed_package_is_configured | bool) }}

- name: Report pending Discord installation in check mode
  ansible.builtin.debug:
    msg: Discord {{ discord_release.version }} would be installed.
  changed_when: true
  when:
    - ansible_check_mode
    - discord_install_required

- name: Report pending Discord configuration repair in check mode
  ansible.builtin.debug:
    msg: >-
      Discord {{ discord_release.version }} would be configured to repair its
      incomplete dpkg state.
  changed_when: true
  when:
    - ansible_check_mode
    - discord_configuration_repair_required

- name: Install latest stable Discord package
  when:
    - >-
      discord_install_required or
      discord_configuration_repair_required
    - not ansible_check_mode
  block:
    - name: Create temporary directory for Discord package
      ansible.builtin.tempfile:
        state: directory
        suffix: .discord
      register: discord_package_tempdir
      changed_when: false

    - name: Download, validate, and install Discord package
      block:
        - name: Download Discord package
          ansible.builtin.uri:
            url: "{{ discord_release.url }}"
            dest: >-
              {{ discord_package_tempdir.path }}/{{ discord_release.filename }}
            method: GET
            follow_redirects: none
            status_code: 200
            mode: "0600"

        - name: Inspect downloaded Discord package metadata
          ansible.builtin.command:
            argv:
              - dpkg-deb
              - --show
              - '--showformat=${Package}\t${Version}\t${Architecture}\n'
              - >-
                {{ discord_package_tempdir.path }}/{{ discord_release.filename }}
          register: discord_downloaded_package_metadata
          changed_when: false

        - name: Validate downloaded Discord package metadata
          vars:
            discord_expected_package_metadata:
              - "{{ discord_package_name }}"
              - "{{ discord_release.version }}"
              - "{{ discord_package_architecture }}"
          ansible.builtin.assert:
            that:
              - >-
                discord_downloaded_package_metadata.stdout.split() ==
                discord_expected_package_metadata
            fail_msg: >-
              The downloaded Discord package metadata does not match the
              expected package name, version, and AMD64 architecture.

        - name: Install validated Discord package
          ansible.builtin.apt:
            deb: >-
              {{ discord_package_tempdir.path }}/{{ discord_release.filename }}
            state: present
            allow_downgrade: true
            lock_timeout: 120
          when: discord_install_required

        - name: Repair matching Discord package through APT
          ansible.builtin.command:
            argv:
              - /usr/bin/apt-get
              - --yes
              - --fix-broken
              - --no-remove
              - --reinstall
              - -o
              - DPkg::Lock::Timeout=120
              - -o
              - Dpkg::Options::=--force-confdef
              - -o
              - Dpkg::Options::=--force-confold
              - install
              - >-
                {{ discord_package_tempdir.path }}/{{
                discord_release.filename }}
          environment:
            DEBIAN_FRONTEND: noninteractive
            LC_ALL: C
          changed_when: true
          when: discord_configuration_repair_required

        - name: Inspect repaired Discord package state
          ansible.builtin.command:
            argv:
              - dpkg-query
              - --show
              - >-
                --showformat=${Version}\t${Architecture}\t${db:Status-Abbrev}\n
              - "{{ discord_package_name }}:{{ discord_package_architecture }}"
          environment:
            LC_ALL: C
          register: discord_repaired_package_status
          changed_when: false
          failed_when: false
          when: discord_configuration_repair_required

        - name: Validate repaired Discord package state
          vars:
            discord_expected_repaired_package_status:
              - "{{ discord_release.version }}"
              - "{{ discord_package_architecture }}"
              - ii
          ansible.builtin.assert:
            that:
              - discord_repaired_package_status.rc | default(1) == 0
              - >-
                discord_repaired_package_status.stdout.split() ==
                discord_expected_repaired_package_status
            fail_msg: >-
              APT did not leave the expected Discord package version and
              architecture fully configured.
          when: discord_configuration_repair_required
      always:
        - name: Remove temporary Discord package directory
          ansible.builtin.file:
            path: "{{ discord_package_tempdir.path }}"
            state: absent
          changed_when: false
