---
- name: Validate Discord platform support
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in discord_supported_architectures
    fail_msg: >-
      Discord supports AMD64. Detected
      {{ ansible_facts["architecture"] }}.

- name: Discover latest stable Discord package
  ansible.builtin.uri:
    url: "{{ discord_download_endpoint }}"
    method: HEAD
    follow_redirects: none
    status_code: 302
    return_content: false
  register: discord_download_response
  changed_when: false
  check_mode: false

- name: Validate latest stable Discord package location
  vars:
    discord_release_location: >-
      {{ discord_download_response.location | default('') }}
    discord_release_path: >-
      {{ discord_release_location | ansible.builtin.urlsplit('path') }}
  ansible.builtin.assert:
    that:
      - >-
        (discord_release_location | ansible.builtin.urlsplit('scheme'))
        == 'https'
      - >-
        (discord_release_location | ansible.builtin.urlsplit('hostname'))
        == discord_release_hostname
      - >-
        (discord_release_location | ansible.builtin.urlsplit('query'))
        | length == 0
      - >-
        discord_release_path is match(
        '^/apps/linux/[^/]+/discord-[^/]+[.]deb$')
    fail_msg: >-
      Discord's stable download endpoint did not redirect to the expected
      HTTPS package location.

- name: Select latest stable Discord package
  vars:
    discord_release_location: "{{ discord_download_response.location }}"
    discord_release_path: >-
      {{ discord_release_location | ansible.builtin.urlsplit('path') }}
  ansible.builtin.set_fact:
    discord_release:
      url: "{{ discord_release_location }}"
      version: "{{ discord_release_path.split('/')[-2] }}"
      filename: "{{ discord_release_path.split('/')[-1] }}"

- name: Validate latest stable Discord package version
  ansible.builtin.assert:
    that:
      - discord_release.version | length > 0
      - >-
        discord_release.filename ==
        'discord-' ~ discord_release.version ~ '.deb'
      - >-
        discord_release.url ==
        discord_release_base_url ~ '/' ~ discord_release.version ~ '/' ~
        discord_release.filename
    fail_msg: >-
      Discord's stable package URL did not contain one consistent version.

- name: Validate latest stable Discord Debian version
  ansible.builtin.command:
    argv:
      - dpkg
      - --validate-version
      - "{{ discord_release.version }}"
  changed_when: false
  check_mode: false

# Accepted tradeoff (README Item 8): Discord publishes no checksum,
# signature, or signed repository for this DEB, so its authenticity relies
# on TLS to the validated download host; the empty checksum makes the
# shared download refuse redirects away from it.
- name: Ensure latest stable Discord package
  ansible.builtin.include_role:
    name: deb_package
    tasks_from: ensure.yml
  vars:
    deb_package_display_name: Discord
    deb_package_name: "{{ discord_package_name }}"
    deb_package_architecture: "{{ discord_package_architecture }}"
    deb_package_version: "{{ discord_release.version }}"
    deb_package_url: "{{ discord_release.url }}"
    deb_package_filename: "{{ discord_release.filename }}"
