---
- name: Validate Ruff architecture support
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in ruff_architecture_map
    fail_msg: >-
      Ruff supports AMD64 and ARM64. Detected
      {{ ansible_facts["architecture"] }}.

- name: Resolve Ruff version probe account
  ansible.builtin.getent:
    database: passwd
    key: nobody
    fail_key: false

- name: Validate Ruff version probe account
  vars:
    ruff_version_probe_passwd: >-
      {{ ansible_facts["getent_passwd"]["nobody"] | default([], true) }}
  ansible.builtin.assert:
    that:
      - ruff_version_probe_passwd | length >= 3
      - (ruff_version_probe_passwd + ['', '', ''])[1] | int > 0
    fail_msg: >-
      Ruff version probes require the unprivileged nobody account with a
      non-root user ID.

- name: Inspect Ruff install directory
  ansible.builtin.stat:
    path: "{{ ruff_install_directory }}"
    follow: false
  register: ruff_install_directory_status

- name: Validate Ruff install directory security
  ansible.builtin.assert:
    that:
      - ruff_install_directory_status.stat.isdir | default(false)
      - not ruff_install_directory_status.stat.islnk | default(false)
      - ruff_install_directory_status.stat.uid | default(-1) == 0
      - ruff_install_directory_status.stat.gid | default(-1) == 0
      - >-
        (ruff_install_directory_status.stat.mode | default(''))
        is match('^0[1357][0145][15]$')
    fail_msg: >-
      {{ ruff_install_directory }} must be an existing root-owned directory,
      must not be a symbolic link, must be traversable by ordinary users, and
      must not be group- or world-writable.

- name: Get latest Ruff release
  ansible.builtin.uri:
    url: "{{ ruff_release_api_url }}"
    return_content: true
  register: ruff_release
  changed_when: false
  check_mode: false

- name: Select Ruff archive asset
  vars:
    ruff_release_architecture: >-
      {{ ruff_architecture_map[ansible_facts["architecture"]] }}
    ruff_archive_filename: >-
      ruff-{{ ruff_release_architecture }}-unknown-linux-gnu.tar.gz
  ansible.builtin.set_fact:
    ruff_release_asset: >-
      {{ ruff_release.json.assets
      | selectattr('name', 'equalto', ruff_archive_filename)
      | first | default({}) }}

- name: Validate Ruff archive asset
  ansible.builtin.assert:
    that:
      - ruff_release_asset | length > 0
      - ruff_release_asset.state | default('') == 'uploaded'
      - >-
        (ruff_release_asset.browser_download_url | default('')).startswith(
        ruff_release_base_url ~ '/')
      - >-
        (ruff_release_asset.digest | default(''))
        is match('^sha256:[0-9a-f]{64}$')
    fail_msg: >-
      The latest Ruff release did not contain the expected uploaded Linux
      archive with a trusted GitHub download URL and SHA-256 digest.

- name: Inspect installed Ruff binary path
  ansible.builtin.stat:
    path: "{{ ruff_install_directory }}/ruff"
    follow: false
  register: ruff_installed_binary_status

- name: Validate installed Ruff binary path type
  ansible.builtin.assert:
    that:
      - >-
        not ruff_installed_binary_status.stat.exists or
        ruff_installed_binary_status.stat.isreg | default(false) or
        ruff_installed_binary_status.stat.islnk | default(false)
    fail_msg: >-
      Refusing to replace {{ ruff_install_directory }}/ruff because it is
      neither a regular file nor a symbolic link.

- name: Determine whether installed Ruff binary is safe to execute
  ansible.builtin.set_fact:
    ruff_installed_binary_is_safe: >-
      {{ ruff_installed_binary_status.stat.isreg | default(false)
      and not ruff_installed_binary_status.stat.islnk | default(false)
      and ruff_installed_binary_status.stat.uid | default(-1) == 0
      and ruff_installed_binary_status.stat.gid | default(-1) == 0
      and ruff_installed_binary_status.stat.mode | default('') == '0755' }}

- name: Inspect installed Ruff version as nobody
  ansible.builtin.command:
    argv:
      - "{{ ruff_install_directory }}/ruff"
      - --version
    chdir: "{{ ruff_install_directory }}"
  become: true
  become_user: nobody
  register: ruff_installed_release
  changed_when: false
  failed_when: false
  check_mode: false
  when: ruff_installed_binary_is_safe

- name: Determine whether Ruff installation is required
  vars:
    ruff_release_version: >-
      {{ ruff_release.json.tag_name | regex_replace('^v', '') }}
    ruff_installed_version: >-
      {{ ((ruff_installed_release.stdout | default('')).split()
      + ['', ''])[1] | regex_replace('^v', '') }}
  ansible.builtin.set_fact:
    ruff_install_required: >-
      {{ not ruff_installed_binary_is_safe or
      ruff_installed_release.rc | default(1) != 0 or
      ruff_installed_version != ruff_release_version }}

- name: Report pending Ruff installation in check mode
  ansible.builtin.debug:
    msg: >-
      Ruff {{ ruff_release.json.tag_name }} would be installed in
      {{ ruff_install_directory }}.
  changed_when: true
  when:
    - ansible_check_mode
    - ruff_install_required

- name: Download, verify, and install required Ruff release
  when:
    - ruff_install_required
    - not ansible_check_mode
  block:
    - name: Create temporary directory for Ruff archive
      ansible.builtin.tempfile:
        state: directory
        suffix: .ruff
      register: ruff_archive_tempdir
      changed_when: false

    - name: Download and install verified Ruff archive
      block:
        - name: Download verified Ruff archive
          ansible.builtin.get_url:
            url: "{{ ruff_release_asset.browser_download_url }}"
            dest: >-
              {{ ruff_archive_tempdir.path }}/{{ ruff_release_asset.name }}
            checksum: "{{ ruff_release_asset.digest }}"
            mode: "0600"

        - name: Extract verified Ruff archive
          ansible.builtin.unarchive:
            src: >-
              {{ ruff_archive_tempdir.path }}/{{ ruff_release_asset.name }}
            dest: "{{ ruff_archive_tempdir.path }}"
            remote_src: true
            extra_opts:
              - --strip-components=1
            owner: root
            group: root
            mode: "0755"

        - name: Inspect extracted Ruff binary
          ansible.builtin.stat:
            path: "{{ ruff_archive_tempdir.path }}/ruff"
            follow: false
          register: ruff_downloaded_binary_status

        - name: Validate extracted Ruff binary
          ansible.builtin.assert:
            that:
              - ruff_downloaded_binary_status.stat.isreg | default(false)
              - not ruff_downloaded_binary_status.stat.islnk | default(false)
              - ruff_downloaded_binary_status.stat.uid | default(-1) == 0
              - ruff_downloaded_binary_status.stat.gid | default(-1) == 0
              - >-
                ruff_downloaded_binary_status.stat.mode | default('') == '0755'
            fail_msg: >-
              The extracted Ruff binary is not a root-owned regular executable.

        - name: Inspect downloaded Ruff version without root privileges
          block:
            - name: Grant unprivileged traversal of Ruff temporary directory
              ansible.builtin.file:
                path: "{{ ruff_archive_tempdir.path }}"
                state: directory
                mode: "0701"
              changed_when: false

            - name: Run downloaded Ruff version probe as nobody
              ansible.builtin.command:
                argv:
                  - "{{ ruff_archive_tempdir.path }}/ruff"
                  - --version
                chdir: "{{ ruff_archive_tempdir.path }}"
              become: true
              become_user: nobody
              register: ruff_downloaded_release
              changed_when: false
          always:
            - name: Restore Ruff temporary directory permissions
              ansible.builtin.file:
                path: "{{ ruff_archive_tempdir.path }}"
                state: directory
                mode: "0700"
              changed_when: false

        - name: Validate downloaded Ruff version
          vars:
            ruff_release_version: >-
              {{ ruff_release.json.tag_name | regex_replace('^v', '') }}
            ruff_downloaded_version: >-
              {{ (ruff_downloaded_release.stdout.split()
              + ['', ''])[1] | regex_replace('^v', '') }}
          ansible.builtin.assert:
            that:
              - ruff_downloaded_version == ruff_release_version
            fail_msg: >-
              The downloaded Ruff binary version does not match GitHub's
              latest release tag.

        - name: Install verified Ruff binary
          ansible.builtin.copy:
            src: "{{ ruff_archive_tempdir.path }}/ruff"
            dest: "{{ ruff_install_directory }}/ruff"
            remote_src: true
            owner: root
            group: root
            mode: "0755"
            follow: false
      always:
        - name: Remove temporary Ruff archive directory
          ansible.builtin.file:
            path: "{{ ruff_archive_tempdir.path }}"
            state: absent
          changed_when: false
