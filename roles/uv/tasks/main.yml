---
- name: Validate uv architecture support
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in uv_architecture_map
    fail_msg: >-
      uv supports AMD64 and ARM64. Detected
      {{ ansible_facts["architecture"] }}.

- name: Resolve uv version probe account
  ansible.builtin.getent:
    database: passwd
    key: nobody
    fail_key: false

- name: Validate uv version probe account
  vars:
    uv_version_probe_passwd: >-
      {{ ansible_facts["getent_passwd"]["nobody"] | default([], true) }}
  ansible.builtin.assert:
    that:
      - uv_version_probe_passwd | length >= 3
      - (uv_version_probe_passwd + ['', '', ''])[1] | int > 0
    fail_msg: >-
      uv version probes require the unprivileged nobody account with a non-root
      user ID.

- name: Inspect uv install directory
  ansible.builtin.stat:
    path: "{{ uv_install_directory }}"
    follow: false
  register: uv_install_directory_status

- name: Validate uv install directory security
  ansible.builtin.assert:
    that:
      - uv_install_directory_status.stat.isdir | default(false)
      - not uv_install_directory_status.stat.islnk | default(false)
      - uv_install_directory_status.stat.uid | default(-1) == 0
      - uv_install_directory_status.stat.gid | default(-1) == 0
      - >-
        (uv_install_directory_status.stat.mode | default(''))
        is match('^0[1357][0145][15]$')
    fail_msg: >-
      {{ uv_install_directory }} must be an existing root-owned directory,
      must not be a symbolic link, must be traversable by ordinary users, and
      must not be group- or world-writable.

- name: Get latest uv release
  ansible.builtin.uri:
    url: "{{ uv_release_api_url }}"
    return_content: true
  register: uv_release
  changed_when: false
  check_mode: false

- name: Select uv archive asset
  vars:
    uv_release_architecture: >-
      {{ uv_architecture_map[ansible_facts["architecture"]] }}
    uv_archive_filename: >-
      uv-{{ uv_release_architecture }}-unknown-linux-gnu.tar.gz
  ansible.builtin.set_fact:
    uv_release_asset: >-
      {{ uv_release.json.assets
      | selectattr('name', 'equalto', uv_archive_filename)
      | first | default({}) }}

- name: Validate uv archive asset
  ansible.builtin.assert:
    that:
      - uv_release_asset | length > 0
      - uv_release_asset.state | default('') == 'uploaded'
      - >-
        (uv_release_asset.browser_download_url | default('')).startswith(
        uv_release_base_url ~ '/')
      - >-
        (uv_release_asset.digest | default(''))
        is match('^sha256:[0-9a-f]{64}$')
    fail_msg: >-
      The latest uv release did not contain the expected uploaded Linux
      archive with a trusted GitHub download URL and SHA-256 digest.

- name: Inspect installed uv binary path
  ansible.builtin.stat:
    path: "{{ uv_install_directory }}/uv"
    follow: false
  register: uv_installed_binary_status

- name: Inspect installed uvx binary path
  ansible.builtin.stat:
    path: "{{ uv_install_directory }}/uvx"
    follow: false
  register: uv_installed_uvx_binary_status

- name: Validate installed uv binary path types
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.exists or
        item.stat.isreg | default(false) or
        item.stat.islnk | default(false)
    fail_msg: >-
      Refusing to replace {{ item.item }} because it is neither a regular
      file nor a symbolic link.
  loop:
    - stat: "{{ uv_installed_binary_status.stat }}"
      item: "{{ uv_install_directory }}/uv"
    - stat: "{{ uv_installed_uvx_binary_status.stat }}"
      item: "{{ uv_install_directory }}/uvx"
  loop_control:
    label: "{{ item.item }}"

- name: Determine whether installed uv binaries are safe to execute
  ansible.builtin.set_fact:
    uv_installed_binary_is_safe: >-
      {{ uv_installed_binary_status.stat.isreg | default(false)
      and not uv_installed_binary_status.stat.islnk | default(false)
      and uv_installed_binary_status.stat.uid | default(-1) == 0
      and uv_installed_binary_status.stat.gid | default(-1) == 0
      and uv_installed_binary_status.stat.mode | default('') == '0755' }}
    uv_installed_uvx_binary_is_safe: >-
      {{ uv_installed_uvx_binary_status.stat.isreg | default(false)
      and not uv_installed_uvx_binary_status.stat.islnk | default(false)
      and uv_installed_uvx_binary_status.stat.uid | default(-1) == 0
      and uv_installed_uvx_binary_status.stat.gid | default(-1) == 0
      and uv_installed_uvx_binary_status.stat.mode | default('') == '0755' }}

- name: Inspect installed uv version as nobody
  ansible.builtin.command:
    argv:
      - "{{ uv_install_directory }}/uv"
      - --version
    chdir: "{{ uv_install_directory }}"
  become: true
  become_user: nobody
  register: uv_installed_release
  changed_when: false
  failed_when: false
  check_mode: false
  when: uv_installed_binary_is_safe

- name: Inspect installed uvx version as nobody
  ansible.builtin.command:
    argv:
      - "{{ uv_install_directory }}/uvx"
      - --version
    chdir: "{{ uv_install_directory }}"
  become: true
  become_user: nobody
  register: uv_installed_uvx_release
  changed_when: false
  failed_when: false
  check_mode: false
  when: uv_installed_uvx_binary_is_safe

- name: Determine whether uv installation is required
  vars:
    uv_release_version: >-
      {{ uv_release.json.tag_name | regex_replace('^v', '') }}
    uv_installed_version: >-
      {{ ((uv_installed_release.stdout | default('')).split()
      + ['', ''])[1] | regex_replace('^v', '') }}
    uv_installed_uvx_version: >-
      {{ ((uv_installed_uvx_release.stdout | default('')).split()
      + ['', ''])[1] | regex_replace('^v', '') }}
  ansible.builtin.set_fact:
    uv_install_required: >-
      {{ not uv_installed_binary_is_safe or
      not uv_installed_uvx_binary_is_safe or
      uv_installed_release.rc | default(1) != 0 or
      uv_installed_uvx_release.rc | default(1) != 0 or
      uv_installed_version != uv_release_version or
      uv_installed_uvx_version != uv_release_version }}

- name: Report pending uv installation in check mode
  ansible.builtin.debug:
    msg: >-
      uv {{ uv_release.json.tag_name }} would be installed in
      {{ uv_install_directory }} with uvx.
  changed_when: true
  when:
    - ansible_check_mode
    - uv_install_required

- name: Download, verify, and install required uv release
  when:
    - uv_install_required
    - not ansible_check_mode
  block:
    - name: Create temporary directory for uv archive
      ansible.builtin.tempfile:
        state: directory
        suffix: .uv
      register: uv_archive_tempdir
      changed_when: false

    - name: Download and install verified uv archive
      block:
        - name: Download verified uv archive
          ansible.builtin.get_url:
            url: "{{ uv_release_asset.browser_download_url }}"
            dest: >-
              {{ uv_archive_tempdir.path }}/{{ uv_release_asset.name }}
            checksum: "{{ uv_release_asset.digest }}"
            mode: "0600"

        - name: Extract verified uv archive
          ansible.builtin.unarchive:
            src: >-
              {{ uv_archive_tempdir.path }}/{{ uv_release_asset.name }}
            dest: "{{ uv_archive_tempdir.path }}"
            remote_src: true
            extra_opts:
              - --strip-components=1
            owner: root
            group: root
            mode: "0755"

        - name: Inspect extracted uv binary paths
          ansible.builtin.stat:
            path: "{{ uv_archive_tempdir.path }}/{{ item }}"
            follow: false
          loop:
            - uv
            - uvx
          register: uv_downloaded_binary_statuses

        - name: Validate extracted uv binaries
          ansible.builtin.assert:
            that:
              - item.stat.isreg | default(false)
              - not item.stat.islnk | default(false)
              - item.stat.uid | default(-1) == 0
              - item.stat.gid | default(-1) == 0
              - item.stat.mode | default('') == '0755'
            fail_msg: >-
              The extracted {{ item.item }} binary is not a root-owned regular
              executable.
          loop: "{{ uv_downloaded_binary_statuses.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Inspect downloaded uv versions without root privileges
          block:
            - name: Grant unprivileged traversal of uv temporary directory
              ansible.builtin.file:
                path: "{{ uv_archive_tempdir.path }}"
                state: directory
                mode: "0701"
              changed_when: false

            - name: Run downloaded uv version probe as nobody
              ansible.builtin.command:
                argv:
                  - "{{ uv_archive_tempdir.path }}/uv"
                  - --version
                chdir: "{{ uv_archive_tempdir.path }}"
              become: true
              become_user: nobody
              register: uv_downloaded_release
              changed_when: false

            - name: Run downloaded uvx version probe as nobody
              ansible.builtin.command:
                argv:
                  - "{{ uv_archive_tempdir.path }}/uvx"
                  - --version
                chdir: "{{ uv_archive_tempdir.path }}"
              become: true
              become_user: nobody
              register: uv_downloaded_uvx_release
              changed_when: false
          always:
            - name: Restore uv temporary directory permissions
              ansible.builtin.file:
                path: "{{ uv_archive_tempdir.path }}"
                state: directory
                mode: "0700"
              changed_when: false

        - name: Validate downloaded uv and uvx versions
          vars:
            uv_release_version: >-
              {{ uv_release.json.tag_name | regex_replace('^v', '') }}
            uv_downloaded_version: >-
              {{ (uv_downloaded_release.stdout.split()
              + ['', ''])[1] | regex_replace('^v', '') }}
            uv_downloaded_uvx_version: >-
              {{ (uv_downloaded_uvx_release.stdout.split()
              + ['', ''])[1] | regex_replace('^v', '') }}
          ansible.builtin.assert:
            that:
              - uv_downloaded_version == uv_release_version
              - uv_downloaded_uvx_version == uv_release_version
            fail_msg: >-
              The downloaded uv or uvx binary version does not match
              GitHub's latest release tag.

        - name: Install verified uv binaries
          ansible.builtin.copy:
            src: "{{ uv_archive_tempdir.path }}/{{ item }}"
            dest: "{{ uv_install_directory }}/{{ item }}"
            remote_src: true
            owner: root
            group: root
            mode: "0755"
            follow: false
          loop:
            - uv
            - uvx
      always:
        - name: Remove temporary uv archive directory
          ansible.builtin.file:
            path: "{{ uv_archive_tempdir.path }}"
            state: absent
          changed_when: false
