---
- name: Validate download inputs for {{ deb_package_display_name }}
  ansible.builtin.assert:
    that:
      - deb_package_url is match('^https://.+')
      - deb_package_filename is match('^[^/]+[.]deb$')
      - not ansible_check_mode
    fail_msg: >-
      The {{ deb_package_display_name }} package download needs an HTTPS
      URL, a bare .deb filename, and a run outside check mode.

- name: Create temporary package directory for {{ deb_package_display_name }}
  ansible.builtin.tempfile:
    state: directory
    suffix: ".{{ deb_package_name }}"
  register: deb_package_tempdir
  changed_when: false

- name: Download and install the package of {{ deb_package_display_name }}
  vars:
    deb_package_download_path: >-
      {{ deb_package_tempdir.path }}/{{ deb_package_filename }}
  block:
    # The retries cover transient connection errors and server-side
    # failures, matching the metadata fetches that precede the download.
    # A checksum mismatch is retried deliberately: transient truncation
    # or corruption is the common cause, and a genuinely wrong published
    # digest still fails loudly after the retries.
    - name: Download verified package of {{ deb_package_display_name }}
      ansible.builtin.get_url:
        url: "{{ deb_package_url }}"
        dest: "{{ deb_package_download_path }}"
        checksum: "{{ deb_package_checksum }}"
        mode: "0600"
      retries: "{{ remote_fetch_retries }}"
      delay: "{{ remote_fetch_retry_delay }}"
      when: deb_package_checksum | length > 0

    # Without a published checksum the download's authenticity relies on
    # TLS to the validated host, so redirects away from it are refused.
    # The until stops retrying deterministic responses: a redirect or
    # most client errors repeat identically, while connection errors,
    # server-side failures, and the transient client statuses 408 and
    # 429 remain worth retrying.
    - name: Download redirect-free package of {{ deb_package_display_name }}
      ansible.builtin.uri:
        url: "{{ deb_package_url }}"
        dest: "{{ deb_package_download_path }}"
        method: GET
        follow_redirects: none
        status_code: 200
        mode: "0600"
      register: deb_package_download_response
      retries: "{{ remote_fetch_retries }}"
      delay: "{{ remote_fetch_retry_delay }}"
      until: >-
        deb_package_download_response.status | default(-1) == 200 or
        (deb_package_download_response.status | default(-1) >= 300 and
        deb_package_download_response.status | default(-1) < 500 and
        deb_package_download_response.status | default(-1)
        not in [408, 429])
      when: deb_package_checksum | length == 0

    - name: Install or repair validated package of {{ deb_package_display_name }}
      ansible.builtin.include_tasks: install.yml
      vars:
        deb_package_path: "{{ deb_package_download_path }}"
  always:
    - name: Remove temporary package directory of {{ deb_package_display_name }}
      ansible.builtin.file:
        path: "{{ deb_package_tempdir.path }}"
        state: absent
      changed_when: false
