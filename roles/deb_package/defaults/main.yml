---
# Shared building blocks for roles that install a standalone vendor .deb
# package. Callers resolve the release themselves (version, download URL,
# and transport validation stay role-specific) and include the entry points
# below through include_role with tasks_from, passing these variables:
#
#   deb_package_display_name   name used in task messages
#   deb_package_name           Debian package name inside the archive
#   deb_package_architecture   Debian architecture of the package
#   deb_package_version        target version the caller resolved
#   deb_package_path           absolute path of the downloaded .deb archive
#                              (install.yml only)
#   deb_package_url            HTTPS download URL of the .deb archive
#                              (download_install.yml only)
#   deb_package_checksum       expected archive checksum such as
#                              "sha256:<hex>"; when empty the download
#                              relies on TLS to the validated host and
#                              refuses redirects (download_install.yml only)
#   deb_package_filename       bare filename for the downloaded archive
#                              (download_install.yml only)
#
# Entry points:
#
#   ensure.yml    pairs status.yml with download_install.yml behind the
#                 shared install guard (installation or repair required,
#                 and not check mode); callers pass the union of both entry
#                 points' variables and this is the preferred entry point
#   status.yml    inspects the installed package with one dpkg-query probe
#                 of deb_package_name:deb_package_architecture, sets the
#                 deb_package_install_required,
#                 deb_package_repair_required, and
#                 deb_package_status_subject facts, and reports pending
#                 work in check mode
#   install.yml   validates the downloaded archive metadata with dpkg-deb,
#                 installs it when installation is required, repairs an
#                 incomplete dpkg state through APT when repair is required,
#                 and validates the repaired package state afterwards; it
#                 requires a preceding status.yml inclusion for the same
#                 package, architecture, and target version (enforced via
#                 deb_package_status_subject) and never runs in check mode
#   download_install.yml
#                 owns the whole fetch-and-install flow: creates a temporary
#                 directory, downloads the archive (checksum-verified, or
#                 redirect-free over TLS when no checksum exists), runs
#                 install.yml on it, and always removes the temporary
#                 directory; it has the same status.yml prerequisite and
#                 check-mode restriction as install.yml
deb_package_display_name: ""
deb_package_name: ""
deb_package_architecture: ""
deb_package_version: ""
deb_package_path: ""
deb_package_url: ""
deb_package_checksum: ""
deb_package_filename: ""

# Sourced from group_vars/all.yml so platform support is defined once for
# the playbook and every role.
deb_package_supported_architectures: >-
  {{ linux_release_architecture_map.values() | unique | list }}
