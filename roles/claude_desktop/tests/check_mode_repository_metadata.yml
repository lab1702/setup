---
# Exercises the production deb822 source and armored .asc keyring pairing
# with the specification and derived values sourced from the role defaults,
# mirroring what the vendor_repository role passes to repository_check.
- name: Exercise isolated deb822 Claude repository metadata
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../../../group_vars/all.yml
    - ../defaults/main.yml
    - ../../vendor_repository/defaults/main.yml
  vars:
    repository_check_owner: "{{ ansible_facts['user_id'] }}"
    repository_check_group: "{{ ansible_facts['user_gid'] }}"
    repository_check_apt_user: "{{ ansible_facts['user_id'] }}"
  tasks:
    - name: Validate test architecture support
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts["architecture"]
            in linux_release_architecture_map

    # Scaffolding tasks run for real even under --check so the exercised
    # role sees a complete sandbox, matching roles/amd64v3/tests.
    - name: Create temporary Claude test key directory
      ansible.builtin.tempfile:
        state: directory
        suffix: .claude-repository-test
      register: claude_desktop_test_key_tempdir
      changed_when: false
      check_mode: false

    - name: Exercise verified Claude repository metadata
      vars:
        # Overrides the empty specification placeholder loaded from the
        # shared defaults so the derived variables template from the same
        # specification production passes to the vendor_repository role.
        vendor_repository_spec: "{{ claude_desktop_repository }}"
        claude_desktop_test_key_path: >-
          {{ claude_desktop_test_key_tempdir.path }}/key{{
          vendor_repository_keyring_extension }}
      block:
        # Mirrors the production key download, including the until that
        # stops retrying deterministic statuses.
        - name: Download Claude signing key
          ansible.builtin.get_url:
            url: "{{ vendor_repository_key_url }}"
            dest: "{{ claude_desktop_test_key_path }}"
            mode: "0600"
          register: claude_desktop_test_key_download
          changed_when: false
          check_mode: false
          retries: "{{ remote_fetch_retries }}"
          delay: "{{ remote_fetch_retry_delay }}"
          until: >-
            claude_desktop_test_key_download.status_code | default(-1) == 200 or
            (claude_desktop_test_key_download.status_code | default(-1) >= 300 and
            claude_desktop_test_key_download.status_code | default(-1) < 500 and
            claude_desktop_test_key_download.status_code | default(-1)
            not in remote_fetch_transient_status_codes)

        - name: Inspect Claude signing key
          ansible.builtin.command:
            argv:
              - gpg
              - --batch
              - --show-keys
              - --with-colons
              - "{{ claude_desktop_test_key_path }}"
          register: claude_desktop_test_repository_key
          changed_when: false
          check_mode: false

        - name: Validate Claude signing key
          ansible.builtin.assert:
            that:
              - >-
                claude_desktop_test_repository_key.stdout_lines
                | select('equalto',
                vendor_repository_expected_fingerprint_record)
                | list | length == 1

        - name: Refresh isolated deb822 Claude metadata
          ansible.builtin.include_role:
            name: repository_check
          vars:
            repository_check_key_source: >-
              {{ claude_desktop_test_key_path }}
            repository_check_key_remote_src: true
            repository_check_keyring_filename: >-
              repository-keyring{{ vendor_repository_keyring_extension }}
            repository_check_source_content: >-
              {{ vendor_repository_source_content }}
            repository_check_system_keyring_path: >-
              {{ vendor_repository_keyring_path }}
            repository_check_source_filename: repository.sources
            repository_check_package_names: >-
              {{ vendor_repository_package_names }}

        - name: Validate isolated Claude package metadata
          ansible.builtin.assert:
            that:
              - >-
                vendor_repository_package_names
                | reject('in', repository_check_package_versions.stdout)
                | list | length == 0
      always:
        - name: Remove temporary Claude test key directory
          ansible.builtin.file:
            path: "{{ claude_desktop_test_key_tempdir.path }}"
            state: absent
          changed_when: false
          check_mode: false
