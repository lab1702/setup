---
- name: Validate Claude Desktop architecture support
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in claude_desktop_architecture_map
    fail_msg: >-
      Claude Desktop supports x86_64 or ARM64; detected
      {{ ansible_facts["architecture"] }}.

- name: Preflight Claude Desktop apt repository
  ansible.builtin.import_tasks: repository_preflight.yml

- name: Install Claude Desktop repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gpg
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: claude_desktop_repository_prerequisite_installation

- name: Configure signed Claude repository and install Claude Desktop
  when: >-
    not ansible_check_mode or
    not claude_desktop_repository_prerequisite_installation.changed
  block:
    - name: Create temporary directory for Claude Desktop signing key
      ansible.builtin.tempfile:
        state: directory
        suffix: .claude-desktop
      register: claude_desktop_key_tempdir
      changed_when: false
      check_mode: false

    - name: Configure verified Claude Desktop repository and package
      block:
        - name: Download Claude Desktop signing key
          ansible.builtin.get_url:
            url: "{{ claude_desktop_key_url }}"
            dest: "{{ claude_desktop_key_tempdir.path }}/key.asc"
            mode: "0600"
          changed_when: false
          check_mode: false

        - name: Inspect Claude Desktop signing key
          ansible.builtin.command:
            argv:
              - gpg
              - --batch
              - --show-keys
              - --with-colons
              - "{{ claude_desktop_key_tempdir.path }}/key.asc"
          register: claude_desktop_key
          changed_when: false
          check_mode: false

        - name: Verify Claude Desktop signing key fingerprint
          vars:
            claude_desktop_public_key_records: >-
              {{ claude_desktop_key.stdout_lines
              | select('match', '^pub:') | list }}
            claude_desktop_fingerprint_records: >-
              {{ claude_desktop_key.stdout_lines
              | select('match', '^fpr:') | list }}
            claude_desktop_expected_fingerprint_record: >-
              fpr:::::::::{{ claude_desktop_key_fingerprint }}:
          ansible.builtin.assert:
            that:
              - claude_desktop_public_key_records | length == 1
              - >-
                (claude_desktop_fingerprint_records | first | default('')) ==
                claude_desktop_expected_fingerprint_record
            fail_msg: >-
              The downloaded Claude Desktop signing key does not contain
              exactly one primary key with fingerprint
              {{ claude_desktop_key_fingerprint }}.

        - name: Install verified Claude Desktop signing key
          ansible.builtin.copy:
            src: "{{ claude_desktop_key_tempdir.path }}/key.asc"
            dest: "{{ claude_desktop_keyring_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          register: claude_desktop_keyring_installation

        - name: Add Claude Desktop apt repository
          ansible.builtin.apt_repository:
            repo: "{{ claude_desktop_repository_definition }}"
            filename: "{{ claude_desktop_repository_filename }}"
            mode: "0644"
            state: present
            update_cache: "{{ not ansible_check_mode }}"
          register: claude_desktop_repository_configuration

        - name: Install package while preserving verified Claude repository
          block:
            - name: Resolve and install exact Claude repository version
              block:
                - name: Refresh Claude Desktop repository package metadata
                  ansible.builtin.apt:
                    update_cache: true
                    cache_valid_time: 0
                    lock_timeout: 120
                  changed_when: false
                  when: not ansible_check_mode

                - name: Refresh isolated Claude metadata in check mode
                  ansible.builtin.include_role:
                    name: repository_check
                  vars:
                    repository_check_key_source: >-
                      {{ claude_desktop_key_tempdir.path }}/key.asc
                    repository_check_key_remote_src: true
                    repository_check_keyring_filename: repository-keyring.asc
                    repository_check_source_content: >-
                      {{ claude_desktop_repository_source_content }}
                    repository_check_system_keyring_path: >-
                      {{ claude_desktop_keyring_path }}
                    repository_check_source_filename: repository.list
                    repository_check_package_names:
                      - "{{ claude_desktop_package_name }}"
                  when: ansible_check_mode

                - name: Discover published Claude Desktop repository versions
                  ansible.builtin.command:
                    argv:
                      - apt-cache
                      - madison
                      - "{{ claude_desktop_package_name }}"
                  environment:
                    LC_ALL: C
                  register: claude_desktop_repository_versions
                  changed_when: false
                  check_mode: false
                  when: not ansible_check_mode

                - name: Select isolated Claude repository output in check mode
                  vars:
                    claude_desktop_repository_check_data: >-
                      {{ repository_check_package_versions }}
                  ansible.builtin.set_fact:
                    claude_desktop_repository_version_lines: >-
                      {{ (claude_desktop_repository_check_data.results
                      | first).stdout_lines }}
                  when: ansible_check_mode

                - name: Select complete Claude repository output normally
                  ansible.builtin.set_fact:
                    claude_desktop_repository_version_lines: >-
                      {{ claude_desktop_repository_versions.stdout_lines }}
                  when: not ansible_check_mode

                - name: Select versions from Claude Desktop repository
                  vars:
                    claude_desktop_repository_version_pattern: >-
                      {{ '^\s*'
                      ~ (claude_desktop_package_name
                      | ansible.builtin.regex_escape)
                      ~ '\s*\|\s*\S+\s*\|\s*'
                      ~ (claude_desktop_repository_url
                      | regex_replace('/+$', '')
                      | ansible.builtin.regex_escape)
                      ~ '/?(?:\s|$)' }}
                  ansible.builtin.set_fact:
                    claude_desktop_repository_version_rows: >-
                      {{ claude_desktop_repository_version_lines
                      | select('match',
                      claude_desktop_repository_version_pattern) | list }}

                - name: Validate available Claude Desktop repository versions
                  ansible.builtin.assert:
                    that:
                      - claude_desktop_repository_version_rows | length > 0
                    fail_msg: >-
                      The verified Claude Desktop repository does not publish
                      a candidate for {{ claude_desktop_package_name }} on
                      this architecture.

                - name: Select current Claude Desktop repository version
                  ansible.builtin.set_fact:
                    claude_desktop_package_candidate_version: >-
                      {{ (claude_desktop_repository_version_rows
                      | first).split('|')[1] | trim }}

                - name: Validate current Claude Desktop Debian version
                  ansible.builtin.command:
                    argv:
                      - dpkg
                      - --validate-version
                      - "{{ claude_desktop_package_candidate_version }}"
                  changed_when: false
                  check_mode: false

                - name: Select every source instance of the Claude version
                  vars:
                    claude_desktop_candidate_version_pattern: >-
                      {{ '^\s*'
                      ~ (claude_desktop_package_name
                      | ansible.builtin.regex_escape)
                      ~ '\s*\|\s*'
                      ~ (claude_desktop_package_candidate_version
                      | ansible.builtin.regex_escape)
                      ~ '\s*\|' }}
                  ansible.builtin.set_fact:
                    claude_desktop_candidate_version_rows: >-
                      {{ claude_desktop_repository_version_lines
                      | select('match',
                      claude_desktop_candidate_version_pattern) | list }}
                  when: not ansible_check_mode

                - name: Reject ambiguous Claude Desktop package origins
                  ansible.builtin.assert:
                    that:
                      - claude_desktop_candidate_version_rows | length > 0
                      - >-
                        claude_desktop_candidate_version_rows
                        | difference(claude_desktop_repository_version_rows)
                        | length == 0
                    fail_msg: >-
                      Refusing to install {{ claude_desktop_package_name }}={{
                      claude_desktop_package_candidate_version }} because the
                      same version is available from a non-Claude repository.
                  when: not ansible_check_mode

                - name: Inspect installed Claude Desktop package version
                  ansible.builtin.command:
                    argv:
                      - dpkg-query
                      - --show
                      - --showformat=${Version}\t${db:Status-Status}\n
                      - "{{ claude_desktop_package_name }}"
                  register: claude_desktop_installed_package
                  changed_when: false
                  failed_when: false
                  check_mode: false

                - name: Determine whether Claude Desktop needs installation
                  ansible.builtin.set_fact:
                    claude_desktop_package_installation_required: >-
                      {{ claude_desktop_installed_package.rc != 0 or
                      (claude_desktop_package_candidate_version ~
                      '\tinstalled') not in
                      claude_desktop_installed_package.stdout_lines }}

                - name: Report pending Claude Desktop package installation
                  ansible.builtin.debug:
                    msg: >-
                      Claude Desktop {{
                      claude_desktop_package_candidate_version }} would be
                      installed from the verified Claude repository.
                  changed_when: >-
                    claude_desktop_package_installation_required
                  when: ansible_check_mode

                - name: Install exact current Claude repository version
                  ansible.builtin.apt:
                    name: >-
                      {{ claude_desktop_package_name }}={{
                      claude_desktop_package_candidate_version }}
                    state: present
                    allow_downgrade: true
                    lock_timeout: 120
                  register: claude_desktop_package_installation
                  when: not ansible_check_mode
          always:
            - name: Reassert verified Claude key after package changes
              ansible.builtin.copy:
                src: "{{ claude_desktop_key_tempdir.path }}/key.asc"
                dest: "{{ claude_desktop_keyring_path }}"
                remote_src: true
                owner: root
                group: root
                mode: "0644"
              when:
                - not ansible_check_mode
                - claude_desktop_package_installation is defined
                - >-
                  (claude_desktop_package_installation.changed
                  | default(false)) or
                  (claude_desktop_package_installation.failed
                  | default(false))

            - name: Reassert managed Claude repository after package changes
              ansible.builtin.copy:
                dest: "{{ claude_desktop_repository_sources_path }}"
                content: "{{ claude_desktop_repository_source_content }}"
                owner: root
                group: root
                mode: "0644"
              when:
                - not ansible_check_mode
                - claude_desktop_package_installation is defined
                - >-
                  (claude_desktop_package_installation.changed
                  | default(false)) or
                  (claude_desktop_package_installation.failed
                  | default(false))
      always:
        - name: Remove temporary Claude Desktop signing key directory
          ansible.builtin.file:
            path: "{{ claude_desktop_key_tempdir.path }}"
            state: absent
          changed_when: false
          check_mode: false
