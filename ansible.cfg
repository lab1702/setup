[defaults]
# Resolve roles from this repository so the playbook and the test playbooks
# under roles/*/tests can run from a repo-root checkout. The path is
# relative to this file's directory.
roles_path = roles
# The test playbooks run without an inventory and would otherwise print the
# empty-hosts warning on every run. Real runs never see it: ansible-pull
# passes an explicit "localhost," inventory of its own when none is given.
localhost_warning = False

[inventory]
# The no-inventory-parsed counterpart of localhost_warning above.
inventory_unparsed_warning = False
