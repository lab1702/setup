---
# Desktop-specific packages, included from local.yml. This file lives in
# tasks/ rather than the repository root because ansible-pull without -p
# auto-selects a root-level <hostname>.yml before local.yml, so a host
# named "desktop" would otherwise execute this bare task list as its
# playbook and fail.

# Minimal images without udev's static kvm group must not abort the
# desktop phase; the shared task file handles the missing-group case.
- name: Manage kvm group membership
  ansible.builtin.include_tasks: group_membership.yml
  vars:
    system_group_name: kvm

# Every application include is gated on the shared enablement facts
# derived from workstation_applications in local.yml, never on locally
# re-derived desktop or architecture conditions.
- name: Install ChatGPT Desktop
  ansible.builtin.include_role:
    name: chatgpt
  when: workstation_application_enabled['chatgpt']

- name: Install Claude Desktop
  ansible.builtin.include_role:
    name: claude_desktop
  when: workstation_application_enabled['claude_desktop']

- name: Install Visual Studio Code
  ansible.builtin.include_role:
    name: vscode
  when: workstation_application_enabled['vscode']

- name: Install MEGA Desktop App
  ansible.builtin.include_role:
    name: megasync
  when: workstation_application_enabled['megasync']

- name: Install Discord
  ansible.builtin.include_role:
    name: discord
  when: workstation_application_enabled['discord']

- name: Install Posit RStudio Desktop
  ansible.builtin.include_role:
    name: rstudio
  when: workstation_application_enabled['rstudio']

- name: Install SoloMD
  ansible.builtin.include_role:
    name: solomd
  when: workstation_application_enabled['solomd']

- name: Install Zoom Workplace
  ansible.builtin.include_role:
    name: zoom
  when: workstation_application_enabled['zoom']

- name: Install LibreOffice
  ansible.builtin.apt:
    name: libreoffice
    state: present
    update_cache: true
    # The cache was refreshed earlier in this run, so only refresh again
    # when that was over an hour ago.
    cache_valid_time: 3600
    lock_timeout: 120
