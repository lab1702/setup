---
# Desktop-specific packages, included from local.yml. This file lives in
# tasks/ rather than the repository root because ansible-pull without -p
# auto-selects a root-level <hostname>.yml before local.yml, so a host
# named "desktop" would otherwise execute this bare task list as its
# playbook and fail.

# Mirrors the docker-group handling in local.yml: minimal images without
# udev's static kvm group must not abort the desktop phase.
- name: Inspect kvm group before managing membership
  ansible.builtin.getent:
    database: group
    key: kvm
    fail_key: false

- name: Ensure kvm system group exists
  ansible.builtin.group:
    name: kvm
    system: true
    state: present

- name: Add user to kvm group
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: kvm
    append: true
  when: >-
    not ansible_check_mode or
    ansible_facts["getent_group"]["kvm"] is not none

- name: Report pending kvm group membership in check mode
  ansible.builtin.debug:
    msg: "The user {{ user_name }} would be added to the kvm group."
  changed_when: true
  when:
    - ansible_check_mode
    - ansible_facts["getent_group"]["kvm"] is none

- name: Install ChatGPT Desktop
  ansible.builtin.include_role:
    name: chatgpt

- name: Install Claude Desktop
  ansible.builtin.include_role:
    name: claude_desktop

- name: Install Visual Studio Code
  ansible.builtin.include_role:
    name: vscode

- name: Install MEGA Desktop App
  ansible.builtin.include_role:
    name: megasync

- name: Install Discord
  ansible.builtin.include_role:
    name: discord
  when: workstation_architecture == "amd64"

- name: Install Posit RStudio Desktop
  ansible.builtin.include_role:
    name: rstudio
  when: workstation_architecture == "amd64"

- name: Install Zoom Workplace
  ansible.builtin.include_role:
    name: zoom
  when: workstation_architecture == "amd64"

- name: Install LibreOffice
  ansible.builtin.apt:
    name: libreoffice
    state: present
    update_cache: true
    # The cache was refreshed earlier in this run, so only refresh again
    # when that was over an hour ago.
    cache_valid_time: 3600
    lock_timeout: 120
