---
# Desktop-specific packages

- name: Add user to kvm group
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: kvm
    append: true

- name: Install ChatGPT Desktop
  ansible.builtin.include_role:
    name: chatgpt

- name: Install Claude Desktop
  ansible.builtin.include_role:
    name: claude_desktop

- name: Install Visual Studio Code
  ansible.builtin.include_role:
    name: vscode

- name: Install Discord
  ansible.builtin.include_role:
    name: discord
  when: linux_release_architecture_map[ansible_facts["architecture"]] == "amd64"

- name: Install Posit RStudio Desktop
  ansible.builtin.include_role:
    name: rstudio
  when: linux_release_architecture_map[ansible_facts["architecture"]] == "amd64"

- name: Install Zoom Workplace
  ansible.builtin.include_role:
    name: zoom
  when: linux_release_architecture_map[ansible_facts["architecture"]] == "amd64"

- name: Install latest Ruff release from GitHub
  ansible.builtin.include_role:
    name: ruff

- name: Install latest ty release from GitHub
  ansible.builtin.include_role:
    name: ty

- name: Install latest uv release from GitHub
  ansible.builtin.include_role:
    name: uv

- name: Install Desktop Packages
  ansible.builtin.apt:
    name:
      - openssh-server
      - libreoffice
    state: present
    update_cache: true

- name: Gather installed package facts for legacy Snap cleanup
  ansible.builtin.package_facts:
    manager: auto

- name: Prepare legacy Snap cleanup
  when: "'snapd' in ansible_facts.packages"
  block:
    - name: Ensure snapd socket is enabled and started
      ansible.builtin.systemd_service:
        name: snapd.socket
        enabled: true
        state: started
      register: snapd_socket_configuration

    - name: Ensure snapd has completed initial seeding
      ansible.builtin.systemd_service:
        name: snapd.seeded.service
        state: started
      register: snapd_seed_readiness
      when: >-
        not ansible_check_mode or
        not snapd_socket_configuration.changed

    - name: Remove superseded managed snaps
      when: >-
        not ansible_check_mode or
        (not snapd_socket_configuration.changed and
        not (snapd_seed_readiness.changed | default(true)))
      block:
        - name: Remove superseded Ruff and uv snaps
          community.general.snap:
            name:
              - ruff
              - astral-uv
            state: absent

        - name: Remove superseded Zoom snap
          community.general.snap:
            name: zoom-client
            state: absent
          when: >-
            linux_release_architecture_map[ansible_facts["architecture"]]
            == "amd64"

        - name: Remove superseded Visual Studio Code snap
          community.general.snap:
            name: code
            state: absent

        - name: Remove superseded Discord snap
          community.general.snap:
            name: discord
            state: absent
          when: >-
            linux_release_architecture_map[ansible_facts["architecture"]]
            == "amd64"
