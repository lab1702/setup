---
# Desktop-specific packages

- name: Add user to kvm group
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: kvm
    append: true

- name: Install ChatGPT Desktop
  ansible.builtin.include_role:
    name: chatgpt

- name: Install Claude Desktop
  ansible.builtin.include_role:
    name: claude_desktop

- name: Install Posit RStudio Desktop
  ansible.builtin.include_role:
    name: rstudio
  when: linux_release_architecture_map[ansible_facts["architecture"]] == "amd64"

- name: Install Desktop Packages
  ansible.builtin.apt:
    name:
      - openssh-server
      - libreoffice
    state: present
    update_cache: true

- name: Install Standard Snaps on all supported architectures
  community.general.snap:
    name: ruff

- name: Install AMD64-only Standard Snaps
  community.general.snap:
    name:
      - discord
      - zoom-client
  when: >-
    linux_release_architecture_map[ansible_facts["architecture"]] == "amd64"

- name: Install Classic Snaps on all supported architectures
  community.general.snap:
    name: astral-uv
    classic: true

- name: Install AMD64-only Classic Snaps
  community.general.snap:
    name: code
    classic: true
  when: >-
    linux_release_architecture_map[ansible_facts["architecture"]] == "amd64"
